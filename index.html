:"白村江の戦い","a":"663年","hook":["語呂","ろくろく(66)見(3)ずに白村江で大敗"],"story":"百済復興を助けた倭の軍が唐・新羅連合軍に大敗した。以後、水城や朝鮮式山城を築いて守りを固めた。","use":"乙巳の変(645年)と壬申の乱(672年)の間。防衛強化策とセット"},{"q":"十七条の憲法","a":"604年","hook":["語呂","群れよ(604)、和をもって貴しとなす"],"story":"厩戸王(聖徳太子)が定めたとされる役人の心構え。和の尊重や仏教をあつく敬うことを説いた。","use":"冠位十二階(603年)の翌年。この2つの順番が問われやすい"},{"q":"冠位十二階","a":"603年","hook":["語呂","群れ咲く(603)冠の色、冠位十二階"],"story":"家柄ではなく個人の才能や功績で役人を取り立てるため、冠の色で位を示した制度。","use":"十七条の憲法(604年)・遣隋使(607年)と推古朝の政策の並べ替えで"},{"q":"小野妹子を隋に派遣","a":"607年","hook":["語呂","群れな(607)す波を越え妹子が隋へ"],"story":"小野妹子を隋に送り対等な立場の国書を渡したため、煬帝が不快に思ったと『隋書』に記される。","use":"推古朝の政策(603・604年)との順番。翌年の裴世清来日もセット"},{"q":"遣唐使の停止","a":"894年","hook":["語呂","白紙(894)に戻そう遣唐使"],"story":"菅原道真が唐の衰えと航海の危険を理由に派遣中止を提案した。国風文化が育つ背景の一つ。","use":"道真の左遷(901年)と国風文化の流れで問われる"},{"q":"保元の乱","a":"1156年","hook":["語呂","いい頃(1156)だ保元の乱"],"story":"崇徳上皇と後白河天皇の対立に摂関家の争いが重なり、平清盛・源義朝らの武士が動員された。","use":"平治の乱(1159年)との順番と、勝者・敗者の組み合わせが頻出"},{"q":"平治の乱","a":"1159年","hook":["語呂","いいご苦(1159)労、平治の乱"],"story":"平清盛が源義朝を破り、平氏が政治の中心へ進んだ。義朝の子頼朝は伊豆へ流された。","use":"保元の乱(1156年)の3年後。清盛の太政大臣(1167年)へつなげる"},{"q":"壇ノ浦の戦い","a":"1185年","hook":["語呂","いい箱(1185)に平家が沈む壇ノ浦"],"story":"源義経らが平氏を滅ぼし、安徳天皇も入水した。同じ年、頼朝は守護・地頭の設置を認められた。","use":"守護・地頭の設置も同じ1185年。頼朝の挙兵(1180年)から順に"},{"q":"承久の乱","a":"1221年","hook":["語呂","人に不意(1221)打ち、承久の乱"],"story":"後鳥羽上皇が幕府を倒そうとしたが敗れ隠岐へ流された。幕府は京都に六波羅探題を置いた。","use":"六波羅探題の設置と新補地頭がセット。御成敗式目(1232年)の前"},{"q":"御成敗式目","a":"1232年","hook":["語呂","ひふみに(1232)定める御成敗式目"],"story":"執権北条泰時が定めた最初の武家法。頼朝以来の先例と武士社会の道理を基準にした。","use":"承久の乱(1221年)の後。建武式目(1336年)との区別も問われる"},{"q":"永仁の徳政令","a":"1297年","hook":["語呂","衣服な(1297)くとも借金チャラの徳政令"],"story":"元寇の後に苦しくなった御家人を救うため、執権北条貞時が質入れ・売却した土地をただで戻させた。","use":"元寇(1274・1281年)の後。正長の土一揆の徳政要求と区別"},{"q":"建武の新政","a":"1334年","hook":["語呂","いざ見よ(1334)建武の新政"],"story":"鎌倉幕府の滅亡後、後醍醐天皇が始めた天皇中心の政治。武士の不満を招き約2年半でくずれた。","use":"幕府滅亡(1333年)の翌年。尊氏の将軍就任(1338年)との順番"},{"q":"南北朝の合一","a":"1392年","hook":["語呂","いざ国(1392)ひとつに南北朝"],"story":"足利義満の仲介で南朝の後亀山天皇が北朝の後小松天皇に譲位し、約60年続いた分裂が終わった。","use":"義満の業績として日明貿易(1404年)・金閣とセット"},{"q":"日明貿易の開始","a":"1404年","hook":["語呂","いよ!おし(1404)ごと勘合貿易"],"story":"足利義満が明と始めた朝貢形式の貿易。倭寇と区別するため勘合という証明書を使った。","use":"南北朝の合一(1392年)の後。勘合と倭寇の関係が問われる"},{"q":"正長の土一揆","a":"1428年","hook":["語呂","石には(1428)刻む正長の土一揆"],"story":"近江の馬借の蜂起をきっかけに、農民らが徳政を求めて京都周辺の酒屋や土倉をおそった。","use":"山城の国一揆(1485年)・加賀の一向一揆(1488年)との順番"},{"q":"室町幕府の滅亡","a":"1573年","hook":["語呂","以後涙(1573)の室町幕府"],"story":"織田信長が15代将軍足利義昭を京都から追い出し、室町幕府は事実上滅びた。","use":"桶狭間(1560年)と長篠(1575年)の間。信長の事績の並べ替え"},{"q":"本能寺の変","a":"1582年","hook":["語呂","いちご(15)パンツ(82)で本能寺"],"story":"明智光秀が京都の本能寺で織田信長をおそい自害させた。直後に羽柴秀吉が山崎の戦いで光秀を討った。","use":"太閤検地の開始・天正遣欧使節の派遣も同じ1582年"},{"q":"刀狩令","a":"1588年","hook":["語呂","以後刃は(1588)持たせぬ刀狩令"],"story":"豊臣秀吉が農民から刀や鉄砲などの武器を取り上げた。一揆を防ぎ、兵農分離を進めた。","use":"太閤検地(1582年〜)とセットで兵農分離。バテレン追放令の翌年"},{"q":"武家諸法度(元和令)","a":"1615年","hook":["語呂","一路行こ(1615)う、大名統制"],"story":"大坂夏の陣の直後、徳川家康の命で2代将軍秀忠の名で出された大名を取りしまる法令。","use":"一国一城令・禁中並公家諸法度も同じ1615年。寛永令(1635年)と区別"},{"q":"島原・天草一揆","a":"1637年","hook":["語呂","異論みな(1637)押さえこむ島原の乱"],"story":"重い年貢とキリシタン弾圧に苦しむ島原・天草の農民らが、益田(天草四郎)時貞を中心に立ち上がった。","use":"ポルトガル船来航禁止(1639年)へ続く鎖国の流れで出る"},{"q":"ポルトガル船の来航禁止","a":"1639年","hook":["語呂","広さ苦(1639)しい鎖国の窓口"],"story":"島原・天草一揆の後、キリスト教の広がりを警戒した幕府がポルトガル船の来航を禁止した。","use":"島原・天草一揆(1637年)とオランダ商館の出島移転(1641年)の間"},{"q":"享保の改革","a":"1716年","hook":["語呂","いな、色(1716)男の吉宗改革"],"story":"8代将軍徳川吉宗が始めた改革。上げ米、足高の制、目安箱、公事方御定書などを行った。","use":"寛政(1787年)・天保(1841年)と三大改革の順番と中心人物"},{"q":"寛政の改革","a":"1787年","hook":["語呂","非難(17)はな(87)い寛政の改革"],"story":"老中松平定信が始めた改革。囲米、棄捐令、寛政異学の禁などで幕府政治を引きしめた。","use":"田沼時代の後。三大改革の2番目として順番と政策が問われる"},{"q":"天保の改革","a":"1841年","hook":["語呂","いや、良い(1841)倹約?天保の改革"],"story":"老中水野忠邦が始めた改革。株仲間の解散や人返しの法を行ったが、上知令の失敗で失脚した。","use":"大塩平八郎の乱(1837年)の後。三大改革の最後"},{"q":"日米修好通商条約","a":"1858年","hook":["語呂","いや、ご破算(1858)にできぬ不平等条約"],"story":"大老井伊直弼が天皇の許しを得ずに調印した。領事裁判権を認め、関税自主権のない不平等条約だった。","use":"日米和親条約(1854年)との違い。安政の大獄も同じ1858年"},{"q":"大政奉還","a":"1867年","hook":["語呂","いやむな(1867)しい大政奉還"],"story":"15代将軍徳川慶喜が政権を朝廷に返した。同じ年の末に王政復古の大号令が出された。","use":"薩長同盟(1866年)の後、王政復古の大号令も同じ1867年"},{"q":"五箇条の誓文","a":"1868年","hook":["語呂","いや、老婆(1868)心で五箇条の誓文"],"story":"明治天皇が神に誓う形で新政府の基本方針を示した。会議を開き世論を大切にすることなどをうたった。","use":"翌日の五榜の掲示とセット。戊辰戦争の開始も同じ1868年"},{"q":"廃藩置県","a":"1871年","hook":["語呂","いや無い(1871)藩、廃藩置県"],"story":"藩を廃止して府と県を置き、中央から府知事・県令を送った。中央集権の体制が固まった。","use":"版籍奉還(1869年)との順番が頻出。岩倉使節団の出発も1871年"},{"q":"地租改正","a":"1873年","hook":["語呂","いやな見(1873)直し地租改正"],"story":"地価の3%を土地の持ち主が現金で納める税に改めた。反対一揆が起き、のちに2.5%へ下げられた。","use":"徴兵令も同じ1873年。学制(1872年)と合わせて三大改革"},{"q":"民撰議院設立建白書","a":"1874年","hook":["語呂","嫌な世(1874)に民撰議院建白"],"story":"板垣退助らが政府に国会を開くよう求めて提出した。自由民権運動の始まりとなった。","use":"明治六年の政変(1873年)の後。国会開設の勅諭(1881年)へ"},{"q":"西南戦争","a":"1877年","hook":["語呂","嫌な泣(1877)き別れ西南戦争"],"story":"西郷隆盛を中心とする鹿児島の士族が起こした最大で最後の士族反乱。徴兵制の政府軍がしずめた。","use":"佐賀の乱(1874年)など士族反乱の最後。以後は言論の民権運動へ"},{"q":"国会開設の勅諭","a":"1881年","hook":["語呂","いや、はい(1881)と国会開設を約束"],"story":"明治十四年の政変のときに出され、10年後の1890年に国会を開くことを約束した。","use":"自由党結成も同じ1881年。第1回帝国議会(1890年)と対で"},{"q":"内閣制度の創設","a":"1885年","hook":["語呂","いや、箱(1885)作り内閣制度"],"story":"太政官制をやめて内閣制度をつくり、伊藤博文が初代の内閣総理大臣になった。","use":"大日本帝国憲法(1889年)の前。憲法制定までの準備の順番で出る"},{"q":"下関条約","a":"1895年","hook":["語呂","いや食後(1895)に講和調印、下関"],"story":"日清戦争の講和条約。清は朝鮮の独立を認め、遼東半島・台湾などをゆずり、賠償金を払うと約束した。","use":"直後の三国干渉(1895年)で遼東半島を返還。ポーツマス条約と比較"},{"q":"日英同盟","a":"1902年","hook":["語呂","行く鬼(1902)退治、日英同盟"],"story":"ロシアの南下に対抗するため日本とイギリスが結んだ同盟。日露戦争の背景になった。","use":"日露戦争(1904年)の前。第一次大戦参戦(1914年)の理由にも使う"},{"q":"ポーツマス条約","a":"1905年","hook":["語呂","行く丸子(1905)、ポーツマスへ"],"story":"アメリカの仲介で結ばれた日露戦争の講和条約。賠償金が取れず、日比谷焼打ち事件が起きた。","use":"下関条約(1895年)との内容比較が頻出。韓国併合(1910年)へ"},{"q":"韓国併合","a":"1910年","hook":["語呂","行くとお(1910)い道、韓国併合"],"story":"韓国併合条約によって韓国を植民地にし、統治機関として朝鮮総督府を置いた。","use":"日露戦争後の日韓協約の流れ。大逆事件も同じ1910年"},{"q":"関税自主権の回復","a":"1911年","hook":["語呂","行くいい(1911)条約改正"],"story":"外務大臣小村寿太郎がアメリカとの条約を改正し、関税自主権を完全に取り戻した。","use":"領事裁判権の撤廃(1894年・陸奥宗光)と人物・年の組み合わせ"},{"q":"第一次世界大戦に参戦","a":"1914年","hook":["語呂","行く意志(1914)で大戦参戦"],"story":"日英同盟を理由にドイツに宣戦し、中国の青島やドイツ領南洋諸島を占領した。","use":"二十一カ条の要求(1915年)・大戦景気へつなげる"},{"q":"二十一カ条の要求","a":"1915年","hook":["語呂","行く行こ(1915)う中国へ二十一カ条"],"story":"大隈重信内閣が中国の袁世凱政府に、山東省のドイツ権益を引きつぐことなどを求めた。","use":"第一次大戦参戦(1914年)の翌年。五・四運動(1919年)の背景"},{"q":"米騒動","a":"1918年","hook":["語呂","行く嫌(1918)な米価に米騒動"],"story":"シベリア出兵を見こした米の買い占めで米価が急上昇し、富山から全国に広がった。寺内内閣は総辞職。","use":"直後の原敬による本格的政党内閣(1918年)とセット"},{"q":"満州事変","a":"1931年","hook":["語呂","戦(193)一(1)発、満州事変"],"story":"関東軍が奉天郊外の柳条湖で南満州鉄道の線路を爆破し、軍事行動を始めた。","use":"満州国建国(1932年)・国際連盟脱退(1933年)との順番"},{"q":"五・一五事件","a":"1932年","hook":["語呂","戦に(1932)倒れる犬養首相"],"story":"海軍の青年将校らが首相官邸をおそい犬養毅首相を暗殺した。これで政党内閣が途絶えた。","use":"二・二六事件(1936年)との区別(海軍か陸軍か、首相)が頻出"},{"q":"国際連盟脱退","a":"1933年","hook":["語呂","行く散々(1933)、連盟脱退"],"story":"リットン調査団の報告をもとに満州国が認められなかったことに反発し、日本は脱退を通告した。","use":"満州事変(1931年)→満州国(1932年)→脱退の流れで"},{"q":"二・二六事件","a":"1936年","hook":["語呂","行く寒(1936)い雪の日、二・二六"],"story":"陸軍の皇道派青年将校が約1400名の兵をひきいて首相官邸などをおそい、高橋是清蔵相らを殺害した。","use":"五・一五事件(1932年)と区別。以後軍部の発言力が強まる"},{"q":"日中戦争","a":"1937年","hook":["語呂","行く皆(1937)、日中戦争へ"],"story":"北京郊外の盧溝橋事件をきっかけに、日本と中国が全面戦争に入った。","use":"国家総動員法(1938年)・太平洋戦争(1941年)との順番"},{"q":"太平洋戦争の開戦","a":"1941年","hook":["語呂","行くよ一(1941)斉、真珠湾"],"story":"日本軍がハワイの真珠湾を攻撃し、マレー半島に上陸してアメリカ・イギリスと開戦した。","use":"日ソ中立条約も同じ1941年。三国同盟(1940年)の後"},{"q":"ポツダム宣言の受諾","a":"1945年","hook":["語呂","行く汚(1945)れた焦土で終戦"],"story":"広島・長崎への原爆投下とソ連の参戦を経て、日本はポツダム宣言を受け入れ降伏した。","use":"戦後改革のスタート。日本国憲法公布(1946年)へ続く"},{"q":"サンフランシスコ平和条約","a":"1951年","hook":["語呂","行く恋(1951)、独立への講和"],"story":"吉田茂首相が48か国と調印した。同じ日に日米安全保障条約も結ばれ、翌年日本は独立を回復した。","use":"日米安保条約も同じ1951年。新安保条約(1960年)と区別"},{"q":"日ソ共同宣言","a":"1956年","hook":["語呂","国連に行く頃(1956)、日ソ宣言"],"story":"鳩山一郎首相がソ連との国交を回復した。ソ連の反対がなくなり、同じ年に国際連合加盟が実現した。","use":"国連加盟も同じ1956年。日韓(1965年)・日中(1972年)と国交の順番"},{"q":"日米新安保条約","a":"1960年","hook":["語呂","行く群れ(1960)た安保闘争"],"story":"岸信介内閣がアメリカと結び直した。激しい安保闘争が起き、岸内閣は条約発効後に退陣した。","use":"次の池田内閣の所得倍増計画(1960年)とセット"},{"q":"沖縄返還","a":"1972年","hook":["語呂","行く何(1972)の旅券も要らぬ沖縄へ"],"story":"佐藤栄作内閣のもとで沖縄が日本に復帰した。ただし米軍基地の多くはそのまま残された。","use":"日中共同声明も同じ1972年。小笠原返還(1968年)と区別"},{"q":"仏教公伝","a":"538年","hook":["語呂","ごみ屋(538)さんにも仏教伝来"],"story":"百済の聖明王が欽明天皇に仏像や経典を伝えた。『日本書紀』にもとづく552年説もある。","use":"蘇我氏と物部氏の崇仏論争につなげる。飛鳥文化の起点"},{"q":"改新の詔","a":"646年","hook":["語呂","むしろ(646)改新の詔で公地公民"],"story":"乙巳の変の翌年に出され、公地公民、班田収授、新しい地方制度などの方針を示した。","use":"乙巳の変(645年)の翌年。白村江(663年)との順番"},{"q":"古事記","a":"712年","hook":["語呂","ナイフ(712)で切り開く古事記"],"story":"稗田阿礼がよみ覚えた内容を太安万侶が書きまとめた、現存する最古の歴史書。","use":"日本書紀(720年)との順番と編者の区別が頻出"},{"q":"日本書紀","a":"720年","hook":["語呂","なにを(720)書き記す日本書紀"],"story":"舎人親王らが編さんした漢文・編年体の正史。六国史の最初にあたる。","use":"古事記(712年)の8年後。六国史の始まりとして問われる"},{"q":"三世一身法","a":"723年","hook":["語呂","なにさ(723)三世一身"],"story":"新しく用水を引いて開墾した土地は三代、古い用水を使った場合は本人一代の私有を認めた。","use":"墾田永年私財法(743年)との順番と内容の違いが頻出"},{"q":"東大寺の大仏開眼","a":"752年","hook":["語呂","なごに(752)っこり大仏開眼"],"story":"聖武天皇の願いでつくられた東大寺の盧舎那仏が完成し、開眼供養が行われた。","use":"国分寺建立の詔(741年)・大仏造立の詔(743年)の後"},{"q":"長岡京に遷都","a":"784年","hook":["語呂","名は良(784)い都、長岡京"],"story":"桓武天皇が奈良の仏教勢力から離れるため移した都。藤原種継の暗殺などもあり10年で放棄された。","use":"平城京(710年)→長岡京→平安京(794年)の順番で出る"},{"q":"坂上田村麻呂が征夷大将軍に","a":"797年","hook":["語呂","泣くな(797)蝦夷、田村麻呂"],"story":"桓武天皇に征夷大将軍に任じられ、802年に胆沢城を築いて蝦夷の阿弖流為を降伏させた。","use":"平安京遷都(794年)の直後。桓武天皇の二大事業(造都と征夷)"},{"q":"菅原道真が大宰府へ左遷","a":"901年","hook":["語呂","暮れい(901)に大宰府へ道真"],"story":"右大臣だった菅原道真が藤原時平のはかりごとで大宰府に左遷され、2年後にその地で亡くなった。","use":"遣唐使停止(894年)の後。藤原氏の他氏排斥の一つ"},{"q":"安和の変","a":"969年","hook":["語呂","黒く(969)染まる安和の変"],"story":"左大臣源高明が謀反の疑いで大宰府に左遷された。以後、摂政・関白がほぼ常に置かれた。","use":"藤原氏の他氏排斥の最後。承和の変・応天門の変との順番"},{"q":"延久の荘園整理令","a":"1069年","hook":["語呂","荘園を登録(1069)、延久の整理令"],"story":"後三条天皇が記録荘園券契所を置き、証拠書類の不十分な荘園を停止した。","use":"白河上皇の院政(1086年)の前。摂関家に遠慮しない天皇の政治"},{"q":"院政の開始","a":"1086年","hook":["語呂","入れ歯む(1086)ずむず白河院政"],"story":"白河天皇が幼い堀河天皇に位をゆずり、上皇として政治の実権をにぎった。","use":"延久の荘園整理令(1069年)の後。保元の乱(1156年)へ"},{"q":"平清盛が太政大臣に","a":"1167年","hook":["語呂","いいむな(1167)しさも知らず清盛太政大臣"],"story":"平清盛が武士として初めて太政大臣になった。娘の徳子を高倉天皇の后とした。","use":"平治の乱(1159年)の後。頼朝挙兵(1180年)までの平氏政権"},{"q":"源頼朝の挙兵","a":"1180年","hook":["語呂","いい晴れ(1180)舞台、頼朝挙兵"],"story":"以仁王の令旨を受けて源頼朝が伊豆で兵をあげた。同じ年、鎌倉に侍所を置いた。","use":"侍所設置・福原遷都も同じ1180年。壇ノ浦(1185年)へ"},{"q":"奥州藤原氏の滅亡","a":"1189年","hook":["語呂","いい役(1189)回りの頼朝が奥州へ"],"story":"源義経を討った藤原泰衡を源頼朝が攻め、奥州藤原氏は4代で滅びた。","use":"壇ノ浦(1185年)と頼朝の将軍就任(1192年)の間"},{"q":"山城の国一揆","a":"1485年","hook":["語呂","いよ!箱(1485)入りの山城自治"],"story":"南山城の国人と農民が争う畠山氏の両軍を国外に追い出し、8年間自治を行った。","use":"正長の土一揆(1428年)・加賀の一向一揆(1488年)との順番"},{"q":"加賀の一向一揆","a":"1488年","hook":["語呂","意思は早(1488)し、加賀の一向一揆"],"story":"浄土真宗(一向宗)の門徒らが守護富樫政親を倒し、約100年にわたり加賀を支配した。","use":"山城の国一揆(1485年)の3年後。一揆の種類の区別で出る"},{"q":"桶狭間の戦い","a":"1560年","hook":["語呂","以後群れ(1560)なす信長、桶狭間"],"story":"織田信長が尾張の桶狭間で今川義元の大軍を奇襲し、義元を討ち取った。","use":"信長の戦いの順番(桶狭間→長篠)を問う並べ替えで"},{"q":"長篠の戦い","a":"1575年","hook":["語呂","以後(15)名古(75)屋の信長、武田を破る"],"story":"織田・徳川の連合軍が大量の鉄砲を使い、武田勝頼の騎馬隊を破った。","use":"室町幕府滅亡(1573年)の後。安土城築城(1576年)へ"},{"q":"バテレン追放令","a":"1587年","hook":["語呂","以後離(1587)れよ宣教師"],"story":"豊臣秀吉が宣教師の国外退去を命じた。ただし南蛮貿易は認めたため、取りしまりは徹底しなかった。","use":"刀狩令(1588年)の前年。江戸幕府の禁教令と区別"},{"q":"文禄の役","a":"1592年","hook":["語呂","以後国に(1592)出兵、文禄の役"],"story":"豊臣秀吉が明の征服をめざして朝鮮に出兵した。李舜臣の水軍や義兵の抵抗で苦戦した。","use":"慶長の役(1597年)と合わせて朝鮮侵略。元寇との区別も"},{"q":"異国船打払令","a":"1825年","hook":["語呂","いやにご(1825)ろつく異国船"],"story":"外国船の接近が続いたため、清とオランダ以外の外国船を追い払うよう命じた。","use":"モリソン号事件(1837年)・天保の薪水給与令(1842年)と流れで"},{"q":"大塩平八郎の乱","a":"1837年","hook":["語呂","嫌味な(1837)役人に大塩が挙兵"],"story":"元大坂町奉行所の与力大塩平八郎が、天保の飢饉に苦しむ人々を救うため大坂で兵をあげた。","use":"モリソン号事件も同じ1837年。天保の改革(1841年)の背景"},{"q":"桜田門外の変","a":"1860年","hook":["語呂","いや群れ(1860)て井伊を襲撃"],"story":"安政の大獄に反発した水戸浪士らが、江戸城桜田門外で大老井伊直弼を暗殺した。","use":"安政の大獄(1858年)の後。公武合体策へ移る転換点"},{"q":"薩長同盟","a":"1866年","hook":["語呂","いやろくろく(1866)口きかぬ薩長が同盟"],"story":"坂本龍馬らの仲立ちで、対立していた薩摩藩と長州藩が倒幕に向けて手を結んだ。","use":"第2次長州征討も1866年。大政奉還(1867年)の前"},{"q":"学制","a":"1872年","hook":["語呂","嫌な不(1872)就学なくす学制"],"story":"フランスの制度にならい、すべての国民が学ぶことをめざして全国に小学校をつくると定めた。","use":"徴兵令・地租改正(1873年)と明治の三大改革の並べ替え"},{"q":"日朝修好条規","a":"1876年","hook":["語呂","嫌な無(1876)理強い、日朝修好条規"],"story":"江華島事件をきっかけに朝鮮と結んだ条約。日本の領事裁判権などを認めさせた不平等条約。","use":"江華島事件(1875年)の翌年。日清修好条規(1871年)と区別"},{"q":"ラクスマンの根室来航","a":"1792年","hook":["語呂","いな、国(1792)交はムリとラクスマン"],"story":"ロシア使節ラクスマンが漂流民の大黒屋光太夫を連れて根室に来て、通商を求めた。","use":"レザノフの長崎来航(1804年)との順番と来航地の区別"},{"q":"ベルサイユ条約","a":"1919年","hook":["語呂","一句一句(1919)ベルサイユ"],"story":"第一次世界大戦の講和条約。日本は山東省の旧ドイツ権益と赤道以北の南洋諸島の委任統治権を得た。","use":"二十一カ条(1915年)・五・四運動(1919年)・国際連盟とセット"},{"q":"関東大震災","a":"1923年","hook":["語呂","行く兄さ(1923)ん、関東大震災"],"story":"9月1日に関東地方をおそった大地震。混乱の中で朝鮮人や社会主義者が殺される事件も起きた。","use":"震災手形が金融恐慌(1927年)の原因に。普通選挙法(1925年)の前"},{"q":"世界恐慌","a":"1929年","hook":["語呂","行く肉(1929)屋も倒れる世界恐慌"],"story":"ニューヨークの株価暴落から世界に広がった恐慌。翌年の金解禁と重なり日本は昭和恐慌におちいった。","use":"金融恐慌(1927年)・金解禁(1930年)との順番が頻出"},{"q":"国家総動員法","a":"1938年","hook":["語呂","行く散髪(1938)屋も総動員"],"story":"第1次近衛文麿内閣が制定した。議会の承認なしに人や物資を戦争に動員できるようにした。","use":"日中戦争(1937年)の翌年。大政翼賛会(1940年)へ"},{"q":"日独伊三国同盟","a":"1940年","hook":["語呂","行く潮(1940)の流れで三国同盟"],"story":"日本・ドイツ・イタリアが結んだ軍事同盟。アメリカとの対立を決定的にした。","use":"大政翼賛会・北部仏印進駐も同じ1940年。太平洋戦争の前"},{"q":"教育基本法","a":"1947年","hook":["語呂","行くよな(1947)学校、教育基本法"],"story":"民主主義にもとづく教育の理念を示し、9年間の義務教育を定めた。同じ年に学校教育法も制定された。","use":"日本国憲法の施行・独占禁止法も同じ1947年"},{"q":"警察予備隊の創設","a":"1950年","hook":["語呂","行く子を(1950)守れと警察予備隊"],"story":"朝鮮戦争が始まり、GHQの指令でつくられた。のち保安隊を経て1954年に自衛隊となった。","use":"朝鮮戦争・特需も1950年。自衛隊発足(1954年)と区別"},{"q":"55年体制の成立","a":"1955年","hook":["語呂","行く午後(1955)、自民党結成"],"story":"社会党の再統一に対抗し、自由党と日本民主党が保守合同して自由民主党を結成した。","use":"日ソ共同宣言(1956年)の前年。1993年の細川内閣で終わる"},{"q":"東京オリンピック","a":"1964年","hook":["語呂","行く虫(1964)も見る東京五輪"],"story":"アジアで初めてのオリンピック。開幕の直前に東海道新幹線が開業した。","use":"東海道新幹線開業・OECD加盟も同じ1964年。高度経済成長の象徴"},{"q":"日韓基本条約","a":"1965年","hook":["語呂","行く向こう(1965)、韓国と国交"],"story":"佐藤栄作内閣が韓国と結び、韓国政府を朝鮮にある唯一の合法政府と認めて国交を開いた。","use":"日ソ(1956年)・日中(1972年)と国交正常化の順番"},{"q":"第1次石油危機","a":"1973年","hook":["語呂","行くな、見(1973)ろ石油ショック"],"story":"第4次中東戦争をきっかけに原油価格が急上昇した。翌年、日本は戦後初のマイナス成長となった。","use":"高度経済成長の終わり。変動相場制への移行(1973年)とセット"},{"q":"日中平和友好条約","a":"1978年","hook":["語呂","行くなや(1978)と言わず中国と条約"],"story":"福田赳夫内閣が中国と結んだ条約。1972年の日中共同声明を受けて締結された。","use":"日中共同声明(1972年・田中角栄)と内閣・年の区別"},{"q":"消費税の導入","a":"1989年","hook":["語呂","一苦八苦(1989)の消費税"],"story":"竹下登内閣のもとで税率3%の消費税が導入された。","use":"昭和から平成への改元・冷戦終結(マルタ会談)も同じ1989年"},{"q":"阪神・淡路大震災","a":"1995年","hook":["語呂","行く救護(1995)、阪神・淡路大震災"],"story":"1月17日に兵庫県南部をおそった大地震。6000人以上が亡くなり、ボランティア元年とも呼ばれる。","use":"地下鉄サリン事件も同じ1995年。平成期の社会の出来事"},{"q":"卑弥呼が魏に遣使","a":"239年","hook":["語呂","文来(239)る、卑弥呼から魏へ"],"story":"邪馬台国の女王卑弥呼が魏に使いを送り、親魏倭王の称号と金印、銅鏡を授かったと『魏志』倭人伝にある。","use":"奴国の金印(57年)との順番と、出典(後漢書か魏志か)の区別"},{"q":"奴国王が後漢から金印","a":"57年","hook":["語呂","こな(57)いだもらった漢委奴国王の金印"],"story":"倭の奴国王が後漢に使いを送り、光武帝から印綬を授かったと『後漢書』東夷伝に記される。","use":"卑弥呼の遣使(239年)と区別。志賀島で見つかった金印とつなげる"},{"q":"八幡製鉄所の操業","a":"1901年","hook":["語呂","行く老い(1901)も若きも八幡で鉄"],"story":"日清戦争の賠償金の一部も使って北九州に建てられた官営の製鉄所が操業を始めた。","use":"下関条約(1895年)の賠償金とつなげる。重工業の産業革命"}],"chem":[{"q":"H","a":"水素","hook":["語源","ギリシャ語「水(hydro)を生む(genes)」がhydrogenの由来"],"story":"宇宙で最も多い元素。燃えると水だけができるので、燃料電池車のクリーンな燃料として注目されている。","use":"原子番号1で全ての基本。酸の性質を決めるH⁺のもとにもなる。"},{"q":"O","a":"酸素","hook":["語源","ギリシャ語「酸(oxys)を生む」。昔は酸に必ず含まれると考えられた"],"story":"ラボアジエが命名。空気の約21%を占め、呼吸や燃焼に欠かせない。","use":"酸化還元・燃焼の計算で毎回登場。過酸化水素の分解でも発生する。"},{"q":"C","a":"炭素","hook":["語源","ラテン語carbo(木炭)が由来。カーボンの語源"],"story":"ダイヤモンドと黒鉛は同じ炭素からできた同素体。有機化合物の骨格になる元素。","use":"同素体の問題や有機化学で必ず出る。原子量12は計算の基本。"},{"q":"N","a":"窒素","hook":["連想","生き物を「窒息」させる気体なので窒素と名づけられた"],"story":"空気の約78%を占める。反応しにくいため、スナック菓子の袋に詰めて酸化を防ぐのに使われる。","use":"お菓子の袋の充填ガス。アンモニアや硝酸の原料として試験に出る。"},{"q":"H₂O","a":"水","hook":["分解","H₂（水素2個）とO（酸素1個）で水"],"story":"分子が折れ線形で極性があり、水素結合のため分子量の割に沸点が高い。","use":"水素結合・状態変化・中和反応など、あらゆる単元に登場する。"},{"q":"CO₂","a":"二酸化炭素","hook":["分解","CにO₂（酸素2個）がつくので「二酸化」炭素"],"story":"固体はドライアイスで、液体を経ずに昇華する。石灰水を白くにごらせる。","use":"ドライアイスや炭酸飲料。石灰水との反応は定番問題。"},{"q":"NaCl","a":"塩化ナトリウム","hook":["分解","Na（ナトリウム）とCl（塩素）で塩化ナトリウム"],"story":"食塩の主成分。水溶液を電気分解すると水酸化ナトリウムや塩素がつくられる。","use":"食卓の塩。イオン結晶の代表例として出題される。"},{"q":"H⁺","a":"水素イオン","hook":["そのまま","水素Hが電子を1個失ってプラスになったイオン"],"story":"水溶液中でH⁺を出す物質を酸と呼ぶ（アレニウスの定義）。濃度でpHが決まる。","use":"酸・塩基、pH計算で必ず使う。"},{"q":"OH⁻","a":"水酸化物イオン","hook":["注意","「水酸イオン」ではなく「水酸化物イオン」が正式名"],"story":"水溶液中でOH⁻を出す物質を塩基と呼ぶ。H⁺と結びつくと水になる。","use":"中和反応や塩基の定義で頻出。"},{"q":"HCl","a":"塩化水素","hook":["注意","気体は塩化水素、水溶液にすると「塩酸」と呼ぶ"],"story":"水によく溶け、水溶液の塩酸は強酸。胃液にも含まれている。","use":"強酸の代表。トイレ用洗剤の一部にも塩酸が使われる。"},{"q":"H₂SO₄","a":"硫酸","hook":["分解","SO₄（硫酸イオン）にH⁺が2個で硫酸"],"story":"濃硫酸は脱水作用が強く、砂糖にかけると黒く炭化する。2価の強酸。","use":"自動車の鉛蓄電池の電解液。中和滴定や鉛蓄電池の問題に出る。"},{"q":"NaOH","a":"水酸化ナトリウム","hook":["分解","Na⁺とOH⁻で水酸化ナトリウム"],"story":"別名、苛性ソーダ。空気中の水分を吸って溶ける潮解性がある強塩基。","use":"石けんづくりや排水管洗浄剤。中和滴定の定番。"},{"q":"NH₃","a":"アンモニア","hook":["連想","鼻をつく刺激臭の気体。水に非常によく溶ける"],"story":"ハーバー・ボッシュ法で窒素と水素から大量につくられ、肥料の原料となった。","use":"化学肥料の原料。弱塩基や気体の製法の問題で出る。"},{"q":"HNO₃","a":"硝酸","hook":["分解","NO₃（硝酸イオン）にH⁺が1個で硝酸"],"story":"光で分解するので褐色びんで保存する。鉄やアルミニウムは濃硝酸で不動態になる。","use":"オストワルト法、銅との反応、不動態の問題で頻出。"},{"q":"He","a":"ヘリウム","hook":["語源","ギリシャ語helios(太陽)。太陽の光の観察から発見された"],"story":"水素の次に軽い気体で燃えない。風船や飛行船に使われる。","use":"浮かぶ風船や声が高くなるガス。貴ガスの代表として出る。"},{"q":"Cl⁻","a":"塩化物イオン","hook":["注意","「塩素イオン」ではなく「塩化物イオン」が正式名"],"story":"塩素原子が電子を1個受け取ったイオン。銀イオンと出会うと白い沈殿をつくる。","use":"食塩水に含まれる。硝酸銀による検出が定番。"},{"q":"Na⁺","a":"ナトリウムイオン","hook":["そのまま","Naが電子を1個失ったイオン"],"story":"体液の濃さの調節や神経の信号伝達に関わる。炎色反応は黄色。","use":"食塩や汗に含まれる。イオン化の問題で出る。"},{"q":"SO₄²⁻","a":"硫酸イオン","hook":["分解","S1個とO4個、マイナス2価で硫酸イオン"],"story":"バリウムイオンと結びつくと水に溶けない白い硫酸バリウムの沈殿ができる。","use":"多原子イオンの代表。沈殿反応で頻出。"},{"q":"NH₄⁺","a":"アンモニウムイオン","hook":["分解","NH₃にH⁺が1個くっついてできたイオン"],"story":"アンモニアの非共有電子対にH⁺が配位結合してできる。4つのN-H結合は区別できない。","use":"化学肥料（硫安など）に含まれる。配位結合の例として出る。"},{"q":"CO₃²⁻","a":"炭酸イオン","hook":["分解","C1個とO3個、マイナス2価で炭酸イオン"],"story":"カルシウムイオンと結びつくと炭酸カルシウムになる。酸を加えると二酸化炭素が出る。","use":"石灰石や貝殻の成分。炭酸塩と酸の反応で出る。"},{"q":"NO₃⁻","a":"硝酸イオン","hook":["分解","N1個とO3個、マイナス1価で硝酸イオン"],"story":"硝酸塩はほとんどが水に溶ける。植物の肥料として窒素源になる。","use":"肥料に含まれる。沈殿をつくらないイオンとして出る。"},{"q":"CH₄","a":"メタン","hook":["分解","C1個にH4個。最も簡単な炭化水素"],"story":"天然ガスの主成分で、都市ガスに使われる。正四面体形の分子。","use":"家庭の都市ガス。アルカンの最初の例として出る。"},{"q":"CH₃COOH","a":"酢酸","hook":["分解","COOH（カルボキシ基）をもつカルボン酸"],"story":"食酢に4〜5%ほど含まれる。純粋な酢酸は冬に凍るので氷酢酸と呼ばれる。","use":"お酢の酸っぱさの正体。弱酸の代表で電離度の問題に出る。"},{"q":"F","a":"フッ素","hook":["語源","ラテン語fluere(流れる)。蛍石が鉱石を溶けやすくする融剤に使われたことから"],"story":"電気陰性度が全元素で最大。フッ素樹脂はフライパンのこげつき防止加工に使われる。","use":"歯みがき粉のフッ素配合。電気陰性度の問題で必ず出る。"},{"q":"Ne","a":"ネオン","hook":["語源","ギリシャ語neos(新しい)。新しく見つかった気体だから"],"story":"電圧をかけると赤橙色に光るため、ネオンサインに使われた。","use":"街のネオンサイン。貴ガスや電子配置の問題に出る。"},{"q":"Ar","a":"アルゴン","hook":["語源","ギリシャ語argos(怠け者)。ほとんど反応しないことから"],"story":"空気中に約1%含まれ、空気中の貴ガスでは最も多い。電球の中に封入される。","use":"白熱電球や溶接の保護ガス。空気の組成で出る。"},{"q":"Li","a":"リチウム","hook":["語源","ギリシャ語lithos(石)。鉱物から見つかったため"],"story":"最も軽い金属。炎色反応は赤色。リチウムイオン電池に使われる。","use":"スマホのリチウムイオン電池。炎色反応で出る。"},{"q":"CO","a":"一酸化炭素","hook":["注意","Oが1個だけ。CO₂とまちがえないように"],"story":"無色無臭で有毒。血液中のヘモグロビンと強く結びつき、酸素を運べなくする。","use":"不完全燃焼で発生し、中毒事故の原因になる。還元剤としても出る。"},{"q":"H₂O₂","a":"過酸化水素","hook":["分解","水H₂OよりOが1個多い「過」酸化水素"],"story":"約3%の水溶液はオキシドールとして消毒に使われる。酸化マンガン(Ⅳ)を加えると酸素が発生する。","use":"傷の消毒液。酸素の製法や酸化剤・還元剤の問題で出る。"},{"q":"NaHCO₃","a":"炭酸水素ナトリウム","hook":["分解","Na⁺とHCO₃⁻（炭酸水素イオン）の組み合わせ"],"story":"重曹のこと。加熱すると二酸化炭素を出して分解するので、ふくらし粉に使われる。","use":"ベーキングパウダーや掃除用の重曹。熱分解の反応式で出る。"},{"q":"Na₂CO₃","a":"炭酸ナトリウム","hook":["分解","Na⁺が2個とCO₃²⁻で炭酸ナトリウム"],"story":"アンモニアソーダ法（ソルベー法）で工業的につくられ、ガラスの原料になる。","use":"ガラスの原料。ソルベー法の問題で頻出。"},{"q":"CaCO₃","a":"炭酸カルシウム","hook":["分解","Ca²⁺とCO₃²⁻で炭酸カルシウム"],"story":"石灰石・大理石・貝殻・卵の殻の主成分。塩酸をかけると二酸化炭素が出る。","use":"卵の殻や石灰石。二酸化炭素の製法で出る。"},{"q":"Ca(OH)₂","a":"水酸化カルシウム","hook":["分解","Ca²⁺にOH⁻が2個で水酸化カルシウム"],"story":"消石灰とも呼ばれる。水溶液は石灰水で、二酸化炭素を通すと白くにごる。","use":"石灰水の正体。CO₂の検出問題で必ず出る。"},{"q":"C₂H₅OH","a":"エタノール","hook":["分解","C₂H₅（エチル基）にOH（ヒドロキシ基）がつく"],"story":"お酒に含まれるアルコール。濃度約80%前後のものは消毒用として使われる。","use":"お酒や手指の消毒液。アルコールの代表として出る。"},{"q":"H₃O⁺","a":"オキソニウムイオン","hook":["分解","水H₂OにH⁺が1個くっついたイオン"],"story":"水溶液中のH⁺は実際には水分子と結びつき、H₃O⁺として存在している。","use":"酸の電離式や配位結合の例として出る。"},{"q":"HCO₃⁻","a":"炭酸水素イオン","hook":["分解","CO₃²⁻にH⁺が1個ついてマイナス1価に"],"story":"血液中にも含まれ、pHをほぼ一定に保つはたらきに関わっている。","use":"重曹に含まれる。酸性塩や緩衝の問題で出る。"},{"q":"CH₃COO⁻","a":"酢酸イオン","hook":["分解","酢酸CH₃COOHからH⁺がとれたイオン"],"story":"酢酸ナトリウムと酢酸を混ぜた水溶液は、pHが変わりにくい緩衝液になる。","use":"弱酸の電離や緩衝液の問題で出る。"},{"q":"Ca²⁺","a":"カルシウムイオン","hook":["そのまま","Caが電子を2個失ったイオン"],"story":"骨や歯をつくるのに欠かせない。炎色反応は橙赤色。","use":"硬水に多く含まれる。炎色反応や沈殿反応で出る。"},{"q":"Cu²⁺","a":"銅(Ⅱ)イオン","hook":["注意","価数(Ⅱ)をつけて呼ぶ。銅には(Ⅰ)もある"],"story":"水溶液は青色。アンモニア水を過剰に加えると深青色の溶液になる。","use":"硫酸銅水溶液の青色。金属イオンの分離・確認で頻出。"},{"q":"Fe³⁺","a":"鉄(Ⅲ)イオン","hook":["注意","3価は鉄(Ⅲ)、2価は鉄(Ⅱ)と区別する"],"story":"水溶液は黄褐色。チオシアン酸カリウム水溶液を加えると血赤色になる。","use":"金属イオンの確認反応や酸化還元で出る。"},{"q":"Fe²⁺","a":"鉄(Ⅱ)イオン","hook":["注意","2価は鉄(Ⅱ)。空気で酸化されると鉄(Ⅲ)に"],"story":"水溶液は淡緑色。酸化されやすく、還元剤としてはたらく。","use":"酸化還元滴定や金属イオンの色の問題で出る。"},{"q":"Al³⁺","a":"アルミニウムイオン","hook":["そのまま","Alが電子を3個失ったイオン"],"story":"水酸化ナトリウム水溶液を少量加えると白い沈殿、過剰に加えるとその沈殿が溶ける。","use":"両性金属の問題で頻出。"},{"q":"KMnO₄","a":"過マンガン酸カリウム","hook":["分解","K⁺とMnO₄⁻（過マンガン酸イオン）の組み合わせ"],"story":"黒紫色の結晶（水溶液は赤紫色）で、強い酸化剤。酸性溶液中で反応すると色がほぼ消える。","use":"酸化還元滴定の定番。色の変化で終点がわかる。"},{"q":"MnO₂","a":"酸化マンガン(Ⅳ)","hook":["注意","旧名「二酸化マンガン」。教科書では酸化マンガン(Ⅳ)"],"story":"黒色の固体。過酸化水素の分解の触媒になる。乾電池の正極にも使われる。","use":"酸素や塩素の製法、触媒の問題で出る。"},{"q":"SO₂","a":"二酸化硫黄","hook":["分解","SにO₂（酸素2個）で二酸化硫黄"],"story":"刺激臭のある有毒な気体で、酸性雨の原因の一つ。還元剤として漂白作用もある。","use":"ワインの酸化防止剤（亜硫酸塩）。酸性雨や酸化還元で出る。"},{"q":"NO₂","a":"二酸化窒素","hook":["連想","赤褐色の有毒な気体。銅と濃硝酸で発生"],"story":"自動車の排ガスなどから生じ、酸性雨や光化学スモッグの原因になる。","use":"大気汚染の話題。銅と濃硝酸の反応で頻出。"},{"q":"NO","a":"一酸化窒素","hook":["連想","無色の気体。銅と希硝酸で発生"],"story":"空気に触れるとすぐに酸化されて赤褐色の二酸化窒素になる。","use":"銅と希硝酸の反応、オストワルト法で出る。"},{"q":"B","a":"ホウ素","hook":["連想","鉱物「ホウ砂」から名づけられた元素"],"story":"ホウ素を含むホウケイ酸ガラスは熱に強く、ビーカーや耐熱容器に使われる。","use":"耐熱ガラスやホウ酸。原子番号5で周期表の暗記に必要。"},{"q":"Be","a":"ベリリウム","hook":["連想","宝石エメラルドの鉱物「ベリル（緑柱石）」が由来"],"story":"エメラルドはベリリウムを含む緑柱石の一種。軽くて硬い金属。","use":"周期表の2族。原子番号4で暗記に必要。"},{"q":"Br","a":"臭素","hook":["語源","ギリシャ語bromos(悪臭)。強いにおいがあるため"],"story":"常温で液体の非金属元素はこれだけ。赤褐色で刺激臭がある。","use":"ハロゲンの性質や、二重結合を調べる臭素水の脱色で出る。"},{"q":"I","a":"ヨウ素","hook":["語源","ギリシャ語iodes(紫色)。蒸気が紫色だから"],"story":"昇華しやすい黒紫色の固体。デンプンに加えると青紫色になる。","use":"うがい薬やヨウ素デンプン反応。昇華の例として出る。"},{"q":"CuO","a":"酸化銅(Ⅱ)","hook":["注意","黒色はCuO（酸化銅(Ⅱ)）、赤色はCu₂O（酸化銅(Ⅰ)）"],"story":"銅を空気中で加熱すると黒い酸化銅(Ⅱ)になる。水素や炭素で還元すると銅に戻る。","use":"中学からおなじみの酸化・還元の実験で出る。"},{"q":"H₂S","a":"硫化水素","hook":["連想","卵が腐ったようなにおいの有毒な気体"],"story":"火山や温泉のにおいの正体。多くの金属イオンと沈殿（黒色のものが多い）をつくる。","use":"温泉地のにおい。金属イオンの沈殿分離や還元剤で出る。"},{"q":"KOH","a":"水酸化カリウム","hook":["分解","K⁺とOH⁻で水酸化カリウム"],"story":"水酸化ナトリウムと同じく強塩基で潮解性がある。","use":"アルカリ乾電池の電解液。強塩基の例として出る。"},{"q":"Ba(OH)₂","a":"水酸化バリウム","hook":["分解","Ba²⁺にOH⁻が2個で水酸化バリウム"],"story":"水に溶ける2価の強塩基。二酸化炭素と反応して白い炭酸バリウムが沈殿する。","use":"強塩基の一覧や中和滴定で出る。"},{"q":"CaO","a":"酸化カルシウム","hook":["連想","別名「生石灰」。水を加えると発熱する"],"story":"石灰石を強く熱すると得られる。水と反応して激しく発熱し、水酸化カルシウムになる。","use":"お菓子の乾燥剤や加熱式弁当。塩基性酸化物の例で出る。"},{"q":"MgO","a":"酸化マグネシウム","hook":["連想","マグネシウムが強い白い光を出して燃えてできる"],"story":"白色の固体。マグネシウムの燃焼は明るく、昔のカメラのフラッシュに使われた。","use":"便秘薬（酸化マグネシウム）。燃焼の質量計算で出る。"},{"q":"PO₄³⁻","a":"リン酸イオン","hook":["分解","P1個とO4個、マイナス3価でリン酸イオン"],"story":"リン酸塩は植物の肥料の三要素のうちリンの供給源になる。","use":"肥料や食品添加物の表示。多原子イオンの暗記で出る。"},{"q":"H₃PO₄","a":"リン酸","hook":["分解","PO₄³⁻にH⁺が3個で3価の酸"],"story":"中程度の強さの酸で、コーラなどの清涼飲料水に酸味料として使われる。","use":"清涼飲料水の原材料表示。3価の酸として中和計算で出る。"},{"q":"MnO₄⁻","a":"過マンガン酸イオン","hook":["分解","Mn1個とO4個、マイナス1価のイオン"],"story":"赤紫色で強い酸化剤。酸性下で反応するとほぼ無色のMn²⁺になる。","use":"酸化還元滴定の半反応式で頻出。"},{"q":"Cr₂O₇²⁻","a":"二クロム酸イオン","hook":["分解","Cr2個（二クロム）とO7個、マイナス2価"],"story":"赤橙色の酸化剤。酸性下で反応すると緑色のCr³⁺になる。","use":"酸化剤の半反応式やクロム酸イオンとの平衡で出る。"},{"q":"O²⁻","a":"酸化物イオン","hook":["注意","「酸素イオン」ではなく「酸化物イオン」が正式名"],"story":"酸素原子が電子を2個受け取ったイオン。電子配置はネオンと同じ。","use":"イオンの大きさや電子配置の問題で出る。"},{"q":"S²⁻","a":"硫化物イオン","hook":["注意","「硫黄イオン」ではなく「硫化物イオン」が正式名"],"story":"多くの金属イオンと結びつき、水に溶けにくい硫化物の沈殿をつくる。","use":"硫化水素による金属イオンの分離で出る。"},{"q":"Ag⁺","a":"銀イオン","hook":["そのまま","Agが電子を1個失ったイオン"],"story":"塩化物イオンと結びつくと白い塩化銀が沈殿する。抗菌作用がある。","use":"銀イオン配合の抗菌グッズ。沈殿反応で頻出。"},{"q":"Mg²⁺","a":"マグネシウムイオン","hook":["そのまま","Mgが電子を2個失ったイオン"],"story":"豆腐を固めるにがりの主成分は塩化マグネシウム。植物の葉緑素にも含まれる。","use":"にがりや硬水のミネラル。イオンの電子配置で出る。"},{"q":"K⁺","a":"カリウムイオン","hook":["そのまま","Kが電子を1個失ったイオン"],"story":"植物の肥料の三要素の一つ。炎色反応は赤紫色。","use":"野菜や果物に多いミネラル。炎色反応で出る。"},{"q":"Zn²⁺","a":"亜鉛イオン","hook":["そのまま","Znが電子を2個失ったイオン"],"story":"水酸化物の沈殿は、水酸化ナトリウムでもアンモニア水でも過剰に加えると溶ける。","use":"両性金属や金属イオンの分離問題で出る。"},{"q":"C₆H₁₂O₆","a":"グルコース","hook":["分解","C6・H12・O6。別名ブドウ糖"],"story":"光合成でつくられ、呼吸のエネルギー源になる。デンプンやセルロースはグルコースがつながったもの。","use":"ブドウ糖としてラムネ菓子などに。糖類の問題で出る。"},{"q":"C₂H₄","a":"エチレン","hook":["連想","果物を熟させる植物ホルモンでもある気体"],"story":"二重結合をもつ最も簡単なアルケン。ポリエチレンの原料になる。","use":"レジ袋のポリエチレン。付加反応や付加重合で出る。"},{"q":"C₃H₈","a":"プロパン","hook":["分解","C3個のアルカン。メタン・エタン・プロパンの順"],"story":"液化しやすく、ボンベに詰めたLPガス（プロパンガス）の主成分。","use":"家庭用のプロパンガス。燃焼の計算で出る。"},{"q":"C₂H₆","a":"エタン","hook":["分解","C2個のアルカン。メタンの次"],"story":"天然ガスに含まれる。単結合だけをもつ飽和炭化水素。","use":"アルカンの名前や異性体の問題で出る。"},{"q":"C₂H₂","a":"アセチレン","hook":["連想","三重結合をもつ。炭化カルシウムと水で発生"],"story":"燃やすと非常に高温の炎になり、酸素アセチレン炎として金属の溶接や切断に使われる。","use":"溶接用のガス。アルキンや付加反応で出る。"},{"q":"CH₃OH","a":"メタノール","hook":["分解","メタンCH₄のHを1個OHにしたアルコール"],"story":"エタノールと違い毒性が強く、飲むと失明などの危険がある。燃料として利用される。","use":"燃料用アルコール。アルコールの酸化で出る。"},{"q":"AgCl","a":"塩化銀","hook":["分解","Ag⁺とCl⁻で塩化銀"],"story":"水に溶けにくい白い沈殿。光に当たると分解して黒っぽくなる感光性がある。","use":"塩化物イオンの検出。沈殿反応で頻出。"},{"q":"CuSO₄","a":"硫酸銅(Ⅱ)","hook":["注意","五水和物は青色、無水物は白色"],"story":"白い無水硫酸銅(Ⅱ)は水を吸うと青くなるため、水の検出に使われる。","use":"青い結晶づくりの実験。水和水や電気分解で出る。"},{"q":"Fe₂O₃","a":"酸化鉄(Ⅲ)","hook":["連想","赤さびの主成分。赤色の顔料ベンガラにもなる"],"story":"鉄鉱石の主成分で、溶鉱炉で一酸化炭素により還元されて鉄になる。","use":"鉄の製錬や赤さびの話題で出る。"},{"q":"Al₂O₃","a":"酸化アルミニウム","hook":["連想","アルミナとも呼ぶ。ルビーやサファイアの主成分"],"story":"ボーキサイトから得て、溶融塩電解でアルミニウムをつくる。表面の被膜がさびを防ぐ。","use":"アルマイト加工の鍋。両性酸化物や溶融塩電解で出る。"},{"q":"NH₄Cl","a":"塩化アンモニウム","hook":["分解","NH₄⁺とCl⁻で塩化アンモニウム"],"story":"水酸化カルシウムと混ぜて加熱すると、アンモニアが発生する。","use":"アンモニアの製法や、水溶液が酸性を示す塩として出る。"},{"q":"SiO₂","a":"二酸化ケイ素","hook":["分解","SiにO₂で二酸化ケイ素"],"story":"水晶や石英の主成分で、ガラスの原料にもなる。共有結合の結晶。","use":"ガラスや砂。共有結合の結晶の例として出る。"},{"q":"O₃","a":"オゾン","hook":["分解","酸素原子3個。酸素O₂の同素体"],"story":"上空のオゾン層は太陽からの有害な紫外線を吸収している。特有のにおいがある。","use":"オゾン層の環境問題。同素体の問題で出る。"},{"q":"(COOH)₂","a":"シュウ酸","hook":["分解","COOH（カルボキシ基）が2個つながった2価の酸"],"story":"ほうれん草のえぐみの成分の一つ。正確に量れるので滴定の標準物質に使われる。","use":"中和滴定や酸化還元滴定の標準溶液で頻出。"},{"q":"KI","a":"ヨウ化カリウム","hook":["分解","K⁺とI⁻（ヨウ化物イオン）でヨウ化カリウム"],"story":"ヨウ素は水に溶けにくいが、ヨウ化カリウム水溶液にはよく溶ける。","use":"ヨウ化カリウムデンプン紙。ハロゲンの反応で出る。"},{"q":"CaCl₂","a":"塩化カルシウム","hook":["分解","Ca²⁺にCl⁻が2個で塩化カルシウム"],"story":"水分をよく吸うので乾燥剤に、また水の凝固点を下げるので道路の融雪剤に使われる。","use":"除湿剤や融雪剤。気体の乾燥剤の問題で出る。"},{"q":"BaSO₄","a":"硫酸バリウム","hook":["分解","Ba²⁺とSO₄²⁻で硫酸バリウム"],"story":"水にも酸にもほとんど溶けず、X線を通しにくいので、胃のX線検査の造影剤に使われる。","use":"健康診断のバリウム検査。白色沈殿の問題で出る。"},{"q":"AgNO₃","a":"硝酸銀","hook":["分解","Ag⁺とNO₃⁻で硝酸銀"],"story":"光で分解しやすいため褐色びんで保存する。塩化物イオンの検出に使われる。","use":"塩化物イオンの検出試薬として出る。"},{"q":"NaClO","a":"次亜塩素酸ナトリウム","hook":["注意","酸と混ぜると有毒な塩素が出る。「まぜるな危険」"],"story":"塩素系漂白剤や殺菌剤の主成分。強い酸化作用で色素や菌を分解する。","use":"台所用・洗濯用の塩素系漂白剤。酸化剤や「まぜるな危険」の反応で出る。"},{"q":"HSO₄⁻","a":"硫酸水素イオン","hook":["分解","SO₄²⁻にH⁺が1個残ってマイナス1価"],"story":"硫酸が1段階だけ電離したときにできるイオン。硫酸水素ナトリウムは酸性塩。","use":"酸性塩や硫酸の電離の問題で出る。"},{"q":"SO₃²⁻","a":"亜硫酸イオン","hook":["注意","「亜」は硫酸イオンよりOが1個少ないしるし"],"story":"亜硫酸塩は酸化されやすく、食品の酸化防止剤として使われる。","use":"ワインの「亜硫酸塩」表示。多原子イオンの暗記で出る。"},{"q":"C₆H₆","a":"ベンゼン","hook":["連想","炭素6個の正六角形の環。通称「亀の甲」"],"story":"ケクレが環状構造を提案した。芳香族化合物の基本となる物質。","use":"芳香族化合物の単元で必ず出る。"},{"q":"HCHO","a":"ホルムアルデヒド","hook":["分解","CHO（ホルミル基）をもつ最も簡単なアルデヒド"],"story":"水溶液はホルマリンと呼ばれ、生物標本の保存に使われる。シックハウス症候群の原因物質。","use":"建材のシックハウス対策。アルデヒドの還元性で出る。"},{"q":"Ba","a":"バリウム","hook":["語源","ギリシャ語barys(重い)。重い鉱物から見つかったため"],"story":"炎色反応は黄緑色で、花火の緑色に使われる。","use":"バリウム検査や花火の緑。炎色反応で出る。"},{"q":"Pt","a":"白金","hook":["連想","英語名プラチナ。白く輝く金属なので白金"],"story":"さびにくく反応しにくい。自動車の排ガスを浄化する触媒に使われる。","use":"プラチナのアクセサリー。触媒やイオン化傾向で出る。"},{"q":"Cr","a":"クロム","hook":["語源","ギリシャ語chroma(色)。化合物がいろいろな色をもつから"],"story":"鉄に混ぜるとさびにくいステンレス鋼になる。表面のクロムめっきにも使われる。","use":"ステンレスの流し台やめっき。遷移元素で出る。"},{"q":"Ni","a":"ニッケル","hook":["連想","ドイツ語で「悪魔の銅」を意味する言葉が由来"],"story":"銅との合金の白銅は、日本の50円玉と100円玉に使われている。","use":"硬貨やニッケル水素電池。不動態や合金で出る。"},{"q":"Co","a":"コバルト","hook":["連想","ドイツ語で「小鬼」を意味するコボルトが由来"],"story":"化合物は鮮やかな青色の顔料コバルトブルーになる。リチウムイオン電池の材料にも使われる。","use":"塩化コバルト紙による水の検出で出る。"},{"q":"Sr","a":"ストロンチウム","hook":["連想","スコットランドの村ストロンチアンで見つかった"],"story":"炎色反応は紅色で、花火の赤色に使われる。","use":"花火の赤。炎色反応の暗記で出る。"},{"q":"Kr","a":"クリプトン","hook":["語源","ギリシャ語kryptos(隠れた)。空気中にわずかに隠れていた"],"story":"空気中にごくわずかに含まれる貴ガス。電球に封入して長寿命化に使われた。","use":"クリプトン電球。貴ガスの一覧で出る。"},{"q":"Ti","a":"チタン","hook":["語源","ギリシャ神話の巨人族ティタンが由来"],"story":"軽くて強く、さびにくい金属。酸化チタンは光触媒として汚れの分解に使われる。","use":"メガネのフレームやゴルフクラブ。遷移元素で出る。"},{"q":"Xe","a":"キセノン","hook":["語源","ギリシャ語xenos(見知らぬもの)が由来"],"story":"自動車のヘッドライトのキセノンランプや、探査機はやぶさのイオンエンジンの燃料に使われた。","use":"車のHIDライト。貴ガスの一覧で出る。"},{"q":"CaSO₄","a":"硫酸カルシウム","hook":["連想","二水和物はセッコウ。ギプスや石膏像の材料"],"story":"焼きセッコウに水を加えると固まってセッコウに戻る性質を利用して、型取りに使う。","use":"石膏像やギプス。水和物の問題で出る。"}],"math":[{"q":"y=x²−2ax の 0≤x≤2 での最小値(aは定数)","a":"軸x=aと区間の位置で場合分け","w":"頂点の値−a²をそのまま答える","hook":["合図","軸に文字が入っていて、xの範囲が決められている"],"story":"軸が区間の外にあれば最小は端点になる。頂点がいつも範囲内にあるとは限らない。","use":"a=3なら軸は区間の右の外→x=2で最小|最小値 4−4a=−8"},{"q":"x²−x−6<0 を解く","a":"因数分解し2解の間をとる","w":"2解の外側をとる","hook":["合図","x²の係数が正の2次不等式で「<0」"],"story":"下に凸の放物線がx軸より下にあるのは2つの交点の間だけ。「>0」なら外側になる。","use":"(x−3)(x+2)<0|−2<x<3"},{"q":"三角形の3辺がa=7,b=5,c=3 のとき角Aの大きさ","a":"余弦定理でcosAを出す","w":"正弦定理で角を出す","hook":["合図","3辺がすべて分かっていて、角を聞かれている"],"story":"角が1つも分からないと正弦定理は使えない。3辺から角は余弦定理の変形版で一発。","use":"cosA=(25+9−49)/(2·5·3)=−1/2|A=120°"},{"q":"b=4,c=5,A=30° の三角形の面積","a":"S=(1/2)bc sinA を使う","w":"余弦定理で残りの辺を出す","hook":["合図","2辺とその間の角が分かっていて、面積を聞かれている"],"story":"2辺とはさむ角があれば面積公式に直接入れるだけ。残りの辺を出すのは遠回り。","use":"(1/2)·4·5·sin30°|S=5"},{"q":"θが鋭角で sinθ=1/3 のとき cosθ の値","a":"sin²θ+cos²θ=1 を使う","w":"θの大きさを先に求める","hook":["合図","三角比の1つが分かっていて、別の三角比を聞かれている"],"story":"θはきれいな角にならない。相互関係で直接出し、鋭角なのでcosθは正を選ぶ。","use":"cos²θ=1−1/9=8/9|cosθ=2√2/3"},{"q":"サイコロを5回振り、1の目がちょうど2回出る確率","a":"₅C₂(1/6)²(5/6)³ で計算","w":"(1/6)²(5/6)³ だけで計算","hook":["合図","同じ試行をくり返して「ちょうど○回」"],"story":"何回目に1が出るかの選び方₅C₂通りを掛け忘れるのが定番のミス。","use":"10×(1/36)×(125/216)|625/3888"},{"q":"2人の子の少なくとも1人が男のとき、2人とも男の確率","a":"P(A∩B)÷P(A) で計算","w":"もう1人が男の確率1/2","hook":["合図","「〜のとき」「〜であったとき」と条件がついた確率"],"story":"条件で全体が絞られる。男男・男女・女男の3通りが新しい全体になる。","use":"(1/4)÷(3/4)|1/3"},{"q":"P(x)=x³+x−1 を x−2 で割った余り","a":"剰余の定理でP(2)を計算","w":"筆算で最後まで割る","hook":["合図","1次式で割った「余り」だけを聞かれている"],"story":"x−aで割った余りはP(a)。商がいらないなら割り算は不要。","use":"P(2)=8+2−1|余り9"},{"q":"sinθ+√3cosθ の最大値","a":"三角関数の合成をする","w":"最大値1と√3を足して1+√3","hook":["合図","同じ角のsinとcosの1次式の和"],"story":"sinとcosは同時に最大にならない。合成して1つのsinにまとめる。","use":"2sin(θ+π/3)|最大値2"},{"q":"log₂(x−1)+log₂(x+1)=3 を解く","a":"真数条件を先に確認する","w":"出た解をすべて答える","hook":["合図","logの中(真数)にxが入った方程式"],"story":"真数は正でなければならない。x>1を忘れるとx=−3まで答えてしまう。","use":"(x−1)(x+1)=8→x=±3, x>1|x=3"},{"q":"y=x³−3x の 0≤x≤3 での最大値","a":"増減表で極値と端点を比べる","w":"極大値を最大値とする","hook":["合図","3次関数でxの範囲が決められている"],"story":"極大はx=−1で範囲の外。端点の値の方が大きいことがよくある。","use":"f(0)=0, f(1)=−2, f(3)=18|最大値18(x=3)"},{"q":"初項3、公差4の等差数列の第10項までの和","a":"n(初項+末項)/2 を使う","w":"10項を全部書き出して足す","hook":["合図","等差数列で「第n項までの和」"],"story":"末項3+9·4=39を出せば公式一発。項数が多いと書き出しはミスのもと。","use":"10×(3+39)/2|210"},{"q":"初項2、公比3の等比数列の第5項までの和","a":"a(rⁿ−1)/(r−1) を使う","w":"等差数列の和の公式を使う","hook":["合図","毎回同じ数を掛けていく数列の和"],"story":"公比が1でないことを確認して等比の和の公式。差が一定ではないので等差の公式は不可。","use":"2(3⁵−1)/(3−1)|242"},{"q":"a₁=1, aₙ₊₁=2aₙ+3 の一般項","a":"α=2α+3 で変形する","w":"公比2の等比数列とする","hook":["合図","aₙ₊₁=paₙ+q の形の漸化式"],"story":"+3があるので等比ではない。α=−3を使いaₙ+3を等比数列にする。","use":"aₙ₊₁+3=2(aₙ+3)|aₙ=2ⁿ⁺¹−3"},{"q":"Σ(2k+1) (k=1〜n) を計算する","a":"Σk と Σ1 の公式に分ける","w":"k=nを入れて2n+1とする","hook":["合図","Σの中がkの多項式"],"story":"Σは足し算なので分けてよい。定数1のΣはnになる点も忘れずに。","use":"2·n(n+1)/2+n|n²+2n"},{"q":"A(1,0),B(4,3) を結ぶ線分を2:1に内分する点P","a":"(1·A+2·B)/3 とする","w":"(2·A+1·B)/3 とする","hook":["合図","線分を m:n に内分する点"],"story":"Aには反対側の比1、Bには2を掛ける。掛ける比を逆にして(2A+B)/3とするミスが多い。","use":"((1+8)/3,(0+6)/3)|P(3,2)"},{"q":"ベクトルで|a|=2,|b|=3,a·b=1のとき|a+b|","a":"2乗して内積で展開する","w":"|a|+|b|=5 とする","hook":["合図","ベクトルの和や差の大きさを聞かれている"],"story":"向きが違えば大きさは単純に足せない。2乗すると内積の形になる。","use":"|a+b|²=4+2·1+9=15|√15"},{"q":"X が N(50,10²) に従うとき P(X≥70)","a":"Z=(X−50)/10 で標準化","w":"70/100を割合として答える","hook":["合図","平均と標準偏差が与えられた正規分布の確率"],"story":"正規分布表は標準正規分布用。必ずZに直してから表を引く。","use":"P(Z≥2)=0.5−0.4772|0.0228"},{"q":"(x+2)⁵ の展開式における x³ の係数","a":"二項定理の一般項を使う","w":"5回かけて全部展開する","hook":["合図","累乗の展開式で特定の項の係数"],"story":"一般項₅Cᵣx⁵⁻ʳ2ʳでx³になるr=2を選ぶ。2²を掛け忘れないこと。","use":"₅C₂·2²|40"},{"q":"x²+y²−4x+6y+4=0 の中心と半径","a":"xとyそれぞれ平方完成","w":"係数をそのまま中心とする","hook":["合図","x²+y²+ax+by+c=0 の一般形の円"],"story":"(x−2)²+(y+3)²の形にすると中心と半径が読める。符号の逆転に注意。","use":"(x−2)²+(y+3)²=9|中心(2,−3), 半径3"},{"q":"点(1,2)と直線3x+4y−1=0の距離","a":"点と直線の距離の公式","w":"垂線の足を求めて計算","hook":["合図","点と直線の「距離」"],"story":"|ax₀+by₀+c|/√(a²+b²) に入れるだけ。垂線の足を求めるのは遠回り。","use":"|3+8−1|/√(9+16)|距離2"},{"q":"3x+5y=1 を満たす整数x,yをすべて求める","a":"特殊解を見つけて引き算","w":"小さい数を順に代入し続ける","hook":["合図","ax+by=c の整数解を「すべて」"],"story":"1組見つけて引くと3(x−2)=−5(y+1)。3と5が互いに素なので一般解が出る。","use":"3·2+5·(−1)=1を利用|x=5k+2, y=−3k−1"},{"q":"|x−2|=3x を解く","a":"中身の符号で場合分け","w":"絶対値をそのまま外す","hook":["合図","絶対値の中に変数がある方程式"],"story":"場合分けした範囲に解が入っているか必ず確認。x≥2で出たx=−1は不適。","use":"x≥2:x=−1(不適), x<2:x=1/2|x=1/2"},{"q":"データ1,2,3の分散","a":"(2乗の平均)−(平均)²","w":"偏差の合計を個数で割る","hook":["合図","データの分散を求める"],"story":"偏差の合計はいつも0になる。2乗してから平均するのが分散。","use":"14/3−2²|分散2/3"},{"q":"すべての実数xで x²+ax+4>0 となる条件","a":"判別式 D<0 を使う","w":"判別式 D>0 を使う","hook":["合図","「すべての実数xで」2次式が正"],"story":"グラフがx軸と交わらなければ常に正。D>0だと負の部分ができてしまう。","use":"a²−16<0|−4<a<4"},{"q":"cos2θ+2sinθ の最大値","a":"sinθだけの式にそろえる","w":"三角関数の合成をする","hook":["合図","2倍角とsinθが混ざった式の最大・最小"],"story":"cos2θ=1−2sin²θでsinθの2次関数にする。−1≤sinθ≤1の範囲に注意。","use":"−2(sinθ−1/2)²+3/2|最大値3/2"},{"q":"sin2θ=sinθ (0≤θ<2π) を解く","a":"2倍角で2sinθcosθにする","w":"両辺をsinθで割る","hook":["合図","2θとθが混ざった三角方程式"],"story":"sinθで割るとsinθ=0の解が消える。くくり出して積=0にする。","use":"sinθ(2cosθ−1)=0|θ=0, π/3, π, 5π/3"},{"q":"4ˣ−3·2ˣ⁺¹+8=0 を解く","a":"2ˣ=t とおいて2次方程式に","w":"両辺の対数をとる","hook":["合図","4ˣと2ˣのように底がそろう指数方程式"],"story":"4ˣ=(2ˣ)²。t>0の条件をつけて2次方程式で解く。","use":"t²−6t+8=0, t=2,4|x=1, 2"},{"q":"y=x²とy=x+2で囲まれた部分の面積","a":"(β−α)³/6 の公式を使う","w":"上下を気にせず積分する","hook":["合図","放物線と直線(放物線)で囲まれた面積"],"story":"交点α,βが分かれば1/6公式で一瞬。上下を逆にすると負の値が出る。","use":"交点x=−1,2|(2+1)³/6=9/2"},{"q":"∫₀²|x−1|dx を計算する","a":"x=1で積分区間を分ける","w":"絶対値を外して積分する","hook":["合図","積分する式に絶対値がある"],"story":"絶対値を外すと答えが0になってしまう。中身の符号が変わる点で分ける。","use":"∫₀¹(1−x)dx+∫₁²(x−1)dx|1/2+1/2=1"},{"q":"x³−3x+2=0 を解く","a":"因数定理で解を1つ見つける","w":"2次方程式の解の公式を使う","hook":["合図","3次以上の方程式"],"story":"x=±1,±2など定数項の約数を代入。x=1で0になればx−1で割れる。","use":"(x−1)²(x+2)=0|x=1, −2"},{"q":"5人が円卓に座る方法の数","a":"1人を固定して(5−1)!","w":"5!で数える","hook":["合図","円形に並べる"],"story":"回転して同じになる並びは1通り。1人を固定して残りを並べる。","use":"4!|24通り"},{"q":"A,A,B,B,Cの5文字を1列に並べる方法の数","a":"5!÷(2!2!) で計算","w":"5!で数える","hook":["合図","同じものを含む並べ方"],"story":"AどうしBどうしを入れかえても同じ並び。重複分を割る。","use":"120÷4|30通り"},{"q":"男子3人女子2人が1列、女子2人が隣り合う並び方","a":"女子2人をひとまとめにする","w":"女子を両端に固定する","hook":["合図","「隣り合う」並べ方"],"story":"まとめた1組と男子3人の4つを並べ、組の中の並び2!も掛ける。","use":"4!×2!|48通り"},{"q":"男子3人女子2人が1列、女子どうしが隣り合わない並び方","a":"男子を並べ間と両端に女子","w":"女子をひとまとめにする","hook":["合図","「隣り合わない」並べ方"],"story":"男子の間と両端4か所から2か所を選んで女子を入れる。全体−隣り合うでもよい。","use":"3!×₄P₂=6×12|72通り"},{"q":"x>0 のとき x+4/x の最小値","a":"相加平均・相乗平均の関係","w":"平方完成する","hook":["合図","正の数で、積が一定になる2項の和の最小"],"story":"x·(4/x)=4と積が一定。等号成立のxも必ず確認する。","use":"x+4/x≥2√4=4|最小値4(x=2)"},{"q":"P(1)=3,P(2)=5でP(x)÷(x−1)(x−2)の余り","a":"余りを ax+b とおく","w":"余りを定数cとおく","hook":["合図","2次式で割った余り"],"story":"2次式で割った余りは1次以下。x=1,2を代入して連立する。","use":"a+b=3, 2a+b=5|余り 2x+1"},{"q":"円x²+y²=5と直線y=2x+kが接するkの値","a":"中心と直線の距離=半径","w":"y=2x+kを円に入れて展開する","hook":["合図","円と直線が接する・交わる条件"],"story":"連立して判別式でも出せるが計算が重い。中心からの距離で比べると速い。","use":"|k|/√5=√5|k=±5"},{"q":"点(0,−2)から曲線y=x³に引いた接線","a":"接点を(t,t³)とおく","w":"点(0,−2)で微分する","hook":["合図","曲線の外の点から引いた接線"],"story":"(0,−2)は曲線上にない。接点を文字でおき、その接線が点を通る条件を使う。","use":"y=3t²x−2t³, −2=−2t³→t=1|y=3x−2"},{"q":"x³−3x−a=0 の異なる実数解の個数","a":"y=x³−3xとy=aの交点を見る","w":"判別式を使う","hook":["合図","文字定数を含む方程式の実数解の個数"],"story":"定数aを分離すると水平線との交点の個数になる。3次に判別式は使わない。","use":"極大値2, 極小値−2|−2<a<2で3個"},{"q":"f(x)=x³+ax²+3x が極値をもつ条件","a":"f′(x)=0の判別式 D>0","w":"判別式 D≥0 とする","hook":["合図","3次関数が「極値をもつ」"],"story":"重解(D=0)では符号が変わらず極値にならない。等号は入れない。","use":"a²−9>0|a<−3, 3<a"},{"q":"Sₙ=n²+n+1 のとき一般項aₙ","a":"aₙ=Sₙ−Sₙ₋₁ (n≥2)","w":"Sₙをnで割る","hook":["合図","和Sₙが与えられて一般項を求める"],"story":"引き算はn≥2でしか使えない。a₁=S₁を別に確認すると食い違うことがある。","use":"n≥2で2n, a₁=S₁=3|a₁=3, aₙ=2n(n≥2)"},{"q":"1,2,5,10,17,… の一般項","a":"階差数列をとる","w":"等差数列とみなす","hook":["合図","差が一定でないが、差に規則がある数列"],"story":"差が1,3,5,7と等差。aₙ=a₁+Σ(階差) (n≥2)で求める。","use":"階差2k−1|aₙ=(n−1)²+1"},{"q":"二項分布B(100,1/2)の平均と分散","a":"np と np(1−p) を使う","w":"確率を全部書き出して計算","hook":["合図","二項分布B(n,p)の期待値・分散"],"story":"二項分布には専用の公式がある。101通りの確率を書き出す必要はない。","use":"100·1/2, 100·1/2·1/2|平均50, 分散25"},{"q":"E(X)=3,V(X)=2 のとき Y=2X+1 の平均と分散","a":"E=aE+b, V=a²V を使う","w":"分散も2倍して1を足す","hook":["合図","確率変数を1次式で変換"],"story":"分散は散らばりなので+1は影響しない。倍率は2乗で効く。","use":"E(Y)=7, V(Y)=4·2|平均7, 分散8"},{"q":"ベクトルa=(1,1),b=(1,0)のなす角","a":"cosθ=a·b/(|a||b|)","w":"成分どうしを割り算する","hook":["合図","2つのベクトルのなす角"],"story":"内積を大きさの積で割るとcosθ。成分を割っても角は出ない。","use":"1/(√2·1)=1/√2|θ=45°"},{"q":"√2, ∛3, ⁶√6 の大小","a":"6乗して比べる","w":"根号の中の数で比べる","hook":["合図","累乗根の種類がばらばらの大小比較"],"story":"根の種類が違うと中の数では比べられない。最小公倍数の6乗でそろえる。","use":"8, 9, 6|⁶√6<√2<∛3"},{"q":"(1/2)ˣ>1/8 を解く","a":"底をそろえ不等号を逆にする","w":"そのままx>3とする","hook":["合図","底が1より小さい指数不等式"],"story":"底が0より大きく1より小さいと、指数が大きいほど値は小さい。","use":"(1/2)ˣ>(1/2)³|x<3"},{"q":"2³⁰の桁数(log₁₀2=0.3010)","a":"常用対数をとる","w":"2を30回掛けて数える","hook":["合図","大きな数の「桁数」"],"story":"log₁₀Nの整数部分+1が桁数。log₁₀2が与えられていたら対数の合図。","use":"30×0.3010=9.03|10桁"},{"q":"log₂3·log₃8 の値","a":"底の変換で底をそろえる","w":"近似値で計算する","hook":["合図","底が異なる対数の積"],"story":"log3/log2とlog8/log3にするとlog3が消える。","use":"log8/log2|3"},{"q":"sin75° の値","a":"加法定理で45°+30°にする","w":"sin45°+sin30° とする","hook":["合図","有名角の和や差で表せる角"],"story":"sin(α+β)はsinα+sinβではない。加法定理で展開する。","use":"sin45°cos30°+cos45°sin30°|(√6+√2)/4"},{"q":"sinθ≥1/2 (0≤θ<2π) を解く","a":"単位円で範囲を読む","w":"θ≥π/6 とだけ答える","hook":["合図","三角関数の不等式"],"story":"単位円で高さ1/2以上の部分を見る。上限の5π/6を忘れやすい。","use":"y≥1/2 の弧|π/6≤θ≤5π/6"},{"q":"f(x)=3x²−∫₀¹f(t)dt を満たすf(x)","a":"∫₀¹f(t)dt=k とおく","w":"両辺をxで微分する","hook":["合図","積分区間が定数の定積分を含む関数"],"story":"上端・下端が数なので積分の値は定数。kとおいて式を作る。","use":"f=3x²−k, k=1−k|f(x)=3x²−1/2"},{"q":"∫ₐˣf(t)dt=x²−3x+2 を満たすaとf(x)","a":"微分し、x=aも代入","w":"積分をkとおく","hook":["合図","積分の上端がxの定積分"],"story":"xで微分するとf(x)が出る。x=aでは左辺が0になるのでaも決まる。","use":"f(x)=2x−3, a²−3a+2=0|a=1, 2"},{"q":"Σ1/{k(k+1)} (k=1〜n) を計算する","a":"部分分数に分けて消し合う","w":"通分して足していく","hook":["合図","分母が連続する数の積の和"],"story":"1/k−1/(k+1)と分けると途中がすべて消え、最初と最後だけ残る。","use":"1−1/(n+1)|n/(n+1)"},{"q":"Σk·2ᵏ⁻¹ (k=1〜n) を計算する","a":"S−2S を計算する","w":"Σkと等比数列の和を掛ける","hook":["合図","(等差)×(等比)の形の和"],"story":"公比2倍したものを1つずらして引くと等比数列の和になる。","use":"−S=(2ⁿ−1)−n·2ⁿ|S=(n−1)2ⁿ+1"},{"q":"x=1はx²=1であるための何条件か","a":"真理集合の包含で判定","w":"必要十分条件と答える","hook":["合図","「必要条件・十分条件」を問う"],"story":"P⊂QならPはQの十分条件。x=−1もx²=1を満たすので逆は偽。","use":"{1}⊂{1,−1}|十分条件"},{"q":"「すべてのxでx²≥0」の否定","a":"「あるxでx²<0」にする","w":"「すべてのxでx²<0」","hook":["合図","「すべて」「ある」を含む命題の否定"],"story":"「すべて」の否定は「ある」。中身の否定と同時に入れかえる。","use":"すべて→ある, ≥→<|あるxで x²<0"},{"q":"△ABCでAB=6,AC=4、∠Aの二等分線とBCの交点D","a":"BD:DC=AB:AC を使う","w":"DはBCの中点とする","hook":["合図","角の二等分線が対辺と交わる"],"story":"二等分線は対辺を隣の2辺の比に分ける。中点になるのは二等辺のときだけ。","use":"BD:DC=6:4|3:2"},{"q":"AP,BQ,CRが1点で交わるときCQ:QA","a":"チェバの定理を使う","w":"メネラウスの定理を使う","hook":["合図","三角形の頂点から引いた3本が1点で交わる"],"story":"3本の線が1点で交わればチェバ。1本の直線が横切るならメネラウス。","use":"AR/RB=1, BP/PC=2|CQ:QA=1:2"},{"q":"三角形を1本の直線が横切るときの辺の比","a":"メネラウスの定理を使う","w":"チェバの定理を使う","hook":["合図","三角形の2辺と1辺の延長を通る直線"],"story":"頂点→分点→頂点と一周して比を掛けると1。延長上の点も含めて回る。","use":"(1/2)·3·(CQ/QA)=1|CQ:QA=2:3"},{"q":"円外の点Pからの割線で PA=2,PB=6,PC=3 のときPD","a":"方べきの定理を使う","w":"三平方の定理を使う","hook":["合図","円と、1点から引いた2本の直線"],"story":"PA·PB=PC·PDが成り立つ。直角がないので三平方は使えない。","use":"2·6=3·PD|PD=4"},{"q":"円に内接する四角形ABCDで∠A=70°のとき∠C","a":"対角の和が180°を使う","w":"∠C=∠A=70° とする","hook":["合図","円に内接する四角形"],"story":"向かい合う角の和が180°。等しくなるのは向かいではなく外角と内対角。","use":"180°−70°|∠C=110°"},{"q":"△ABCで3辺3,4,5のとき内接円の半径r","a":"S=r(a+b+c)/2 を使う","w":"正弦定理で求める","hook":["合図","三角形の「内接円」の半径"],"story":"正弦定理で出るのは外接円の半径。内接円は面積から逆算する。","use":"6=r·12/2|r=1"},{"q":"8個のデータ1,3,4,6,7,8,9,10の第1四分位数","a":"下半分4個の中央値をとる","w":"下から2番目の値をとる","hook":["合図","四分位数・箱ひげ図"],"story":"データを半分に分け、下半分の中央値がQ₁。偶数個なら2つの平均。","use":"1,3,4,6 の中央値|Q₁=3.5"},{"q":"変量xの分散が5のとき y=2x+3 の分散","a":"分散は2²倍、+3は無関係","w":"5×2+3=13 とする","hook":["合図","データを1次式で変換した分散"],"story":"全体をずらしても散らばりは変わらない。倍率は2乗で効く。","use":"2²×5|分散20"},{"q":"共分散6、標準偏差3と4のときの相関係数","a":"共分散÷標準偏差の積","w":"共分散6をそのまま答える","hook":["合図","「相関係数」を求める"],"story":"相関係数は−1以上1以下。共分散を標準偏差の積で割ってそろえる。","use":"6÷(3×4)|r=0.5"},{"q":"4人をA,Bの2部屋に分ける方法(空室あり)","a":"1人2通りで2⁴","w":"₄C₂で数える","hook":["合図","区別できる人を部屋に入れる(空室可)"],"story":"各人がAかBかを選ぶ重複順列。空室なしなら2通り引く。","use":"2⁴|16通り"},{"q":"赤玉3個白玉2個から2個取り、2個とも赤の確率","a":"玉を区別して組合せで数える","w":"色の組3通りを等確率とする","hook":["合図","同じ色の玉を取り出す確率"],"story":"赤赤・赤白・白白は起こりやすさが違う。1個ずつ区別すれば同様に確からしい。","use":"₃C₂/₅C₂|3/10"},{"q":"391と299の最大公約数","a":"ユークリッドの互除法","w":"約数を全部書き出す","hook":["合図","大きな2数の最大公約数"],"story":"大きい方を小さい方で割った余りと最大公約数は同じ。素因数が見えないときに強い。","use":"391=299+92, 299=3·92+23, 92=4·23|23"},{"q":"72の正の約数の個数","a":"素因数分解し(指数+1)の積","w":"1から順に割って数える","hook":["合図","約数の「個数」や「総和」"],"story":"2³·3²なら2の選び方4通り、3の選び方3通り。","use":"72=2³·3²|4×3=12個"},{"q":"n²を3で割った余りを調べる","a":"n=3k,3k±1で場合分け","w":"n=1,2,3だけ代入して終える","hook":["合図","すべての整数について「割った余り」"],"story":"数を入れて確かめても証明にならない。余りで分類すれば全部をカバーできる。","use":"(3k±1)²=3(3k²±2k)+1|余りは0か1"},{"q":"xy−2x−3y=0 を満たす自然数x,yの組","a":"(x−3)(y−2)=6 に変形","w":"xに1から順に代入し続ける","hook":["合図","xyを含む整数の方程式"],"story":"積の形にすると6の約数の組に絞れる。範囲を確かめて不適な組を除く。","use":"(x−3)(y−2)=6|(4,8)など4組"},{"q":"x²=a(x−1)²+b(x−1)+c がxの恒等式","a":"係数比較か数値代入","w":"xを1つ代入して終える","hook":["合図","「恒等式」となるように係数を決める"],"story":"恒等式はどんなxでも成立。未知数が3つなら条件も3つ必要。","use":"x=1でc=1, 展開してa=1,b=2|a=1, b=2, c=1"},{"q":"a²+b²≥2ab を証明する","a":"左辺−右辺≥0 を示す","w":"数を代入して確かめる","hook":["合図","不等式の証明"],"story":"差をとって平方の形にすれば0以上と言える。代入は一部の確認にすぎない。","use":"a²+b²−2ab=(a−b)²≥0|成り立つ"},{"q":"x²+ax+b=0 (a,b実数)が1+iを解にもつ","a":"共役1−iも解として使う","w":"判別式D>0を使う","hook":["合図","実数係数の方程式が虚数解をもつ"],"story":"実数係数なら虚数解は共役とペア。解と係数の関係で一気に出る。","use":"和2, 積2|a=−2, b=2"},{"q":"(1+i)/(1−i) を計算する","a":"分母の共役1+iを掛ける","w":"分子分母をiで割る","hook":["合図","分母に虚数がある"],"story":"(1−i)(1+i)=2で分母が実数になる。分母の有理化と同じ考え方。","use":"(1+i)²/2=2i/2|i"},{"q":"x²+x+1=0 の解ωについて ω¹⁰⁰ の値","a":"ω³=1 で次数を下げる","w":"ωを具体的に代入する","hook":["合図","x²+x+1=0 の解の累乗"],"story":"両辺にx−1を掛けるとω³=1。100を3で割った余りだけが残る。","use":"ω¹⁰⁰=(ω³)³³·ω|ω"},{"q":"円x²+y²=25上の点(3,4)での接線","a":"x₁x+y₁y=r² を使う","w":"y=mx+5 とおく","hook":["合図","原点中心の円の、円周上の点での接線"],"story":"接点が分かれば公式に入れるだけ。点が円の上にあることを確認しておく。","use":"3x+4y=25|3x+4y=25"},{"q":"A(0,0),B(3,0)への距離の比が2:1の点の軌跡","a":"P(x,y)とおき条件を式に","w":"図から形を予想して答える","hook":["合図","条件を満たす点の「軌跡」"],"story":"PA=2PBを2乗して整理すると円になる(アポロニウスの円)。","use":"x²+y²=4{(x−3)²+y²}|(x−4)²+y²=4"},{"q":"x≥0,y≥0,x+2y≤4 のとき x+y の最大値","a":"x+y=kの直線を動かす","w":"xとyを別々に最大にする","hook":["合図","不等式で表された領域での最大・最小"],"story":"x=4とy=2は同時に取れない。領域を通る範囲でkを動かす。","use":"(4,0)を通るとき最大|最大値4"},{"q":"半径3、中心角2π/3の扇形の面積","a":"S=(1/2)r²θ を使う","w":"弧の長さrθを面積とする","hook":["合図","弧度法で中心角が与えられた扇形"],"story":"弧の長さはrθ、面積は(1/2)r²θ。2つを取り違えやすい。","use":"(1/2)·9·(2π/3)|3π"},{"q":"sinθ+cosθ+sinθcosθ の最大値","a":"sinθ+cosθ=t とおく","w":"それぞれの最大値を足す","hook":["合図","sinθ+cosθ と sinθcosθ が両方ある"],"story":"sinθcosθ=(t²−1)/2で表せる。tの範囲−√2≤t≤√2を忘れずに。","use":"(t²+2t−1)/2 で t=√2|最大値(1+2√2)/2"},{"q":"x²−2ax+a+2=0 の2解がともに正となる条件","a":"判別式・軸・f(0)を調べる","w":"判別式D≥0だけ調べる","hook":["合図","2次方程式の解が「ともに正」「1より大きい」"],"story":"解の配置はグラフで考える。D≥0、軸>0、f(0)>0の3つがそろって初めて十分。","use":"(a−2)(a+1)≥0, a>0, a+2>0|a≥2"},{"q":"二項分布B(400,1/2)に従うXの確率を近似","a":"正規分布N(np,npq)で近似","w":"二項係数で全部計算する","hook":["合図","nが大きい二項分布の確率"],"story":"nが大きいと二項分布は正規分布に近い。平均と分散を求めて標準化する。","use":"平均200, 分散100|N(200,10²)で近似"},{"q":"標本平均60、σ=10、n=100 の母平均の95%信頼区間","a":"x̄±1.96σ/√n を使う","w":"x̄±1.96σ を使う","hook":["合図","母平均の「信頼区間」"],"story":"標本平均のばらつきはσ/√n。√nで割り忘れると区間が広くなりすぎる。","use":"60±1.96·10/10|58.04≤m≤61.96"},{"q":"コインを100回投げ表60回、偏りがあるといえるか","a":"「偏りなし」を仮定して評価","w":"60>50なので偏りありとする","hook":["合図","「〜といえるか」と問う仮説検定"],"story":"偶然でも起こる差かを確率で判断する。帰無仮説のもとでZを計算する。","use":"N(50,5²)でZ=2>1.96|有意水準5%で偏りあり"},{"q":"OC=a/2, OD=2b/3 でADとBCの交点Pを表す","a":"Pを2通りに表し係数比較","w":"Pを中点と決めつける","hook":["合図","2本の線分の交点を位置ベクトルで表す"],"story":"PはAD上でもBC上でもある。aとbが1次独立なら係数を比べてよい。","use":"(1−s)a+(2s/3)b=(t/2)a+(1−t)b|OP=a/4+b/2"},{"q":"OP=(1/2)OA+(1/3)OB+kOC が平面ABC上の点","a":"係数の和=1 を使う","w":"係数の和=0 とする","hook":["合図","空間の点が平面ABC上にある"],"story":"始点Oからの表し方なら係数の和が1。AP=sAB+tACと表す方法もある。","use":"1/2+1/3+k=1|k=1/6"},{"q":"四面体OABCでOから平面ABCに下ろした垂線の足H","a":"OH·AB=0, OH·AC=0 を使う","w":"Hを△ABCの重心とする","hook":["合図","平面に下ろした垂線の足"],"story":"平面上の2方向と垂直なら平面に垂直。重心になるのは特別な場合だけ。","use":"OH=OA+sAB+tAC で内積2式|s,tが決まる"},{"q":"点zを原点のまわりにπ/3回転した点(z=2)","a":"1/2+(√3/2)iを掛ける","w":"zにπ/3を足す","hook":["合図","複素数平面での「回転」"],"story":"回転は掛け算。極形式の数を掛けると偏角が足される。","use":"2(1/2+(√3/2)i)|1+√3i"},{"q":"(1+i)⁸ を計算する","a":"極形式でド・モアブル","w":"二項定理で展開する","hook":["合図","複素数の大きな累乗"],"story":"1+i=√2(cosπ/4+isinπ/4)。8乗で大きさ16、偏角2π。","use":"(√2)⁸(cos2π+isin2π)|16"},{"q":"|z−1|=|z−i| を満たす点zの全体","a":"2点から等距離→垂直二等分線","w":"円を表すとみなす","hook":["合図","|z−α|=|z−β| の形"],"story":"|z−α|は点αとの距離。2点から等しい距離の点は垂直二等分線上にある。","use":"1とiを結ぶ線分の垂直二等分線|直線y=x"},{"q":"z³=8 を解く","a":"極形式でrとθを決める","w":"z=2だけ答える","hook":["合図","zⁿ=(数) の方程式"],"story":"複素数の範囲では解はn個。偏角を2π/3ずつずらす。","use":"r=2, θ=0,2π/3,4π/3|2, −1±√3i"},{"q":"α=1,β=2,γ=1+i のとき∠βαγ","a":"(γ−α)/(β−α)の偏角","w":"γ/βの偏角を求める","hook":["合図","複素数平面上の3点がつくる角"],"story":"角の頂点αを原点に移してから比をとる。原点を頂点にしてしまうミスに注意。","use":"i/1=i|∠βαγ=π/2"},{"q":"楕円x²/9+y²/4=1の焦点","a":"c²=a²−b² を使う","w":"c²=a²+b² を使う","hook":["合図","楕円の「焦点」"],"story":"楕円は引き算、双曲線は足し算。長軸がどちらかも確認する。","use":"c²=9−4=5|(±√5, 0)"},{"q":"双曲線x²/9−y²/16=1の漸近線","a":"右辺を0にして因数分解","w":"焦点を通る直線とする","hook":["合図","双曲線の「漸近線」"],"story":"x²/9−y²/16=0を解くと漸近線。焦点は(±5,0)だが漸近線とは無関係。","use":"(x/3−y/4)(x/3+y/4)=0|y=±(4/3)x"},{"q":"放物線y²=8xの焦点と準線","a":"y²=4px の形にする","w":"p=8 とする","hook":["合図","放物線の「焦点」「準線」"],"story":"8=4pでp=2。焦点(p,0)、準線x=−p。","use":"y²=4·2·x|焦点(2,0), 準線x=−2"},{"q":"x=cosθ, y=sinθ+1 が表す曲線","a":"sin²θ+cos²θ=1で消去","w":"θ=0,π/2を入れて直線とする","hook":["合図","媒介変数で表された曲線"],"story":"cosθ=x, sinθ=y−1を相互関係に入れてθを消す。2点だけでは形は決まらない。","use":"x²+(y−1)²=1|中心(0,1)半径1の円"},{"q":"極方程式 r=2cosθ を直交座標の式に","a":"両辺にrを掛ける","w":"cosθ=x とおきかえる","hook":["合図","極方程式を直交座標に直す"],"story":"rcosθ=x、r²=x²+y²の形を作る。cosθだけではxにならない。","use":"r²=2rcosθ→x²+y²=2x|(x−1)²+y²=1"}]};

function yearWrong(y,same,rnd){const c=same.map(x=>[x[1],Math.abs(parseInt(x[1])-y)]).filter(x=>!isNaN(x[1])&&x[1]>0);
  for(const [lo,hi] of [[30,200],[15,400],[10,99999]]){const b=c.filter(x=>x[1]>=lo&&x[1]<=hi);if(b.length)return b[Math.floor(rnd()*b.length)][0]}return null}
function distractor(it,same){
  if(it.c[2])return it.c[2];
  const ans=it.c[1],ym=/^(\d+)年$/.exec(ans);
  if(ym){const w=yearWrong(+ym[1],same,Math.random);if(w)return w}
  const cf=(CONF[it.c[0]]||[]).filter(x=>x!==ans&&same.some(c=>c[1]===x));
  if(cf.length&&Math.random()<.6)return cf[Math.floor(Math.random()*cf.length)];

function question(){
  const P=pool(),weak=S.get("nj_weak",{});const w=P.map(p=>1+(weak[p.d+p.c[0]]||0)*3);
  let r=Math.random()*w.reduce((a,b)=>a+b),i=0;while((r-=w[i])>0)i++;if(g.last===i)i=(i+1)%P.length;g.last=i;
  const it=P[i],same=DECKS[it.d].cards.filter(c=>c!==it.c),wrong=distractor(it,same),left=Math.random()<.5;
  return {...it,opts:left?[it.c[1],wrong]:[wrong,it.c[1]],ans:left?0:1};
}

function start(){
  S.set("nj_plays",S.get("nj_plays",0)+1);
  g={score:0,time:ROUND,streak:0,max:0,ok:0,ans:0,miss:[],seen:[],last:-1,fever:false,lock:false,end:Date.now()+ROUND*1000};
  on("p0",()=>answer(0));on("p1",()=>answer(1));next();
  tick=setInterval(()=>{if(!g)return;const left=Math.max(0,(g.end-Date.now())/1000);g.time=left;
   $("ti").style.transform=`scaleX(${Math.min(1,left/ROUND)})`;$("tt").textContent=left.toFixed(1);$("tg").classList.toggle("low",left<5);if(left<=0)timeUp()},100);

function next(){
  g.q=question();g.lock=false;const d=DECKS[g.q.d];
  $("arena").innerHTML=`<div class="panel qcard in" id="card"><span class="sj" style="--c:${ICON[g.q.d][1]}">${d.tag}</span><div class="qrow"><div class="q${g.q.c[0].length>10?" long":""}">${g.q.c[0]}</div>${isEn(g.q.d)?sayBtn(g.q.c[0]):""}</div><span class="ask">${d.ask}</span></div>`;
  if(isEn(g.q.d)&&autoSay&&!muted)say(g.q.c[0],1);
  [0,1].forEach(i=>{const b=$("p"+i);b.className="btn pad "+(i?"r":"l");b.innerHTML=`<span class="ar">${i?"▶":"◀"}</span>${g.q.opts[i]}`});
  const el=$("card");let x0=null,dx=0;
  el.onpointerdown=e=>{x0=e.clientX;dx=0;el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`};
  el.onpointerup=el.onpointercancel=()=>{if(x0==null)return;x0=null;el.style.transform="";if(Math.abs(dx)>60)answer(dx<0?0:1)};

function answer(i){
  if(!g||g.phase||g.lock||g.time<=0)return;g.lock=true;g.ans++;
  const hit=i===g.q.ans,key=g.q.d+g.q.c[0],weak=S.get("nj_weak",{}),pad=$("p"+i),r=pad.getBoundingClientRect();
  const e=g.seen.find(x=>x.c[0]===g.q.c[0]);if(e)e.ok=e.ok&&hit;else g.seen.push({c:g.q.c,d:g.q.d,ok:hit});
  {const H=S.get("nj_hist",{}),hk=g.q.d+"|"+g.q.c[0],h=H[hk]||{ok:0,ng:0};hit?h.ok++:h.ng++;h.t=Date.now();H[hk]=h;S.set("nj_hist",H)}
  if(hit){
    g.streak++;g.ok++;g.max=Math.max(g.max,g.streak);const p=10*(g.fever?3:1)+Math.min(g.streak,10);g.score+=p;
    pad.classList.add("ok");burst(r.left+r.width/2,r.top,g.fever?32:18);sfx.ok(Math.min(g.streak,12));
    const f=document.createElement("div");f.className="float";f.textContent="+"+p;$("arena").appendChild(f);setTimeout(()=>f.remove(),600);
    if(weak[key]){weak[key]--;if(!weak[key])delete weak[key]}
    if(g.streak===FEVER_AT){g.fever=true;g.end+=2000;document.body.classList.add("fever");sfx.fever();burst(innerWidth/2,innerHeight/2,70)}
  }else{
    g.streak=0;g.fever=false;document.body.classList.remove("fever");g.end-=1000;
    pad.classList.add("ng");$("p"+g.q.ans).classList.add("ok");$("card").classList.remove("in");$("card").classList.add("shake");sfx.ng();
    weak[key]=(weak[key]||0)+1;if(!g.miss.some(m=>m.c[0]===g.q.c[0]))g.miss.push({c:g.q.c,d:g.q.d});
  }
  S.set("nj_weak",weak);$("sc").textContent=g.score;
  $("cb").innerHTML=g.streak>=2?`<b class="pop">${g.fever?"FEVER! ":""}${g.streak} COMBO</b>`:"";
  setTimeout(()=>{if(g&&!g.phase&&g.time>0)next()},hit?170:650);
}
function timeUp(){
  clearInterval(tick);if(!g||g.phase)return;g.phase="end";document.body.classList.remove("fever");
  if(g.q&&!g.lock&&!g.seen.some(x=>x.c[0]===g.q.c[0])){const it={c:g.q.c,d:g.q.d,to:true};g.seen.push({...it,ok:false});if(!g.miss.some(m=>m.c[0]===g.q.c[0]))g.miss.push(it);const w=S.get("nj_weak",{}),k=g.q.d+g.q.c[0];w[k]=(w[k]||0)+1;S.set("nj_weak",w)}

function rankOf(s){return s>=840?"SSS":s>=640?"SS":s>=480?"S":s>=340?"A":s>=220?"B":s>=120?"C":"D"}
function gacha(rank){const b={SSS:4,SS:3,S:2.2,A:1.6,B:1.2,C:1,D:.8}[rank],x=Math.random()*100,rar=x<3*b?"SSR":x<12*b?"SR":x<40?"R":"N";
 const l=TITLES.filter(t=>t[0]===rar);return l[Math.floor(Math.random()*l.length)]}
function result(r){
  track("game_end",{deck:deckKey,score:r.score,ok:r.ok,ans:r.ans,miss:r.miss.length});
  const bk="nj_best_"+deckKey,isBest=r.score>S.get(bk,0);if(isBest)S.set(bk,r.score);
  const rank=rankOf(r.score),stars=starsOf(rank);if(stars>S.get("nj_star_"+deckKey,0))S.set("nj_star_"+deckKey,stars);
  const t=gacha(rank),owned=S.get("nj_titles",[]),isNew=!owned.includes(t[1]);if(isNew){owned.push(t[1]);S.set("nj_titles",owned)}
  const firstDaily=deckKey==="daily"&&S.get("nj_dailydone","")!==today();if(deckKey==="daily")S.set("nj_dailydone",today());
  {const dbv=S.get("nj_daybest",{d:"",v:0});if(dbv.d!==today()||r.score>dbv.v)S.set("nj_daybest",{d:today(),v:r.score})}
  const before=levelInfo(S.get("nj_xp",0)),gain=(r.score+r.ok*2)*(firstDaily?2:1);S.set("nj_xp",S.get("nj_xp",0)+gain);const after=levelInfo(S.get("nj_xp",0)),up=after.lv>before.lv;
  const nx=[["C",120],["B",220],["A",340],["S",480],["SS",640],["SSS",840]].find(x=>x[1]>r.score);
  const missItems=r.miss.map(m=>({...m,ok:false})).sort((a,b)=>(a.to?1:0)-(b.to?1:0));
  const v={score:r.score,rank,ok:r.ok,ans:r.ans,gain,up,lv:after.lv,isBest,newTitle:isNew?t[1]:"",miss:missItems,seen:r.seen,deck:deckKey,at:Date.now()};
  S.set("nj_last",v);

}

/* ---------- lists ---------- */
function exItem(m,meta){if(m.to){meta=meta||"時間切れで答えられなかった問題";return `<details class="panel"><summary><span class="mk t">…</span><span class="k">${m.c[0]}${isEn(m.d)?" "+sayBtn(m.c[0],true):""}<small class="meta">${meta}</small></span><span class="v">${m.c[1]}</span></summary>${notes(m)}</details>`}return `<details class="panel"><summary><span class="mk ${m.ok===true||(meta&&!m.ng)?"o":m.ok===false||(meta&&m.ng)?"x":""}">${m.ok===true||(meta&&!m.ng)?"○":m.ok===false||(meta&&m.ng)?"✕":"・"}</span><span class="k">${m.c[0]}${isEn(m.d)?" "+sayBtn(m.c[0],true):""}${meta?`<small class="meta">${meta}</small>`:""}</span><span class="v">${m.c[1]}</span></summary>${notes(m)}</details>`}
function library(list,title,from){
  track("explain_open",{from:from||"tab",n:list.length});
  const body=`${hbar(title)}<div class="ex">${list.map(m=>exItem(m)).join("")}</div>`;
  if(from==="res"){app.innerHTML=`<div class="view">${body}<button class="btn sm" id="tores" style="--c:#5b6cff">結果画面にもどる</button></div>`;on("tores",backToResult);on("bk",backToResult)}else{shell("lib",body);on("bk",home)}
}
function history(f){
  screen="his";
  const H=S.get("nj_hist",{});
  const items=Object.entries(H).map(([k,h])=>{const p=k.indexOf("|"),d=k.slice(0,p),q=k.slice(p+1),c=DECKS[d]&&DECKS[d].cards.find(x=>x[0]===q);return c?{c,d,...h}:null}).filter(Boolean).sort((a,b)=>b.t-a.t);
  const cnt={all:items.length,ng:items.filter(x=>x.ng>0).length,ok:items.filter(x=>x.ng===0).length};
  const list=items.filter(x=>f==="all"||(f==="ng"?x.ng>0:x.ng===0));
  const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?"たった今":m<60?m+"分前":m<1440?Math.floor(m/60)+"時間前":Math.floor(m/1440)+"日前"};
  shell("his",`${hbar("振り返り")}
   ${items.length?`<div class="panel tabs">${[["all","すべて"],["ng","ミスあり"],["ok","全問正解"]].map(([k,l])=>`<button class="tab" data-f="${k}" aria-pressed="${k===f}">${l}<i>${cnt[k]}</i></button>`).join("")}</div>
   <div class="ex">${list.map(m=>exItem(m,`○${m.ok} ✕${m.ng}・${ago(m.t)}`)).join("")||'<p class="empty">ここに入る問題はまだありません</p>'}</div>
   ${list.length?`<button class="btn sm" id="rv" style="--c:#5b6cff">この${list.length}問を復習する</button>`:""}`
   :`<p class="empty">まだ記録がありません。1回遊ぶと、答えた問題がここにたまります。正解した問題も、あとから解説を読み返せます。</p><button class="btn go" id="go">START</button>`}`);
  on("bk",home);on("go",countdown);app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>history(b.dataset.f));
  on("rv",()=>review(list.map(m=>({c:m.c,d:m.d})),0,0));
}
function nickForm(msg){return `<div class="panel nickf"><b>${msg}</b><small>12文字まで。本名や学校名は入れないでね</small>
  <input id="nk" maxlength="12" autocomplete="off" value="${esc(nick())}" placeholder="例:光速のペンギン"><p class="nerr" id="ne"></p>
  <button class="btn sm" id="nks" style="--c:var(--pink)">決定</button></div>`}
function wireNick(after){on("nks",async()=>{const v=$("nk").value.trim(),e=checkNick(v);if(e){$("ne").textContent=e;return}S.set("dp_nick",v);sfx.tap();await pushRank();after()})}
function mypage(){
  screen="me";const plays=S.get("nj_plays",0),owned=S.get("nj_titles",[]);
  shell("me",`${hbar("マイページ")}${statusBar()}
   <button class="nickrow" id="nkedit"><span>ランキング名</span><b>${nick()?esc(nick()):"未設定"}</b><i>変更 ›</i></button>
   <div class="panel mstat">${[["連続日数",days()+"日"],["プレイ回数",plays+"回"],["称号",owned.length+"/"+TITLES.length]].map(([l,v])=>`<div><b>${v}</b><small>${l}</small></div>`).join("")}</div>
   <div class="panel mbest">${Object.keys(DECK_NAMES).filter(k=>k!=="daily").map(k=>`<div><span class="ic" style="--c:${ICON[k][1]}">${ICON[k][0]}</span><span class="nm">${DECK_NAMES[k]}</span><span class="stars">${[1,2,3].map(i=>STAR(i<=S.get("nj_star_"+k,0))).join("")}</span><b>${S.get("nj_best_"+k,0)}</b></div>`).join("")}</div>
   <div class="row"><button class="btn sm" id="tocol" style="--c:var(--gold-d)">称号コレクション</button><button class="btn sm" id="torank" style="--c:#5b6cff">ランキング</button></div>`);
  on("bk",home);on("eqbtn",collection);on("tocol",collection);on("nkedit",()=>{shell("me",`${hbar("ランキング名")}${nickForm("ランキングに表示する名前")}`);on("bk",mypage);wireNick(mypage)});on("torank",()=>ranking("day"));
}
function collection(){
  const owned=S.get("nj_titles",[]),eq=equipped();
  shell("me",`${hbar(`称号 ${owned.length}/${TITLES.length}`)}<p class="empty" style="margin:0">手に入れた称号をタップすると、ホームに表示する称号を変えられます</p>
   <div class="grid3">${TITLES.map(x=>owned.includes(x[1])?`<button class="panel" data-t="${x[1]}" style="--rc:${RCOL[x[0]]};padding:12px 6px;display:grid;gap:6px;justify-items:center;font-size:.76rem;${x[1]===eq?"box-shadow:0 0 0 3px var(--gold)":""}"><i style="font-style:normal;font-family:var(--fd);font-size:.7rem;color:#fff;background:var(--rc);border:2px solid var(--ink);border-radius:8px;padding:1px 8px">${x[0]}</i>${x[1]}</button>`:`<div class="panel lock" style="--rc:#d9dcf5"><i>?</i>???</div>`).join("")}</div>`);
  on("bk",mypage);app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.set("nj_equip",b.dataset.t);sfx.tap();collection()});
}
function settings(){
  shell("set",`${hbar("設定")}
   <div class="panel emp"><div class="emh"><b>英単語の単語帳</b><small>ホームの英単語とごちゃまぜに出る単語</small></div>
    <div class="emo" role="radiogroup" aria-label="英単語の単語帳">${[["kyote","共通テスト","大学入試の頻出語","英"],["toeic","TOEIC","ビジネス英語の頻出語","T"]].map(([k,l,d,ic])=>`<button role="radio" data-em="${k}" aria-checked="${engMode===k}"><span class="ic">${ic}</span><span class="et"><b>${l}</b><small>${d}</small></span><span class="ck" aria-hidden="true"></span></button>`).join("")}</div></div>
   <div class="panel set"><div>サウンド<button class="tg" id="t1" aria-pressed="${!muted}" aria-label="サウンド"></button></div>
    ${TTS?`<div>英単語の自動発音<button class="tg" id="t2" aria-pressed="${autoSay}" aria-label="自動発音"></button></div>`:""}</div>`);
  on("bk",home);
  app.querySelectorAll("[data-em]").forEach(b=>b.onclick=()=>{engMode=b.dataset.em;S.set("nj_eng",engMode);if(deckKey==="eng"||deckKey==="toeic"){deckKey=engKey();S.set("nj_deck",deckKey)}sfx.tap();settings()});on("t1",()=>{muted=!muted;S.set("nj_mute",muted);settings();sfx.tap()});
  on("t2",()=>{autoSay=!autoSay;S.set("nj_say",autoSay);settings();if(autoSay)say("Let's go")});
}

/* ---------- retry: same questions, no timer, until all correct ---------- */
function retry(list){
  track("retry_start",{n:list.length});
  screen="retry";let q=list.map(x=>({...x})),done=0,total=list.length,lock=false,cur=null;
  const draw=()=>{
    if(!q.length){
      app.innerHTML=`<div class="view"><div class="panel res"><span class="ribbon">CLEAR!</span><div class="emblem spin" style="background:radial-gradient(circle at 35% 30%,#c9ffe2,var(--green) 55%,var(--green-d));color:#fff">OK</div>
       <div class="sc">${total}問クリア</div><div class="sub">次のバトルでも、少し間をあけてもう一度出ます</div></div>
       <button class="btn go" id="again">新しい問題で もう1回</button><div class="row"><button class="btn sm" id="all" style="--c:#5b6cff">解説を見る</button><button class="btn sm" id="hm" style="--c:var(--gray)">結果にもどる</button></div></div>`;
      on("again",countdown);on("hm",backToResult);on("all",()=>library(list,"再挑戦した問題","res"));sfx.end();burst(innerWidth/2,innerHeight*.3,60);return;
    }
    cur=q[0];const d=DECKS[cur.d],same=d.cards.filter(c=>c!==cur.c),wrong=distractor(cur,same),left=Math.random()<.5,opts=left?[cur.c[1],wrong]:[wrong,cur.c[1]],ans=left?0:1;lock=false;
    app.innerHTML=`<div class="view" style="overflow:hidden">
     <div class="prog"><button class="back" id="bk" aria-label="やめる">${IC.back}</button><div class="xp"><i style="width:${done/total*100}%"></i></div><span style="font-size:.8rem">${done}/${total}</span></div>
     <div class="arena"><div class="panel qcard in" id="card"><span class="sj" style="--c:${ICON[cur.d][1]}">再挑戦 ・ ${d.tag}</span><div class="qrow"><div class="q${cur.c[0].length>10?" long":""}">${cur.c[0]}</div>${isEn(cur.d)?sayBtn(cur.c[0]):""}</div><span class="ask">${d.ask}</span><div id="fb"></div></div></div>
     <div class="pads">${opts.map((o,i)=>`<button class="btn pad ${i?"r":"l"}" id="r${i}"><span class="ar">${i?"▶":"◀"}</span>${o}</button>`).join("")}</div></div>`;
    on("bk",backToResult);if(isEn(cur.d)&&autoSay&&!muted)say(cur.c[0],1);
    [0,1].forEach(i=>on("r"+i,()=>{if(lock)return;lock=true;const b=$("r"+i);
      if(i===ans){b.classList.add("ok");const rc=b.getBoundingClientRect();burst(rc.left+rc.width/2,rc.top,16);sfx.ok(done);q.shift();done++;setTimeout(draw,350)}
      else{b.classList.add("ng");$("r"+ans).classList.add("ok");$("card").classList.add("shake");sfx.ng();const h=HINTS[cur.c[0]];
        $("fb").innerHTML=`<div class="note hook" style="margin-top:6px;text-align:left"><b>${h?h[0]:"答え"}</b>${h?h[1]:cur.c[1]}</div><button class="btn sm" id="nx" style="--c:var(--gray);margin-top:8px;width:100%">次へ(あとでもう一度出ます)</button>`;
        q.push(q.shift());on("nx",draw)}
    }));
  };
  draw();
}

/* ---------- review: recall → reveal → self-check ---------- */
function review(list,i,done){
  if(i===0)track("review_start",{n:list.length});
  if(i>=list.length){
    app.innerHTML=`<div class="view"><div class="panel res"><span class="ribbon">CLEAR!</span><div class="emblem spin" style="background:radial-gradient(circle at 35% 30%,#c9ffe2,var(--green) 55%,var(--green-d));color:#fff">OK</div>
     <div class="sc">${done}問</div><div class="sub">覚えた問題も、次のバトルで少し間をあけて出題されます</div></div>
     <button class="btn go" id="again">バトルへ</button><div class="links"><button class="link" id="hm">結果にもどる</button></div></div>`;
    on("again",countdown);on("hm",backToResult);sfx.end();burst(innerWidth/2,innerHeight*.3,40);return;
  }
  const m=list[i],d=DECKS[m.d];
  app.innerHTML=`<div class="view">
   <div class="prog"><button class="back" id="bk" aria-label="やめる">${IC.back}</button><div class="xp"><i style="width:${i/list.length*100}%"></i></div><span style="font-size:.8rem">${i+1}/${list.length}</span></div>
   <div class="panel rvcard in"><span class="sj" style="--c:${ICON[m.d][1]}">${d.tag}</span><div class="qrow"><div class="q${m.c[0].length>10?" long":""}" style="font-family:var(--fd)">${m.c[0]}</div>${isEn(m.d)?sayBtn(m.c[0]):""}</div>
    <span class="sub" id="ask" style="color:var(--muted);font-size:.8rem">まず頭の中で答える</span><div class="ans" id="ans" hidden>${m.c[1]}</div></div>
   <div id="nt" class="panel" style="padding:10px" hidden>${notes(m)}</div>
   <button class="btn" id="show" style="--c:#5b6cff">答えを見る</button>
   <div class="row" id="judge" hidden><button class="btn sm" id="got" style="--c:var(--green)">覚えた</button><button class="btn sm" id="re" style="--c:var(--gray)">まだ怪しい</button></div></div>`;
  on("bk",backToResult);
  on("show",()=>{$("ans").hidden=false;$("nt").hidden=false;$("ask").hidden=true;$("show").hidden=true;$("judge").hidden=false;sfx.tap()});
  on("got",e=>{const w=S.get("nj_weak",{}),k=m.d+m.c[0];if(w[k]>1)w[k]--;S.set("nj_weak",w);const b=e.currentTarget.getBoundingClientRect();burst(b.left+b.width/2,b.top,18);sfx.ok(4);review(list,i+1,done+1)});
  on("re",()=>{if(!m.again)list.push({...m,again:true});review(list,i+1,done)});
}
addEventListener("keydown",e=>{if(!g||g.phase)return;if(e.key==="ArrowLeft")answer(0);if(e.key==="ArrowRight")answer(1)});
home();boot();
</script>
