<body>

<style>
/* Layout: mobile-game shell. Night-sky backdrop, player status bar on top, content in light panels with thick outlines, bottom tab bar. Deliberately single-theme. */
:root{
  --sky1:#3a2f9e; --sky2:#151640; --ink:#16183d; --panel:#fdfcff; --panel2:#eef0ff; --muted:#7d80a8; --line:#d9dcf5;
  --gold:#ffcf3a; --gold-d:#d9970f; --pink:#ff4f8b; --pink-d:#c92a62; --cyan:#3ad0ff; --cyan-d:#1890c4;
  --green:#34d68a; --green-d:#169a5c; --orange:#ff8a3d; --gray:#a3a6c4; --gray-d:#767a9c;
  --fd:"Dela Gothic One","Hiragino Sans",sans-serif;
  --fu:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --fb:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:#fff;font-family:var(--fu);font-weight:800;padding-inline:12px;overflow:hidden;
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.12) 0 1px,transparent 2px) 0 0/38px 38px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.08) 0 1px,transparent 2px) 0 0/53px 53px,linear-gradient(180deg,var(--sky1),var(--sky2) 70%);}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-block:10px 0;position:relative}
.view{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 16px}
.view>*{flex-shrink:0}
.view>.arena{flex-shrink:1}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* status bar */
.status{display:flex;align-items:center;gap:10px;background:rgba(10,12,40,.55);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:8px 10px}
.lv{flex:none;width:48px;height:48px;border-radius:14px;background:linear-gradient(180deg,#ffe27a,var(--gold));border:3px solid var(--ink);color:var(--ink);display:grid;place-items:center;line-height:1;box-shadow:0 3px 0 var(--gold-d)}
.lv small{font-size:.55rem;display:block}.lv b{font-family:var(--fd);font-weight:400;font-size:1.25rem}
.pl{flex:1;min-width:0;display:grid;gap:4px}
.pl .tt{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .tt em{font-style:normal;color:var(--gold)}
.xp{height:12px;border-radius:99px;background:rgba(0,0,0,.45);border:2px solid var(--ink);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#8ff0ff);border-radius:99px}
.pl .xn{font-size:.62rem;color:#c9cbf0;font-variant-numeric:tabular-nums}
.streak{flex:none;text-align:center;background:linear-gradient(180deg,#ffb07a,var(--orange));color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:3px 8px;line-height:1.05}
.streak b{font-family:var(--fd);font-weight:400;font-size:1.1rem;display:block}.streak small{font-size:.55rem}
/* panels */
.panel{background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.ribbon{justify-self:center;align-self:center;font-family:var(--fd);font-weight:400;font-size:.95rem;letter-spacing:.08em;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:10px;padding:4px 18px;box-shadow:0 3px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 var(--pink-d)}
.logo{text-align:center;margin:6px 0 0}
.logo h1{margin:0;font-family:var(--fd);font-weight:400;font-size:2.2rem;line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 26px rgba(255,79,139,.6)}
.logo h1 em{font-style:normal;color:var(--gold)}
.logo p{margin:8px 0 0;font-size:.78rem;color:#c9cbf0}
/* stage cards */
.sect{font-size:.78rem;color:#c9cbf0;letter-spacing:.08em;margin:2px 4px -6px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage{color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:10px 6px 8px;display:grid;justify-items:center;gap:5px;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s;min-width:0}
.stage:active{transform:translateY(3px)}
.stage[aria-pressed="true"]{background:linear-gradient(180deg,#fff7d1,#ffe68a);box-shadow:0 0 0 3px var(--gold),0 4px 0 rgba(0,0,0,.35)}
.stage .ic{width:36px;height:36px;border-radius:11px;border:3px solid var(--ink);background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:400;font-size:1rem}
.stage .nm{font-size:.78rem;white-space:nowrap}
.stars{display:flex;gap:1px}.stars svg{width:14px;height:14px}
.mbar{width:80%;height:5px;border-radius:99px;background:var(--line);overflow:hidden}.mbar i{display:block;height:100%;background:var(--c)}
.hstage{display:flex;align-items:center;gap:10px;text-align:left;color:#fff;background:linear-gradient(120deg,#3b1d5c,#7a1f4d);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hstage[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pink),0 4px 0 rgba(0,0,0,.35)}
.hstage .ic{width:36px;height:36px;border-radius:11px;border:3px solid var(--ink);background:#1f9fc7;display:grid;place-items:center;font-family:var(--fd);font-weight:400;flex:none}
.hstage .hn{flex:1;font-size:.9rem;display:grid}.hstage .hn small{font-size:.66rem;color:#e9c6dc}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 4px -4px}
.srow .sect{margin:0}
.hardsw{display:flex;align-items:center;gap:6px;background:rgba(10,12,40,.55);border:2px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 10px 4px 5px;color:#c9cbf0;font-family:var(--fd);font-weight:400;font-size:.78rem;letter-spacing:.06em}
.hardsw small{font-family:var(--fu);font-size:.6rem;letter-spacing:0;opacity:.8}
.hardsw[aria-pressed="true"]{background:linear-gradient(120deg,#7a1f4d,var(--pink));border-color:var(--ink);color:#fff}
.tg.sm{width:36px;height:22px;border-width:2px}.tg.sm::after{width:14px;height:14px;top:2px;left:2px;border-width:2px}
.hardsw[aria-pressed="true"] .tg.sm{background:var(--green)}.hardsw[aria-pressed="true"] .tg.sm::after{left:16px}
.lvsel{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(10,12,40,.6);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:4px}
.lvsel button{border:0;border-radius:10px;padding:8px 0;background:transparent;color:#9ea1d6;font-family:var(--fd);font-weight:400;font-size:.85rem;letter-spacing:.06em}
.lvsel button[aria-pressed="true"]{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold-d)}
.lvsel button[data-lv="hard"][aria-pressed="true"]{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
.lvd{margin:-6px 0 0;text-align:center;font-size:.72rem;color:#c9cbf0}
.stages.two{grid-template-columns:1fr 1fr}
.lastbtn{display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.lastbtn .li{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:#5b6cff;color:#fff;display:grid;place-items:center;font-size:1rem}
.lastbtn .lt{flex:1;min-width:0;display:grid}.lastbtn .lt b{font-size:.9rem}.lastbtn .lt small{font-size:.68rem;color:var(--muted)}
.lastbtn .lg{font-size:.8rem;color:#5b6cff}
.emp{padding:12px;display:grid;gap:10px}
.emh b{display:block;font-size:.95rem}.emh small{font-size:.7rem;color:var(--muted)}
.emo{display:grid;gap:8px}
.emo button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px;color:var(--ink)}
.emo .ic{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--ink);background:var(--gray);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:400}
.emo .et{flex:1;display:grid}.emo .et b{font-size:.95rem}.emo .et small{font-size:.68rem;color:var(--muted)}
.emo .ck{flex:none;width:24px;height:24px;border-radius:50%;border:3px solid var(--line);background:#fff}
.emo button[aria-checked="true"]{background:#fff;border:3px solid var(--ink);padding:9px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.emo button[aria-checked="true"] .ic{background:#2f6bd9}
.emo button[aria-checked="true"] .ck{border-color:var(--ink);background:radial-gradient(circle,var(--green) 0 45%,#fff 50%)}
.dslim{display:flex;align-items:center;gap:10px;background:rgba(10,12,40,.55);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;color:#fff;text-align:left}
.dslim[aria-pressed="true"]{border-color:var(--gold)}
.dslim .dt{font-family:var(--fd);font-weight:400;font-size:.62rem;background:var(--gold);color:var(--ink);border-radius:6px;padding:1px 6px;flex:none}
.dslim .dn{flex:1;font-size:.82rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dslim .dm{font-size:.7rem;color:#c9cbf0;flex:none}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);padding:10px;text-align:center}
.mstat div{display:grid}.mstat b{font-family:var(--fd);font-weight:400;font-size:1.25rem}.mstat small{font-size:.66rem;color:var(--muted)}
.mbest{padding:4px 12px}
.mbest>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.mbest>div:last-child{border-bottom:0}
.mbest .ic{width:30px;height:30px;border-radius:9px;border:2px solid var(--ink);background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:400;font-size:.8rem;flex:none}
.mbest .nm{flex:1;font-size:.85rem}.mbest b{font-family:var(--fd);font-weight:400;min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.dlogo{margin:4px auto 0;width:min(340px,90%);line-height:0}
.dlogo svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 18px rgba(255,79,139,.35))}
.dlogo .spk{transform-origin:378px 26px;animation:twk 2.4s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(20deg)}}
.dlogo .spd{animation:dash 1.6s ease-in-out infinite}
@keyframes dash{0%,100%{transform:translateX(0);opacity:1}50%{transform:translateX(-6px);opacity:.6}}
.nickf{padding:14px;display:grid;gap:8px}
.nickf b{font-size:1rem}.nickf small{font-size:.7rem;color:var(--muted)}
.nickf input{font:inherit;font-size:1.05rem;padding:12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.nerr{margin:0;color:var(--pink-d);font-size:.75rem;min-height:1em}
.nickrow{display:flex;align-items:center;gap:10px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;text-align:left}
.nickrow span{font-size:.72rem;color:var(--muted)}.nickrow b{flex:1}.nickrow i{font-style:normal;font-size:.75rem;color:#5b6cff}
.ch{display:block;height:100%;width:auto;max-width:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.22))}
.ch.flip{transform:scaleX(-1)}
.crew{display:flex;justify-content:center;align-items:flex-end;gap:12px;height:72px;opacity:.9;margin-top:2px;overflow:hidden;flex-shrink:0}
.crew span{display:block;height:66px;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite;transform:rotate(var(--r))}
@keyframes idle{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(var(--r)) translateY(-5px)}}
.shch{height:64px;flex:none;margin-left:auto}
.shd>div{flex:1;min-width:0}
.view>.arena-wrap{flex:1;flex-shrink:1;min-height:0;position:relative;display:flex}
.arena-wrap>.arena{flex:1;min-height:0}
.gch{position:absolute;right:10px;bottom:4px;height:96px;pointer-events:none;z-index:3;transform-origin:50% 100%;transition:transform .25s,filter .25s}
.gch.hop{animation:hop2 .45s ease-out}
@keyframes hop2{35%{transform:translateY(-16px) rotate(-6deg)}70%{transform:translateY(0) scaleY(.92)}}
.gch.ouch{transform:rotate(-10deg) translate(-2px,4px);filter:saturate(.5) brightness(.9)}
.rch{display:flex;align-items:flex-end;gap:10px;flex-shrink:0;min-width:0}
.rch .ch{height:76px;flex:none}
.bub{position:relative;min-width:0;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:.85rem;line-height:1.4;margin-bottom:30px}
.bub::before{content:"";position:absolute;left:-9px;bottom:8px;border:6px solid transparent;border-right-color:var(--ink)}
.crewp{padding:12px;display:grid;gap:2px}.crewp>b{font-size:.92rem}.crewp>small{font-size:.68rem;color:var(--muted)}
.crewg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;text-align:center}
.crewg>div{display:grid;justify-items:center;gap:2px;min-width:0}.crewg span{height:76px;display:block}
.crewg b{font-size:.85rem}.crewg small{font-size:.58rem;color:var(--muted);overflow-wrap:anywhere}
.dcard{display:flex;align-items:center;gap:12px;text-align:left;color:#fff;background:linear-gradient(135deg,rgba(255,207,58,.16),rgba(255,79,139,.12)),rgba(10,12,40,.6);border:2px solid rgba(255,207,58,.55);border-radius:18px;padding:10px 12px;flex-shrink:0;min-width:0}
.dcard[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,207,58,.35)}
.dcard.fresh{animation:dglow 2.2s ease-in-out infinite}
@keyframes dglow{50%{box-shadow:0 0 18px rgba(255,207,58,.45)}}
.dcard.done{border-color:rgba(255,255,255,.18);background:rgba(10,12,40,.5)}
.dday{flex:none;width:52px;border-radius:12px;background:#fff;color:var(--ink);border:3px solid var(--ink);display:grid;justify-items:center;line-height:1.05;padding:3px 0;overflow:hidden}
.dday small:first-child{display:block;width:100%;text-align:center;background:var(--pink);color:#fff;font-size:.58rem;padding:2px 0;margin-top:-3px}
.dday b{font-family:var(--fd);font-weight:400;font-size:1.35rem;margin-top:2px}.dday small:last-child{font-size:.56rem;color:var(--muted)}
.dcard.done .dday{opacity:.75}
.dmain{flex:1;min-width:0;display:grid;gap:2px}
.dtop{display:flex;gap:6px;align-items:center}
.dtop .dt{font-family:var(--fd);font-weight:400;font-size:.6rem;background:var(--gold);color:var(--ink);border-radius:6px;padding:1px 6px;letter-spacing:.06em}
.dnew{font-family:var(--fd);font-weight:400;font-size:.6rem;background:var(--pink);color:#fff;border-radius:6px;padding:1px 6px;animation:pop .5s cubic-bezier(.2,2,.4,1)}
.ddone{font-size:.62rem;color:var(--green);border:1px solid var(--green);border-radius:6px;padding:0 6px}
.dn{font-size:.95rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsub{font-size:.64rem;color:#c9cbf0;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsub #dcd{font-family:var(--fd);font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.dgo{flex:none;font-size:.72rem;color:var(--gold);display:flex;align-items:center;gap:2px}.dgo i{font-style:normal;font-size:1.1rem}
.dcard.done .dgo{color:#c9cbf0}
.dtoast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;box-shadow:0 5px 0 rgba(0,0,0,.35);display:grid;text-align:center;width:max-content;max-width:calc(100% - 32px);animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
.dtoast b{font-size:.92rem}.dtoast small{font-size:.68rem;color:var(--muted)}
.dtoast.out{opacity:0;transform:translate(-50%,-12px);transition:.4s}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
.dnote{margin:0;border-radius:12px;background:#fff7d6;border:2px solid #ffe08a;padding:8px 10px;font-size:.74rem;color:#6b5414;line-height:1.5;text-align:center}
.dnote b{display:block;font-size:.86rem;color:var(--ink)}
.dres{margin:0;text-align:center;font-size:.76rem;color:#c9cbf0}.dres b{color:var(--gold)}
.tip{margin:0;text-align:center;font-size:.72rem;color:#9ea1d6}
.sheetbg{position:fixed;inset:0;z-index:45;background:rgba(8,8,30,.6);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:420px;padding:16px;display:grid;gap:12px;animation:up2 .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes up2{from{transform:translateY(60px);opacity:.4}}
.shd{display:flex;align-items:center;gap:12px}
.shd .ic{width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:400;font-size:1.3rem;flex:none}
.shd small{display:block;font-size:.68rem;color:var(--muted)}.shd b{font-family:var(--fd);font-weight:400;font-size:1.3rem;line-height:1.2}
.sst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sst div{background:var(--panel2);border-radius:12px;padding:8px 2px;text-align:center;display:grid}
.sst b{font-family:var(--fd);font-weight:400;font-size:1.1rem;font-variant-numeric:tabular-nums}.sst small{font-size:.62rem;color:var(--muted)}
.stars.big{justify-content:center}.stars.big svg{width:28px;height:28px}
.q2{margin:0;text-align:center;font-size:1rem}
.link.dark{color:var(--muted)}
.hardb{font-family:var(--fd);font-weight:400;font-size:.68rem;color:#fff;background:var(--pink);border:2px solid var(--ink);border-radius:6px;padding:0 6px;margin-left:6px;letter-spacing:.06em}
.set .hint{display:block;font-size:.7rem;color:var(--muted);font-weight:700;margin-top:2px}
.mixp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.mxc{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--muted);padding:8px;font-size:.85rem}
.mxc .ic{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-family:var(--fd);font-weight:400;font-size:.8rem;background:var(--gray)}
.mxc[aria-pressed="true"]{border-color:var(--ink);background:#fff;color:var(--ink)}.mxc[aria-pressed="true"] .ic{background:var(--c)}
/* buttons */
.btn{position:relative;border:3px solid var(--ink);border-radius:18px;padding:14px;color:#fff;font-family:var(--fd);font-weight:400;font-size:1.35rem;letter-spacing:.06em;

const NEWQ={"eng":[{"q":"provide","a":"提供する","hook":["語源","pro(前もって)+vide(見る)。先を見て用意しておくこと"],"story":"provide A with B(AにBを与える)の形が頻出。provide B for Aとの書き換えも狙われる。","use":"The school provides lunch for students.|その学校は生徒に昼食を提供している。"},{"q":"improve","a":"改善する","hook":["連想","今よりプラスにするイメージ。improvement(改善)もセットで覚える"],"story":"自動詞「よくなる」でも使える。His English has improved.のように主語が良くなる形も頻出。","use":"Practice will improve your skills.|練習で技術は向上する。"},{"q":"require","a":"要求する","hook":["語源","re(くり返し)+quire(求める)。question・requestと同じ仲間"],"story":"requirement(必要条件)も長文でよく出る。be required to do(〜することが求められる)は定番。","use":"This job requires patience.|この仕事には忍耐が求められる。"},{"q":"include","a":"含む","hook":["語源","in(中に)+clude(閉じる)。中に閉じこめる。反対はexclude"],"story":"including(〜を含めて)は前置詞的に使われ、料金表や案内文の読解で頻出。","use":"The price includes breakfast.|料金には朝食が含まれている。"},{"q":"increase","a":"増加する","hook":["語源","in(中へ・〜に)+crease(成長する)。どんどん育って大きくなる。反対はdecrease(減少する)"],"story":"グラフ問題の定番語。名詞も同形で、an increase in Aで「Aの増加」。","use":"The number of tourists increased last year.|昨年は観光客の数が増えた。"},{"q":"develop","a":"発達させる","hook":["語源","de(はずす)+velop(包む)。包みをほどいて中身を広げる"],"story":"developing countries(発展途上国)、develop a film(フィルムを現像する)など意味が広い。","use":"Children develop language skills quickly.|子どもは言語能力を素早く伸ばす。"},{"q":"consider","a":"考慮する","hook":["注意","considerate(思いやりのある)とconsiderable(かなりの)は別物"],"story":"consider -ing(〜しようかと考える)の形で、to不定詞ではなく動名詞をとる点が文法問題の定番。","use":"Please consider my idea.|私の考えを検討してください。"},{"q":"suggest","a":"提案する","hook":["語源","sug(下に)+gest(運ぶ)。そっと下から差し出すイメージ"],"story":"suggest that S (should) 原形 の形が頻出。「示唆する」の意味でも読解によく出る。","use":"She suggested going to the park.|彼女は公園に行こうと提案した。"},{"q":"affect","a":"影響を与える","hook":["対比","affectは動詞、effectは名詞(影響・効果)。つづりの違いに注意"],"story":"have an effect on A = affect A の書き換えは頻出パターン。","use":"Weather affects our mood.|天気は私たちの気分に影響する。"},{"q":"environment","a":"環境","hook":["分解","environ(取り囲む)+ment(名詞)。周りを取り囲むもの"],"story":"環境問題の長文で最頻出。形容詞environmental(環境の)もセットで出る。","use":"We must protect the environmen ,"story":"名詞description(描写・説明)も頻出。describe A as B(AをBだと言う)の形もある。","use":"Describe your hometown in English.|故郷を英語で描写しなさい。"},{"q":"population","a":"人口","hook":["語源","popul(人々)。popular(人々に人気の)と同じ仲間"],"story":"人口が多い・少ないはlarge/smallで表し、many/fewは使わない点がよく問われる。","use":"Tokyo has a large population.|東京は人口が多い。"},{"q":"resource","a":"資源","hook":["分解","re(再び)+source(わき出る)。くり返しわき出る源"],"story":"natural resources(天然資源)の形で環境問題の長文に頻出。","use":"Water is a precious resource.|水は貴重な資源だ。"},{"q":"species","a":"種","hook":["注意","単数も複数もspecies。sは複数のsではない"],"story":"endangered species(絶滅危惧種)は生物系の長文で頻出の組み合わせ。","use":"Many species live in this forest.|この森には多くの種が生息している。"},{"q":"tradition","a":"伝統","hook":["語源","trans(向こうへ)+dit(渡す)。世代から世代へ手渡されるもの"],"story":"形容詞traditional(伝統的な)も頻出。異文化紹介の読解でよく使われる。","use":"This festival is an old tradition.|この祭りは古い伝統だ。"},{"q":"purpose","a":"目的","hook":["注意","on purpose は「わざと」。熟語として頻出"],"story":"for the purpose of -ing(〜する目的で)は文章の要旨をつかむ設問でよく出る。","use":"What is the purpose of your visit?|訪問の目的は何ですか。"},{"q":"positive","a":"前向きな","hook":["対比","反対はnegative。プラス思考とマイナス思考のペア"],"story":"検査結果などでは「陽性の」の意味になる。文脈で意味を判断する問題がある。","use":"Try to stay positive.|前向きでいるようにしよう。"},{"q":"aware","a":"気づいている","hook":["注意","be aware of A / be aware that〜 の形で使う"],"story":"名詞awareness(意識・認識)も頻出。raise awareness(意識を高める)は定番表現。","use":"Are you aware of the danger?|その危険に気づいていますか。"},{"q":"familiar","a":"よく知っている","hook":["語源","family(家族)と同じ語源。家族のようになじみがある"],"story":"A is familiar to 人(Aは人に知られている)と人 is familiar with A(人はAに詳しい)の区別が頻出。","use":"This song is familiar to me.|この歌は聞き覚えがある。"},{"q":"responsible","a":"責任がある","hook":["分解","response(応答)+ible(できる)。求めに応じられる立場"],"story":"be responsible for A(Aに責任がある)の形で、前置詞forが問われる。","use":"I am responsible for the team.|私はチームの責任者だ。"},{"q":"independent","a":"独立した","hook":["分解","in(否定)+depend(頼る)+ent。誰にも頼らない"],"story":"be independent of A(Aから独立している)はofを使う。dependの後のonとの違いに注意。","use":"She became independent at twenty.|彼女は20歳で自立した。"},{"q":"obvious","a":"明らかな","hook":["語源","ob(前に)+via(道)。道の前にあって誰にでも見える"],"story":"It is obvious that〜(〜は明らかだ)の形で使う。副詞obviouslyも会話で頻出。","use":"The answer is obvious.|答えは明らかだ。"},{"q":"convenient","a":"便利な","hook":["語源","con(共に)+ven(来る)。都合よくそろってやって来る"],"story":"人を主語にしない。「あなたの都合がよければ」はif it is convenient for youが正しい。","use":"This store is convenient for shopping.|この店は買い物に便利だ。"},{"q":"accurate","a":"正確な","hook":["語源","ac(〜に)+cur(注意・世話)。注意を払って仕上げた"],"story":"名詞accuracy(正確さ)も出る。反意語はinaccurate。","use":"This clock is very accurate.|この時計はとても正確だ。"},{"q":"physical","a":"身体の","hook":["対比","physical(体の)とmental(心の)はペアで出やすい"],"story":"physics(物理学)と同じ語源で「物質の」の意味もある。physical education=体育。","use":"Physical exercise is good for you.|体を動かすことは健康によい。"},{"q":"mental","a":"精神の","hook":["対比","mind(心)の形容詞的な仲間。physicalの反対"],"story":"mental health(心の健康)は健康・生活系の長文で頻出の組み合わせ。","use":"Sleep is important for mental health.|睡眠は心の健康に大切だ。"},{"q":"rapid","a":"急速な","hook":["連想","駅の英語表示で「快速」はRapid。速く進むイメージ"],"story":"rapid growth(急成長)の形が多い。副詞rapidlyはグラフの急な変化を表す。","use":"The city saw rapid growth.|その都市は急速に成長した。"},{"q":"enormous","a":"巨大な","hook":["語源","e(外へ)+norm(基準)。基準から外れるほど大きい"],"story":"hugeとほぼ同じ意味。normal(普通の)と同じnormが入っている。","use":"An enormous whale appeared.|巨大なクジラが現れた。"},{"q":"rare","a":"まれな","hook":["注意","副詞rarelyは「めったに〜ない」と否定の意味になる"],"story":"ステーキの焼き方の「レア」も同じつづりだが、こちらは「生焼けの」で別の意味。","use":"This bird is very rare.|この鳥はとても珍しい。"},{"q":"ordinary","a":"普通の","hook":["語源","order(順序)と同じ仲間。いつもの順番どおり"],"story":"extraordinary(並外れた)はextra(外)+ordinaryで、反意語として一緒に覚えたい。","use":"It was an ordinary day.|それは普段どおりの一日だった。"},{"q":"global","a":"世界的な","hook":["分解","globe(地球・球体)+al。地球全体にかかわる"],"story":"global warming(地球温暖化)は環境系の長文で最頻出の組み合わせ。","use":"Climate change is a global problem.|気候変動は世界的な問題だ。"},{"q":"annual","a":"毎年の","hook":["語源","ann(年)。anniversary(記念日)と同じ仲間"],"story":"annual event(年中行事)、annual income(年収)など、お知らせ文で頻出。","use":"The school has an annual festival.|その学校では毎年祭りがある。"},{"q":"domestic","a":"国内の","hook":["語源","dom(家)。家の中のもの→国の中のもの"],"story":"「家庭の」の意味もある。domestic flights(国内線)とinternational flightsの対比で出る。","use":"We took a domestic flight.|私たちは国内線に乗った。"},{"q":"complex","a":"複雑な","hook":["語源","com(共に)+plex(編む)。いくつも編みこまれた"],"story":"名詞では「コンプレックス(劣等感)」より「複合施設」の意味で読解に出ることが多い。","use":"This problem is very complex.|この問題はとても複雑だ。"},{"q":"flexible","a":"柔軟な","hook":["語源","flex(曲げる)+ible(できる)。曲げられる"],"story":"flexible schedule(融通のきく予定)など、働き方の話題でよく使われる。","use":"My work hours are flexible.|私の勤務時間は融通がきく。"},{"q":"attempt","a":"試みる","hook":["語源","at(〜に)+tempt(試す)。何かに試しに手を出す"],"story":"名詞でもmake an attempt to do(〜しようと試みる)と使う。tryより改まった語。","use":"He attempted to climb the mountain.|彼はその山に登ろうと試みた。"},{"q":"apply","a":"申し込む","hook":["注意","apply for A(職・許可などを求めて申し込む)/apply to A(Aに当てはまる・(学校など)Aに出願する)"],"story":"名詞application(申し込み・応用)は、スマホの「アプリ」の元の語でもある。","use":"I applied for the job.|私はその仕事に応募した。"},{"q":"approach","a":"近づく","hook":["注意","他動詞なのでapproach the doorとし、toをつけない"],"story":"名詞では「取り組み方」の意味が長文で多い。a new approach to Aの形で使う。","use":"A typhoon is approaching Japan.|台風が日本に近づいている。"},{"q":"assume","a":"想定する","hook":["注意","証拠なしに当然だと思いこむニュアンス"],"story":"assume that〜で使う。名詞assumption(仮定)は論説文の読解で出る。","use":"I assumed you were busy.|君は忙しいのだと思っていた。"},{"q":"claim","a":"主張する","hook":["注意","日本語の「クレーム(苦情)」はcomplaint。claimは主張"],"story":"和製英語との違いを問う問題が出やすい。baggage claimは空港の手荷物受取所。","use":"He claims he saw a UFO.|彼はUFOを見たと主張している。"},{"q":"concentrate","a":"集中する","hook":["分解","con(共に)+center(中心)。一点の中心に集める"],"story":"concentrate on A(Aに集中する)でonを使う。focus on Aとほぼ同じ意味。","use":"I can't concentrate on my homework.|宿題に集中できない。"},{"q":"determine","a":"決定する","hook":["語源","de(完全に)+term(境界)。境界線をはっきり引く"],"story":"be determined to do(〜する決心をしている)の形も頻出。","use":"Your effort determines your future.|努力が未来を決める。"},{"q":"establish","a":"設立する","hook":["語源","stable(安定した)と同じ語源。しっかり立たせる"],"story":"The school was established in 1900.のように受け身で設立年を表す形が多い。","use":"The company was established in 1990.|その会社は1990年に設立された。"},{"q":"exist","a":"存在する","hook":["語源","ex(外へ)+sist(立つ)。外に現れて立っている"],"story":"名詞existence(存在)も頻出。進行形にしない状態動詞である点に注意。","use":"Do ghosts really exist?|幽霊は本当に存在するの?"},{"q":"observe","a":"観察する","hook":["注意","「(規則を)守る」の意味もある。observe the rules"],"story":"名詞はobservation(観察)とobservance(順守)で意味が分かれる。","use":"We observed the stars at night.|私たちは夜に星を観察した。"},{"q":"predict","a":"予測する","hook":["語源","pre(前に)+dict(言う)。起こる前に言う"],"story":"名詞prediction(予測)も頻出。dictionary(辞書)にも同じdictが入っている。","use":"It is hard to predict the weather.|天気を予測するのは難しい。"},{"q":"prevent","a":"防ぐ","hook":["語源","pre(前に)+vent(来る)。先回りして立ちふさがる"],"story":"prevent 人 from -ing(人が〜するのを妨げる)の形が文法問題の定番。","use":"Rain prevented us from going out.|雨で私たちは外出できなかった。"},{"q":"protect","a":"保護する","hook":["語源","pro(前を)+tect(覆う)。前に立って覆い守る"],"story":"protect A from B(AをBから守る)の形で使う。名詞はprotection。","use":"Sunscreen protects your skin.|日焼け止めは肌を守る。"},{"q":"replace","a":"取り替える","hook":["分解","re(再び)+place(置く)。元の場所に別の物を置く"],"story":"replace A with B(AをBに取り替える)の形が頻出。","use":"I replaced the old battery.|古い電池を交換した。"},{"q":"respond","a":"応答する","hook":["注意","自動詞なのでrespond to Aとtoをつける"],"story":"名詞response(返答・反応)も頻出。in response to A(Aに応じて)は定番。","use":"She didn't respond to my email.|彼女は私のメールに返事をしなかった。"},{"q":"survive","a":"生き残る","hook":["語源","sur(越えて)+vive(生きる)。困難を越えて生きる"],"story":"他動詞で「〜を切り抜ける」。survive the warのようにinを入れない点に注意。","use":"Few trees survived the storm.|嵐を生き延びた木はわずかだった。"},{"q":"tend","a":"傾向がある","hook":["注意","tend to do(〜しがちである)の形でほぼ使う"],"story":"名詞tendency(傾向)も頻出。調査結果を述べる文で好んで使われる。","use":"I tend to sleep late on Sundays.|日曜は遅くまで寝がちだ。"},{"q":"adapt","a":"適応する","hook":["対比","adapt(適応する)とadopt(採用する)。aとoの1字違い"],"story":"adapt to A(Aに適応する)の形が頻出。adoptとの取り違えは定番のひっかけ。","use":"Animals adapt to cold weather.|動物は寒い気候に適応する。"},{"q":"depend","a":"頼る","hook":["語源","de(下に)+pend(ぶら下がる)。何かにぶら下がる"],"story":"depend on A(Aに頼る/Aしだいだ)。It depends.(場合によるね)は会話の定番。","use":"Children depend on their parents.|子どもは親に頼っている。"},{"q":"persuade","a":"説得する","hook":["注意","persuade 人 to do。「説得して〜させる」まで含む"],"story":"tryと違い、persuadeは説得に成功した意味を含む。名詞はpersuasion。","use":"I persuaded him to join us.|私は彼を説得して仲間に入れた。"},{"q":"deserve","a":"値する","hook":["注意","進行形にしない。You deserve it.(当然だよ/自業自得だ)"],"story":"良い意味にも悪い意味にも使える。deserve to do(〜するに値する)の形もある。","use":"You deserve a rest.|あなたは休んで当然だ。"},{"q":"ignore","a":"無視する","hook":["対比","ignorance(無知)・ignorant(無知な)は意味がずれるので注意"],"story":"ignoreは知っていてわざと無視すること。ignorantは知らないことで、意味の区別が問われる。","use":"Don't ignore my advice.|私の忠告を無視しないで。"},{"q":"admit","a":"認める","hook":["語源","ad(〜へ)+mit(送る)。中へ送り入れる→受け入れる"],"story":"admit -ing(〜したことを認める)で動名詞をとる。「入場を許す」の意味もある。","use":"He admitted his mistake.|彼は自分の間違いを認めた。"},{"q":"confirm","a":"確認する","hook":["語源","con(強く)+firm(固い)。しっかり固めて確かにする"],"story":"予約の確認メールで頻出。名詞confirmation(確認)もお知らせ文に出る。","use":"Please confirm your reservation.|予約を確認してください。"},{"q":"emerge","a":"現れる","hook":["語源","e(外へ)+merge(沈める)。沈んでいた所から外に出る"],"story":"emergency(緊急事態)は「突然現れた事態」から来ており、同じ語源。","use":"The sun emerged from the clouds.|太陽が雲の間から現れた。"},{"q":"generate","a":"生み出す","hook":["語源","gen(生む)。gene(遺伝子)やgeneration(世代)と同じ仲間"],"story":"generate electricity(発電する)はエネルギー系の長文で頻出の組み合わせ。","use":"Wind can generate electricity.|風で電気を生み出せる。"},{"q":"interpret","a":"解釈する","hook":["連想","interpreter(通訳者)。言葉の意味をくみ取って伝える"],"story":"「通訳する」の意味もある。名詞interpretation(解釈)は論説文で出る。","use":"How do you interpret this poem?|この詩をどう解釈しますか。"},{"q":"measure","a":"測る","hook":["連想","巻き尺の「メジャー」。長さや量をはかる"],"story":"名詞で「対策」の意味があり、take measures(対策をとる)は読解で狙われる。","use":"Measure the length of the desk.|机の長さを測りなさい。"},{"q":"regard","a":"みなす","hook":["注意","regard A as B(AをBとみなす)の形で覚える"],"story":"think of A as B、look on A as Bと同じ意味の書き換え問題が頻出。","use":"They regard him as a hero.|彼らは彼を英雄とみなしている。"},{"q":"conduct","a":"行う","hook":["語源","con(共に)+duct(導く)。みんなを導いて進める"],"story":"conductor(指揮者・車掌)も同じ語源。conduct a survey(調査を行う)が定番。","use":"They conducted a survey of students.|彼らは生徒の調査を行った。"},{"q":"evidence","a":"証拠","hook":["語源","e(外へ)+vid(見る)。外からはっきり見えるもの"],"story":"数えられない名詞なのでan evidenceやevidencesは誤り。a piece of evidenceと言う。","use":"There is no evidence for that.|それを示す証拠はない。"},{"q":"factor","a":"要因","hook":["語源","fac(作る)。結果を作り出すもの。factory(工場)と同じ仲間"],"story":"a key factor(主な要因)の形で、原因を問う読解設問によく出る。","use":"Sleep is a key factor in health.|睡眠は健康の重要な要因だ。"},{"q":"feature","a":"特徴","hook":["注意","動詞では「特集する・呼び物にする」。雑誌の特集記事も同じ語"],"story":"音楽のfeat.(フィーチャリング)は「ゲストとして参加」の意味で、この動詞の用法。","use":"Big eyes are a feature of owls.|大きな目はフクロウの特徴だ。"},{"q":"method","a":"方法","hook":["連想","メソッド。手順が決まった体系的なやり方"],"story":"wayより改まった語で、学習法や研究方法の説明に多い。","use":"This is a new teaching method.|これは新しい教授法だ。"},{"q":"emotion","a":"感情","hook":["語源","e(外へ)+mot(動く)。心が外へ動き出す"],"story":"形容詞emotional(感情的な)も頻出。motion(動き)と同じ語源。","use":"Music can express strong emotions.|音楽は強い感情を表現できる。"},{"q":"effort","a":"努力","hook":["語源","ef(外へ)+fort(力)。力を外に出しきる"],"story":"make an effort to do(〜しようと努力する)の形で、makeと結びつく点が狙われる。","use":"Your effort paid off.|あなたの努力は報われた。"},{"q":"function","a":"機能","hook":["連想","スマホの「〜機能」。そのものが果たす働き"],"story":"動詞で「機能する・働く」。数学では「関数」の意味になる。","use":"This phone has many functions.|この電話には多くの機能がある。"},{"q":"shortage","a":"不足","hook":["分解","short(足りない)+age(名詞)。足りない状態"],"story":"a shortage of A(Aの不足)の形で使う。water shortage(水不足)は定番。","use":"There is a shortage of nurses.|看護師が不足している。"},{"q":"agriculture","a":"農業","hook":["語源","agri(畑)+culture(耕すこと)。畑を耕すこと"],"story":"cultureはもともと「耕す」の意味。形容詞agricultural(農業の)も出る。","use":"Agriculture is important in this area.|この地域では農業が重要だ。"},{"q":"income","a":"収入","hook":["分解","in(中に)+come(来る)。中に入ってくるお金"],"story":"収入の多い・少ないはhigh/lowやlarge/smallで表し、many/muchは使わない。","use":"His income is high.|彼の収入は多い。"},{"q":"concern","a":"懸念","hook":["注意","be concerned about A(心配する)とwith A(関係する)の違い"],"story":"動詞「〜に関係する」の意味もあり、as far as I am concerned(私に関する限り)は熟語。","use":"Safety is our main concern.|安全が私たちの一番の心配事だ。"},{"q":"cooperate","a":"協力する","hook":["分解","co(共に)+operate(働く)。一緒に作業する"],"story":"cooperate with A(Aと協力する)の形で使う。名詞cooperation。","use":"Let's cooperate with each other.|お互いに協力しよう。"},{"q":"prohibit","a":"禁止する","hook":["語源","pro(前に)+hibit(持つ)。前に立ちはだかって止める"],"story":"prohibit 人 from -ing(人が〜するのを禁じる)の形で、fromが問われる。","use":"Smoking is prohibited here.|ここでは喫煙が禁止されている。"},{"q":"decade","a":"10年間","hook":["語源","deca(10)。decimal(十進法の)と同じ仲間"],"story":"for decades(何十年も)、in the last decade(この10年で)はグラフ問題で頻出。","use":"Prices have risen over the past decade.|この10年で物価が上がった。"}],"toeic":[{"q":"agenda","a":"議題","hook":["語源","ラテン語で「なされるべきこと」が由来"],"story":"会議の案内メールで頻出。on the agenda で「議題に上がって」。Part 3・7の定番語。","use":"Please review the agenda before the meeting.|会議の前に議題に目を通してください。"},{"q":"reservation","a":"予約","hook":["連想","reserve(取っておく)の名詞形"],"story":"レストランやホテルの予約はPart 2・3の定番。make a reservation の形で覚えよう。","use":"I'd like to make a reservation for four.|4名で予約をお願いしたいです。"},{"q":"conference","a":"会議","hook":["連想","confer(協議する)の名詞形"],"story":"大規模な会議・学会を指すことが多い。conference room(会議室)も頻出表現。","use":"The conference room is on the third floor.|会議室は3階にあります。"},{"q":"receipt","a":"領収書","hook":["注意","pは発音しない。レシート"],"story":"返品や経費精算の場面で頻出。invoice(請求書)と混同しないよう注意。","use":"Please keep your receipt for any returns.|返品の際は領収書を保管してください。"},{"q":"budget","a":"予算","hook":["語源","古フランス語の「小さな袋」が由来"],"story":"within budget(予算内で)、over budget(予算超過)はPart 3・7の頻出表現。","use":"The project was completed within budget.|そのプロジェクトは予算内で完了した。"},{"q":"expense","a":"経費","hook":["連想","expensive(高価な)の仲間"],"story":"travel expenses(出張経費)、expense report(経費報告書)がTOEICの定番。","use":"Submit your travel expenses by Friday.|出張経費は金曜日までに提出してください。"},{"q":"submit","a":"提出する","hook":["分解","sub(下に)+mit(送る)"],"story":"書類やレポートの提出で頻出。submit A to B の形。名詞はsubmission。","use":"Please submit the report to your manager.|報告書を上司に提出してください。"},{"q":"approve","a":"承認する","hook":["連想","prove(証明する)と綴りが似ている"],"story":"approve A または approve of A。名詞はapproval。予算や企画の承認場面で頻出。","use":"The director approved the new budget.|部長が新しい予算を承認した。"},{"q":"register","a":"登録する","hook":["連想","レジ(cash register)と同じ単語"],"story":"register for a workshop(研修に申し込む)の形で頻出。名詞はregistration。","use":"Please register for the seminar online.|セミナーにはオンラインで登録してください。"},{"q":"department","a":"部署","hook":["連想","デパート=部門が分かれた店"],"story":"accounting department(経理部)、sales department(営業部)などPart 3で頻出。","use":"She works in the marketing department.|彼女はマーケティング部で働いている。"},{"q":"branch","a":"支店","hook":["連想","本来は木の「枝」。枝分かれした店"],"story":"branch office(支社)、open a new branch(新支店を開く)が定番の言い回し。","use":"We are opening a new branch in Osaka.|大阪に新しい支店を開設します。"},{"q":"headquarters","a":"本社","hook":["注意","単数でも最後にsが付く"],"story":"HQと略される。be headquartered in(〜に本社を置く)もPart 7の会社紹介で頻出。","use":"Our headquarters is located in Tokyo.|当社の本社は東京にあります。"},{"q":"client","a":"顧客","hook":["連想","クライアント=仕事の依頼主"],"story":"専門サービスの顧客を指すことが多い。customer(店の客)との使い分けがポイント。","use":"I have a meeting with a client at two.|2時に顧客と打ち合わせがあります。"},{"q":"contract","a":"契約","hook":["連想","コントラクト=取り決め"],"story":"sign a contract(契約を結ぶ)、renew a contract(契約を更新する)が頻出。","use":"Both companies signed the contract today.|両社は本日契約に署名した。"},{"q":"proposal","a":"提案書","hook":["連想","propose(提案する)の名詞形"],"story":"submit a proposal(提案書を提出する)の形でPart 7のメールに頻出。","use":"We reviewed your proposal carefully.|御社の提案書を慎重に検討しました。"},{"q":"negotiate","a":"交渉する","hook":["連想","ネゴ(交渉)はnegotiationの略"],"story":"negotiate a contract(契約を交渉する)。名詞negotiationも頻出。","use":"We need to negotiate a better price.|もっと良い価格を交渉する必要がある。"},{"q":"brochure","a":"パンフレット","hook":["語源","仏語brocher(とじる)から。とじた冊子"],"story":"ビジネスではpamphletよりbrochureがよく使われる。Part 7の広告・案内で頻出。","use":"Please take a brochure at the front desk.|受付でパンフレットをお取りください。"},{"q":"merchandise","a":"商品","hook":["連想","merchant(商人)と同じ語源"],"story":"不可算名詞なので a や -s は付かない。グッズを指す merch はこの略。","use":"All merchandise is 20 percent off today.|本日は全商品が2割引きです。"},{"q":"warranty","a":"保証","hook":["語源","guarantee(保証)と同じ語源の単語"],"story":"under warranty(保証期間中で)が頻出。家電の修理や返品の話題でよく出る。","use":"The printer is still under warranty.|そのプリンターはまだ保証期間内です。"},{"q":"defective","a":"欠陥のある","hook":["連想","defect(欠陥)の形容詞形"],"story":"defective product(不良品)はPart 3・7の苦情・返品場面の定番。","use":"We will replace any defective items.|不良品はすべて交換いたします。"},{"q":"replace","a":"交換する","hook":["分解","re(再び)+place(置く)"],"story":"replace A with B(AをBと取り替える)の形が頻出。名詞はreplacement。","use":"We need to replace the old printer.|古いプリンターを交換する必要がある。"},{"q":"repair","a":"修理する","hook":["連想","リペア=修理"],"story":"名詞としても使い、under repair(修理中)はPart 1の写真問題でも出る。","use":"The technician will repair the copier today.|技術者が今日コピー機を修理します。"},{"q":"install","a":"設置する","hook":["連想","アプリのインストールと同じ単語"],"story":"ソフトだけでなく機械や設備の設置にも使う。名詞はinstallation。","use":"New lights were installed in the lobby.|ロビーに新しい照明が設置された。"},{"q":"equipment","a":"機器","hook":["注意","不可算名詞。equipmentsとは言わない"],"story":"office equipment(事務機器)が頻出。数えるときは a piece of equipment。","use":"Please handle the equipment with care.|機器は丁寧に扱ってください。"},{"q":"facility","a":"施設","hook":["連想","facile(容易な)が元。便利にする場所"],"story":"複数形facilitiesで設備全体を指すことも多い。Part 4の施設案内で頻出。","use":"The new facility opens next month.|新しい施設は来月開業する。"},{"q":"supplies","a":"備品","hook":["連想","supply(供給する)の複数名詞"],"story":"office supplies(事務用品)の形で頻出。発注や在庫の話題でよく出る。","use":"We are running low on office supplies.|事務用品が残り少なくなっている。"},{"q":"supplier","a":"供給業者","hook":["連想","supply(供給する)+er(人・会社)"],"story":"部品や原料の仕入れ先を指す。vendorとほぼ同じ意味で使われる。","use":"We found a new supplier for paper.|紙の新しい仕入れ先を見つけた。"},{"q":"inquiry","a":"問い合わせ","hook":["語源","in(中へ)+quire(求める)"],"story":"Thank you for your inquiry. はPart 7の返信メールの定番の書き出し。","use":"Thank you for your inquiry about our services.|当社サービスへのお問い合わせありがとうございます。"},{"q":"complaint","a":"苦情","hook":["連想","complain(不平を言う)の名詞形"],"story":"file a complaint(苦情を申し立てる)。客の苦情対応はPart 3の定番場面。","use":"We received a complaint about the noise.|騒音についての苦情を受けた。"},{"q":"recruit","a":"採用する","hook":["連想","リクルートスーツのリクルート"],"story":"新しい人材を募集・採用する意味。名詞recruitmentも求人広告で頻出。","use":"We plan to recruit five new engineers.|新たに技術者を5人採用する予定だ。"},{"q":"résumé","a":"履歴書","hook":["語源","フランス語で「要約」の意味"],"story":"resumeと書くことも多い。動詞resume(再開する)と発音が違うので注意。","use":"Please send your résumé by email.|履歴書をメールで送ってください。"},{"q":"qualification","a":"資格","hook":["連想","qualify(資格を与える)の名詞形"],"story":"求人広告で頻出。形容詞qualified(資格のある、適任の)もセットで覚えよう。","use":"What qualifications are required for this job?|この仕事にはどんな資格が必要ですか。"},{"q":"personnel","a":"人員","hook":["注意","personal(個人の)と綴りが似ている"],"story":"アクセントは最後のnel。personnel department(人事部)も頻出表現。","use":"All personnel must wear ID badges.|全職員は身分証を着用すること。"},{"q":"retire","a":"退職する","hook":["連想","リタイア=引退"],"story":"定年退職を指す。名詞retirementは退職記念パーティーの話題で頻出。","use":"Mr. Lee will retire at the end of March.|リー氏は3月末で退職する。"},{"q":"relocate","a":"移転する","hook":["分解","re(再び)+locate(置く)"],"story":"オフィスや店舗の移転、社員の転勤の両方に使う。名詞はrelocation。","use":"The office will relocate to Nagoya in May.|事務所は5月に名古屋へ移転する。"},{"q":"commute","a":"通勤する","hook":["連想","commuter(通勤者)とセットで覚える"],"story":"名詞として「通勤」の意味もあり、a long commute(長い通勤)が頻出。","use":"I commute to work by train.|私は電車で通勤している。"},{"q":"fare","a":"運賃","hook":["注意","fair(公平な、見本市)と同じ発音"],"story":"バスや電車、飛行機などの乗り物の料金。音が同じfairとの聞き分けに注意。","use":"The bus fare has gone up this year.|今年バスの運賃が上がった。"},{"q":"board","a":"搭乗する","hook":["連想","on board=乗り物に乗って"],"story":"boarding pass(搭乗券)は空港の場面で頻出。名詞では「取締役会」の意味も。","use":"Passengers may now board the plane.|乗客の皆様はただいまからご搭乗いただけます。"},{"q":"depart","a":"出発する","hook":["連想","departure(出発)の動詞形"],"story":"depart from A(Aから出発する)。空港や駅のアナウンスでPart 4に頻出。","use":"The train departs at nine sharp.|列車は9時ちょうどに出発する。"},{"q":"destination","a":"目的地","hook":["連想","destiny(運命)と同じ語源"],"story":"旅行・出張の話題で頻出。tourist destination(観光地)の形もよく出る。","use":"We arrived at our destination on time.|私たちは時間通りに目的地に着いた。"},{"q":"luggage","a":"手荷物","hook":["注意","不可算名詞。luggagesとは言わない"],"story":"baggageとほぼ同じ意味。数えるときは a piece of luggage と言う。","use":"Please keep your luggage with you.|手荷物はお手元から離さないでください。"},{"q":"directions","a":"道順","hook":["注意","道順の意味では複数形で使う"],"story":"ask for directions(道を尋ねる)が頻出。単数directionは「方向」。","use":"Could you give me directions to the station?|駅への道順を教えていただけますか。"},{"q":"construction","a":"工事","hook":["連想","construct(建設する)の名詞形"],"story":"under construction(工事中)はPart 1・4の定番。道路工事の案内でよく出る。","use":"The road is closed for construction.|その道路は工事のため通行止めだ。"},{"q":"workshop","a":"研修会","hook":["連想","作業場=参加して手を動かす会"],"story":"参加型の研修やセミナーを指す。attend a workshop(研修会に出る)が頻出。","use":"All staff will attend a safety workshop.|全職員が安全研修会に参加する。"},{"q":"launch","a":"発売する","hook":["連想","ロケットを打ち上げる=世に出す"],"story":"新製品の発売や事業の開始で頻出。product launch(製品発表)の形も多い。","use":"We will launch the new model in June.|6月に新モデルを発売する。"},{"q":"advertise","a":"宣伝する","hook":["連想","advertisement(広告)とセットで覚える"],"story":"広告はadと略される。求人をadvertise a position と言うのもPart 7で頻出。","use":"We advertise our products on social media.|当社はSNSで製品を宣伝している。"},{"q":"survey","a":"調査","hook":["連想","sur(上から)+vey(見る)=見渡す"],"story":"customer survey(顧客アンケート)が頻出。Part 7の表やグラフ問題でよく出る。","use":"Please complete this short customer survey.|この短い顧客アンケートにご回答ください。"},{"q":"competitor","a":"競合他社","hook":["連想","compete(競争する)+or(者)"],"story":"ライバル企業を指す。形容詞competitive(競争力のある)とセットで頻出。","use":"Our prices are lower than our competitors'.|当社の価格は競合他社より安い。"},{"q":"demand","a":"需要","hook":["対比","supply(供給)とdemand(需要)"],"story":"in high demand(需要が高い)が頻出。動詞では「要求する」の意味もある。","use":"Demand for the product is growing fast.|その製品の需要は急速に伸びている。"},{"q":"revenue","a":"収益","hook":["語源","仏語revenir(戻ってくる)が由来"],"story":"企業の売上・収入を指す。Part 7の業績記事やグラフ問題で頻出。","use":"Revenue rose by ten percent this year.|今年は収益が10パーセント増えた。"},{"q":"exceed","a":"上回る","hook":["語源","ex(外へ)+ceed(行く)"],"story":"exceed expectations(期待を上回る)が定番。業績の話題で頻出。","use":"Sales exceeded our expectations this quarter.|今四半期の売上は予想を上回った。"},{"q":"implement","a":"実施する","hook":["注意","名詞では「道具」の意味もある"],"story":"計画や制度を実行に移す意味。implement a new policy(新方針を実施する)。","use":"We will implement the new system in April.|4月に新システムを導入・実施する。"},{"q":"oversee","a":"監督する","hook":["分解","over(上から)+see(見る)"],"story":"プロジェクトや部下を管理する意味。求人広告の職務説明で頻出。","use":"She will oversee the entire project.|彼女がプロジェクト全体を監督する。"},{"q":"coordinate","a":"調整する","hook":["連想","服のコーディネート=組み合わせを整える"],"story":"予定や作業をまとめて調整する意味。名詞coordinator(まとめ役)も頻出。","use":"Please coordinate the schedule with the team.|チームと日程を調整してください。"},{"q":"assist","a":"手伝う","hook":["連想","サッカーのアシスト=得点を手助け"],"story":"assist A with B(AのBを手伝う)の形で頻出。名詞assistanceも重要。","use":"Can you assist me with this report?|この報告書を手伝ってもらえますか。"},{"q":"notify","a":"通知する","hook":["連想","notice(通知)と同じ仲間"],"story":"notify A of B(AにBを知らせる)の形が頻出。名詞はnotification。","use":"Please notify us of any changes.|変更があればお知らせください。"},{"q":"remind","a":"思い出させる","hook":["分解","re(再び)+mind(心)に浮かべる"],"story":"remind A to do、remind A of B の形。リマインダーメールの話題で頻出。","use":"Please remind me to call the client.|顧客に電話するよう私に念押ししてください。"},{"q":"announce","a":"発表する","hook":["連想","アナウンス=公に知らせる"],"story":"名詞announcementはPart 4の館内放送や社内告知の定番。","use":"The CEO announced the merger yesterday.|CEOが昨日合併を発表した。"},{"q":"article","a":"記事","hook":["注意","「品物」「条項」の意味もある"],"story":"Part 7で新聞や雑誌の記事として頻出。an article of clothing は衣類1点。","use":"I read an article about our company.|当社に関する記事を読んだ。"},{"q":"publish","a":"出版する","hook":["連想","public(公の)と同じ語源"],"story":"本や記事を出す意味。名詞publisher(出版社)、publication(出版物)も頻出。","use":"The book will be published next spring.|その本は来春出版される。"},{"q":"editor","a":"編集者","hook":["連想","edit(編集する)+or(人)"],"story":"Part 7の雑誌・新聞関連の文書で頻出。editor-in-chiefは編集長。","use":"The editor approved my article.|編集者が私の記事を承認した。"},{"q":"executive","a":"重役","hook":["連想","CEOのEはexecutive"],"story":"execute(実行する)の派生語。形容詞では「経営の、管理職の」の意味。","use":"The executives met to discuss the plan.|重役たちが計画について話し合った。"},{"q":"representative","a":"担当者","hook":["連想","represent(代表する)の名詞形"],"story":"sales representative(営業担当)、customer service representative が頻出。","use":"A representative will contact you soon.|担当者がまもなくご連絡します。"},{"q":"merger","a":"合併","hook":["連想","merge(合わさる)の名詞形"],"story":"M&AのMはmerger、Aはacquisition(買収)。Part 7の経済記事で頻出。","use":"The merger will be completed in June.|合併は6月に完了する予定だ。"},{"q":"acquisition","a":"買収","hook":["連想","acquire(手に入れる)の名詞形"],"story":"企業買収を指す。M&AのA。merger(合併)との違いを押さえよう。","use":"The acquisition expanded our market share.|その買収で当社の市場シェアが拡大した。"},{"q":"shareholder","a":"株主","hook":["分解","share(株)+holder(持つ人)"],"story":"shareholders' meeting(株主総会)が頻出。stockholderも同じ意味。","use":"The shareholders approved the new plan.|株主が新しい計画を承認した。"},{"q":"cater","a":"料理を提供する","hook":["連想","ケータリングのcater"],"story":"パーティーやイベントへの出張料理。caterer(仕出し業者)もPart 3で頻出。","use":"A local restaurant will cater the event.|地元のレストランがイベントの料理を担当する。"},{"q":"refreshments","a":"軽食","hook":["注意","この意味では通常複数形で使う"],"story":"Refreshments will be served.(軽食が出ます)はイベント案内の定番文。","use":"Refreshments will be served after the talk.|講演の後に軽食が出ます。"},{"q":"banquet","a":"宴会","hook":["語源","イタリア語の「小さなベンチ」が由来"],"story":"awards banquet(授賞式の夕食会)など、正式な晩餐会を指すことが多い。","use":"The annual banquet will be held in May.|毎年恒例の宴会は5月に開かれる。"},{"q":"reception","a":"受付","hook":["連想","receive(受け取る)の名詞形"],"story":"reception desk(受付)のほか「歓迎会」の意味もある。文脈で判断しよう。","use":"Please check in at reception.|受付でチェックインしてください。"},{"q":"attire","a":"服装","hook":["連想","ア・タイア→タイを締めてきちんと服装"],"story":"business attire(ビジネス向けの服装)、formal attire が頻出。やや改まった語。","use":"Business attire is required for the event.|イベントにはビジネスにふさわしい服装でお越しください。"},{"q":"regulation","a":"規則","hook":["連想","regular(規則的な)と同じ語源"],"story":"safety regulations(安全規則)が頻出。多くの場合複数形で使われる。","use":"Please follow all safety regulations.|すべての安全規則に従ってください。"},{"q":"comply","a":"従う","hook":["注意","comply with の形で使う"],"story":"規則や基準に従う意味。名詞compliance(法令順守)も頻出。","use":"All staff must comply with the rules.|全職員は規則に従わなければならない。"},{"q":"mandatory","a":"義務的な","hook":["連想","mandate(命令)の形容詞形"],"story":"mandatory meeting(全員参加の会議)が頻出。compulsoryとほぼ同じ意味。","use":"Attendance at the training is mandatory.|研修への出席は必須です。"},{"q":"eligible","a":"対象となる","hook":["注意","be eligible for / to do の形"],"story":"割引や特典を受ける資格がある意味。Part 7の会員特典の案内で頻出。","use":"Members are eligible for a free upgrade.|会員は無料アップグレードの対象です。"},{"q":"deduct","a":"差し引く","hook":["語源","de(離れて)+duct(導く)"],"story":"給料や料金から金額を引く意味。deduct A from B の形で使う。","use":"The fee will be deducted from your pay.|料金は給与から差し引かれます。"},{"q":"voucher","a":"引換券","hook":["連想","vouch(保証する)から来た語"],"story":"gift voucher(商品券)、meal voucher(食事券)などPart 7の広告で頻出。","use":"Use this voucher for a free coffee.|この引換券でコーヒーが1杯無料です。"},{"q":"affordable","a":"手頃な","hook":["連想","afford(買う余裕がある)+able"],"story":"affordable prices(手頃な価格)は広告文の定番。reasonableと言い換えられる。","use":"We offer high quality at affordable prices.|手頃な価格で高品質を提供します。"},{"q":"durable","a":"耐久性のある","hook":["語源","ラテン語durare(持ちこたえる)から"],"story":"製品の広告やレビューで頻出。durability(耐久性)もセットで覚えよう。","use":"These bags are light and durable.|これらのかばんは軽くて丈夫だ。"},{"q":"spacious","a":"広々とした","hook":["連想","space(空間)の形容詞形"],"story":"不動産や部屋の広告で頻出。spacious office(広いオフィス)などの形。","use":"The new office is bright and spacious.|新しいオフィスは明るく広々としている。"},{"q":"convenient","a":"便利な","hook":["連想","コンビニ=便利な店"],"story":"Is Monday convenient for you?(月曜は都合がいいですか)のように予定調整でも頻出。","use":"Is three o'clock convenient for you?|3時はご都合よろしいですか。"},{"q":"temporary","a":"一時的な","hook":["語源","ラテン語tempus(時間)から"],"story":"temporary staff(臨時職員)が頻出。反対語はpermanent(永続的な)。","use":"We hired temporary staff for the holidays.|休暇シーズンに向けて臨時職員を雇った。"},{"q":"previous","a":"以前の","hook":["語源","pre(前に)+via(道)=前を行く"],"story":"previous experience(以前の経験)は求人広告の定番。priorと言い換え可。","use":"Previous experience in sales is preferred.|営業の経験がある方を優遇します。"},{"q":"upcoming","a":"今度の","hook":["分解","up+coming=近づいて来る"],"story":"upcoming event(今度のイベント)のように近い将来の予定に使う。","use":"Let's discuss the upcoming sales meeting.|今度の営業会議について話し合おう。"},{"q":"annual","a":"年に一度の","hook":["語源","ラテン語annus(年)から"],"story":"annual report(年次報告書)、annual meeting(年次総会)が頻出。","use":"The annual report will be released soon.|年次報告書はまもなく公開される。"},{"q":"ongoing","a":"進行中の","hook":["分解","on+going=続いている"],"story":"ongoing project(進行中のプロジェクト)のように現在も続く状態を表す。","use":"The negotiations are still ongoing.|交渉はまだ続いている。"},{"q":"outstanding","a":"未払いの","hook":["注意","「傑出した」の意味もある"],"story":"outstanding balance(未払い残高)は請求関連で頻出。文脈で意味を判断しよう。","use":"Please pay the outstanding balance today.|未払いの残高を本日お支払いください。"},{"q":"prompt","a":"迅速な","hook":["注意","動詞では「促す」の意味もある"],"story":"Thank you for your prompt reply.(早速のご返信感謝します)はメールの定番。","use":"Thank you for your prompt response.|迅速なご対応ありがとうございます。"},{"q":"property","a":"不動産","hook":["連想","proper(固有の)=自分のもの"],"story":"「財産・所有物」の意味もある。Part 7の不動産広告でよく出る。","use":"The company bought a property downtown.|その会社は中心街の不動産を購入した。"},{"q":"tenant","a":"入居者","hook":["語源","ラテン語tenere(保持する)から"],"story":"ビルやアパートの借り手。対になるのはlandlord(家主)。","use":"All tenants must park in the back lot.|入居者は全員裏の駐車場を利用すること。"},{"q":"vacancy","a":"空室・欠員","hook":["連想","vacant(空いている)の名詞形"],"story":"ホテルの空室にも職の欠員にも使う。No Vacancy は「満室」の表示。","use":"We have a vacancy in the sales team.|営業チームに欠員があります。"},{"q":"accommodate","a":"収容する","hook":["連想","accommodation(宿泊施設)と同じ仲間"],"story":"The hall can accommodate 200 people. のように人数の収容で頻出。","use":"The room can accommodate fifty people.|その部屋は50人を収容できる。"},{"q":"premises","a":"敷地","hook":["注意","この意味では常に複数形"],"story":"on the premises(敷地内で)が頻出。No smoking on the premises. は定番の掲示。","use":"Smoking is not allowed on the premises.|敷地内は禁煙です。"},{"q":"manufacture","a":"製造する","hook":["語源","manu(手)+facture(作ること)"],"story":"manufacturer(製造業者、メーカー)もPart 7で頻出。工場関連の話題でよく出る。","use":"We manufacture parts for cars.|当社は自動車部品を製造している。"},{"q":"distribute","a":"配布する","hook":["連想","distributor(販売代理店)と同じ仲間"],"story":"資料の配布や商品の流通に使う。distribute handouts(資料を配る)が頻出。","use":"Please distribute these handouts to everyone.|この資料を全員に配ってください。"},{"q":"warehouse","a":"倉庫","hook":["分解","ware(商品)+house(建物)"],"story":"物流や在庫の話題で頻出。Part 1の写真で倉庫内の様子が出ることも。","use":"The boxes are stored in the warehouse.|箱は倉庫に保管されている。"},{"q":"exhibition","a":"展示会","hook":["連想","exhibit(展示する)の名詞形"],"story":"美術展や見本市を指す。trade fairと並んでPart 4・7の案内で頻出。","use":"The exhibition opens next Monday.|展示会は来週月曜に始まる。"},{"q":"extension","a":"内線","hook":["連想","extend(延ばす)=延ばした電話線"],"story":"電話番号の後のext. 23 などは内線番号。「延長」の意味もある。","use":"Please call me at extension 205.|内線205番にお電話ください。"},{"q":"fiscal","a":"会計の","hook":["語源","ラテン語fiscus(国庫)から"],"story":"fiscal year(会計年度)の形でPart 7の業績報告に頻出。","use":"Profits rose in the last fiscal year.|前会計年度に利益が増えた。"},{"q":"renowned","a":"有名な","hook":["語源","re+nown(名)=名が広まった"],"story":"world-renowned(世界的に有名な)の形で講演者紹介などに頻出。","use":"She is a renowned expert in design.|彼女はデザインの著名な専門家だ。"}],"kobun":[{"q":"あさまし","a":"驚きあきれる","hook":["連想","「あっ、さま(様)が…!」と思わず驚きあきれる"],"story":"良くも悪くも意外さに驚く語。現代の「浅ましい(卑しい)」とは違う古今異義語として頻出。","use":"あさましきことなり|驚きあきれることだ"},{"q":"ことわり","a":"道理","hook":["漢字","理(ことわり)。筋道・もっともなこと"],"story":"「ことわりなり」で「もっともだ・当然だ」。現代の「断り(拒否)」と混同しないこと。","use":"泣くもことわりなり|泣くのももっともだ"},{"q":"かなし","a":"いとしい","hook":["漢字","愛し(かなし)。胸がしめつけられるほどかわいい"],"story":"「悲し」の意味もあるが、入試では「愛し=いとしい」の方が狙われる。親子・恋人の場面に注意。","use":"妻子をかなしと思ふ|妻子をいとしいと思う"},{"q":"いとほし","a":"気の毒だ","hook":["注意","現代の「愛おしい」ではなく、まず「気の毒だ」"],"story":"「いとほし」は見ていて心が痛む感じ。「かわいい」の意味もあるが、入試頻出は「気の毒だ」。","use":"いとほしげなる様|気の毒な様子"},{"q":"うし","a":"つらい","hook":["漢字","憂し(うし)。憂鬱でつらい気持ち"],"story":"山上憶良の歌「世間を憂しとやさしと思へども」で有名。「〜うし」は「〜するのがいやだ」とも訳す。","use":"世の中をうしと思ふ|世の中をつらいと思う"},{"q":"すさまじ","a":"興ざめだ","hook":["注意","現代の「すごい・激しい」ではなく、しらける感じ"],"story":"枕草子「すさまじきもの、昼ほゆる犬」が有名。場違いでしらける気持ちを表す古今異義語。","use":"すさまじきもの|興ざめなもの"},{"q":"こころもとなし","a":"待ち遠しい","hook":["連想","心がもとに落ち着かず、そわそわ待つ"],"story":"「待ち遠しい」のほか「不安だ・気がかりだ」の意味も。どちらも心が落ち着かない状態。","use":"文の来るをこころもとなく思ふ|手紙が来るのを待ち遠しく思う"},{"q":"うしろめたし","a":"不安だ","hook":["対比","うしろめたし(不安)⇔うしろやすし(安心)"],"story":"現代の「後ろめたい(やましい)」とは違い、先行きが心配だという意味。古今異義語の定番。","use":"幼き人をうしろめたく思ふ|幼い子を不安に思う"},{"q":"かたはらいたし","a":"そばで見て苦々しい","hook":["漢字","傍ら痛し。そばにいて心が痛む"],"story":"他人の様子を見て「苦々しい」、自分が見られて「恥ずかしい」の両面がある。主語の確認が入試の鍵。","use":"かたはらいたきこと|そばで見ていて苦々しいこと"},{"q":"はしたなし","a":"きまりが悪い","hook":["漢字","端なし。中途半端で居場所がない感じ"],"story":"「中途半端だ」「きまりが悪い」「そっけない」などの意味。現代の「はしたない(下品)」とは別物。","use":"はしたなき心地す|きまりが悪い気持ちがする"},{"q":"ながむ","a":"物思いにふける","hook":["漢字","眺む。ぼんやり遠くを見て物思い"],"story":"小野小町「わが身世にふるながめせしまに」は「眺め」と「長雨」の掛詞。和歌で超頻出。","use":"月をながむ|月を見ながら物思いにふける"},{"q":"まもる","a":"じっと見つめる","hook":["語源","ま(目)+もる(守る)。目を離さず見守る"],"story":"現代の「守る(防ぐ)」ではなく「見つめる」。「目をはなさない」から生じた意味と覚えよう。","use":"人の顔をまもる|人の顔をじっと見つめる"},{"q":"さらなり","a":"言うまでもない","hook":["連想","「さら(更)に言うまでもない」と覚える"],"story":"枕草子「夏は夜。月のころはさらなり」が有名。「言へばさらなり」「言ふもさらなり」の形でも出る。","use":"月のころはさらなり|月の出ている頃は言うまでもない"},{"q":"いかで","a":"どうにかして","hook":["注意","下に願望・意志があれば「どうにかして」"],"story":"竹取物語「いかでこのかぐや姫を得てしがな」が有名。疑問・反語の「どうして」との識別が問われる。","use":"いかで見てしがな|どうにかして見たいものだ"},{"q":"つゆ","a":"少しも〜ない","hook":["連想","露のように少しも…下に打消が来る"],"story":"「つゆ〜打消」で全否定。「さらに」「おほかた」なども同じ呼応をするので一緒に覚えると得点源。","use":"つゆまどろまれず|少しも眠ることができない"},{"q":"ゆめ","a":"決して〜するな","hook":["注意","下に禁止・打消が来る呼応の副詞"],"story":"「ゆめ〜な」「ゆめゆめ〜な」で強い禁止。現代語の「夢」とは無関係の副詞として出題される。","use":"ゆめこの雪落とすな|決してこの雪を落とすな"},{"q":"え〜ず","a":"〜できない","hook":["注意","「え」は打消と呼応して不可能を表す"],"story":"副詞「え」+打消で不可能。入試の現代語訳問題で頻出。「え」だけを見落とすと意味が逆になる。","use":"え言はず|言うことができない"},{"q":"やうやう","a":"だんだん","hook":["漢字","漸う(ようよう)。しだいに"],"story":"枕草子「春はあけぼの。やうやう白くなりゆく山ぎは」が有名。読みは「ようよう」。","use":"やうやう白くなりゆく|だんだん白くなっていく"},{"q":"としごろ","a":"長年","hook":["注意","年頃=年齢ではなく「長年・数年来」"],"story":"現代の「年頃(適齢期)」とは違う古今異義語。「ひごろ(数日)」「月ごろ(数か月)」とセットで覚える。","use":"としごろ思ひつること|長年思っていたこと"},{"q":"つとめて","a":"早朝","hook":["注意","「努めて」ではなく朝のこと。翌朝の意味も"],"story":"枕草子「冬はつとめて」が有名。前日の出来事の後なら「翌朝」と訳す。","use":"冬はつとめて|冬は早朝がよい"},{"q":"ありく","a":"歩き回る","hook":["漢字","歩く(ありく)。あちこち移動する"],"story":"動詞に付いて「〜してまわる」とも訳す。徒歩に限らず、車や舟での移動にも使う。","use":"夜な夜なありく|毎晩出歩き回る"},{"q":"おとなし","a":"大人びている","hook":["漢字","大人し。年長で分別がある"],"story":"現代の「おとなしい(静か)」ではない古今異義語。子どもに使えば「大人びている」と訳す。","use":"おとなしき人|分別のある年長の人"},{"q":"かしこし","a":"恐れ多い","hook":["漢字","畏し。神や帝への畏れ"],"story":"「賢し(賢い)」の意味もあるが、入試頻出は「恐れ多い」。連用形「かしこく」は「たいそう」とも訳す。","use":"かしこき仰せ言|恐れ多いご命令"},{"q":"やむごとなし","a":"高貴だ","hook":["語源","止む事無し。放っておけない→重々しい"],"story":"源氏物語冒頭「いとやむごとなき際にはあらぬが」が有名。「捨てておけない」「格別だ」の意味も。","use":"やむごとなき人|高貴な人"},{"q":"めざまし","a":"心外だ","hook":["語源","目が覚めるほど意外→気にくわない"],"story":"源氏物語桐壺巻で、他の女御たちが桐壺更衣を「めざましきもの」と見下す場面が有名。","use":"めざましきものにおとしむ|心外な者として見下す"},{"q":"あたらし","a":"もったいない","hook":["漢字","惜し(あたらし)。新しいではない"],"story":"現代の「新しい」とは別語。「あたら若い命を」の「あたら」に名残がある。","use":"あたら夜の月|もったいないほどの夜の月"},{"q":"なまめかし","a":"優美だ","hook":["注意","現代の「色っぽい」ではなく若々しく上品"],"story":"古文では、みずみずしく上品な美しさを言う。現代の性的な意味で訳すと誤答になる古今異義語。","use":"なまめかしき姿|優美な姿"},{"q":"ねんごろなり","a":"親切だ","hook":["漢字","懇ろ(ねんごろ)。心をこめて丁寧"],"story":"「丁寧だ・熱心だ」とも訳す。男女の親密な関係を言うこともある。現代でも「懇ろに弔う」と使う。","use":"ねんごろに語らふ|親切に話し合う"},{"q":"つきづきし","a":"ふさわしい","hook":["対比","つきづきし(似合う)⇔にげなし(似合わない)"],"story":"枕草子「冬はつとめて」の段で、炭を運ぶ様子を「いとつきづきし」と評する。","use":"いとつきづきし|たいそうふさわしい"},{"q":"にげなし","a":"似合わない","hook":["漢字","似げ無し。似つかわしさが無い"],"story":"年齢や身分に不釣り合いな場面で使う。「つきづきし(ふさわしい)」との対比で出る。","use":"にげなき振る舞ひ|不釣り合いな振る舞い"},{"q":"ところせし","a":"窮屈だ","hook":["漢字","所狭し。場所が狭くて窮屈"],"story":"「大げさだ・堂々としている」の意味も。現代の「所狭しと並ぶ」に名残がある。","use":"ところせき身|窮屈な身の上"},{"q":"あぢきなし","a":"どうにもならない","hook":["注意","「味気ない」と似るが、まず「どうしようもない」"],"story":"努力してもどうにもならない無力感。「つまらない」の意味もあり、文脈で判断する。","use":"あぢきなき世|どうにもならない世の中"},{"q":"うたて","a":"いやに","hook":["連想","「うたた(ますます)」の仲間。事態が進んでいやな感じ"],"story":"「ますます」「いやに・異様に」の意味。「うたてあり」で「いやだ」。不快感を伴う点が大事。","use":"うたて降る雨|いやに降る雨"},{"q":"さすがに","a":"そうはいっても","hook":["注意","現代の「さすが(感心)」ではなく逆接"],"story":"「そうはいってもやはり」と前の内容を受けて逆接的に続ける。感心の意味で訳すと誤答。","use":"さすがに捨てがたし|そうはいっても捨てにくい"},{"q":"いつしか","a":"早く","hook":["注意","下に願望があれば「早く〜したい」"],"story":"現代の「いつの間にか」ではない古今異義語。「いつしか〜てしがな」の形で狙われる。","use":"いつしか見む|早く見たい"},{"q":"あながちなり","a":"強引だ","hook":["漢字","強ち(あながち)。無理に押し通す"],"story":"「一途だ・ひたむきだ」の意味も。現代の「あながち〜ない(必ずしも)」とは使い方が違う。","use":"あながちに頼む|強引に頼む"},{"q":"よろし","a":"悪くない","hook":["対比","よし>よろし>わろし>あし の順"],"story":"「よし」より一段下の評価で「まあまあよい」。現代の「よろしい」より評価が低い点に注意。","use":"よろしき歌|悪くない歌"},{"q":"わろし","a":"よくない","hook":["対比","よろし(悪くない)と、あし(悪い)の間"],"story":"「あし」ほど強くない否定的評価。枕草子「火桶の火も白き灰がちになりてわろし」が有名。","use":"白き灰がちになりてわろし|白い灰ばかりになってよくない"},{"q":"ゆゆし","a":"不吉だ","hook":["漢字","忌々し(ゆゆし)。触れてはならない"],"story":"神聖で恐れ多い→不吉だ、さらに「程度がはなはだしい」へ。現代の「由々しき事態」に名残。","use":"ゆゆしき夢|不吉な夢"},{"q":"しるし","a":"はっきりしている","hook":["漢字","著し(しるし)。顕著の「著」"],"story":"形容詞「著し」は「はっきりわかる」。名詞「験(しるし)=効果・ご利益」と区別して出題される。","use":"しるき足音|はっきりした足音"},{"q":"すずろなり","a":"なんとなく","hook":["漢字","漫ろ(そぞろ)。目的なく心がさまよう"],"story":"「そぞろなり」とも。「わけもなく」「思いがけない」の意味も。「気もそぞろ」に名残がある。","use":"すずろに涙落つ|わけもなく涙が落ちる"},{"q":"ちぎる","a":"約束する","hook":["漢字","契る(ちぎる)。契約の「契」"],"story":"男女が将来を誓う場面で多用。名詞「ちぎり」は「約束」のほか「前世からの因縁」も表す。","use":"後の世までちぎる|来世まで約束する"},{"q":"かしづく","a":"大切に育てる","hook":["連想","かしこまって仕え、大事に世話する"],"story":"親が娘を大切に養育する場面で頻出。「大切に世話をする」とも訳す。","use":"娘をかしづく|娘を大切に育てる"},{"q":"うつろふ","a":"色あせる・移る","hook":["漢字","移ろふ。花の色や人の心が変わる"],"story":"小野小町「色見えでうつろふものは世の中の人の心の花にぞありける」。心変わりの意味でも頻出。","use":"花の色うつろふ|花の色があせる"},{"q":"ときめく","a":"時流に乗り栄える","hook":["漢字","時めく。時を得て栄える"],"story":"源氏物語「すぐれて時めきたまふありけり」が有名。現代の「胸がときめく」とは違う古今異義語。","use":"いみじう時めく|たいそう寵愛を受けて栄える"},{"q":"まうづ","a":"参詣する","hook":["漢字","詣づ(もうず)。初詣の「詣」"],"story":"「行く」の謙譲語で、寺社や貴人のもとへ行く。読みは「もうず」。","use":"清水にまうづ|清水寺に参詣する"},{"q":"まかる","a":"退出する","hook":["対比","まゐる(参上)⇔まかる(退出)"],"story":"貴人のもとから退く謙譲語。「行く」の丁寧語としても使う。現代の「まかり通る」に名残。","use":"内裏よりまかる|宮中から退出する"},{"q":"おこたる","a":"病気がよくなる","hook":["注意","「怠る(なまける)」ではなく病が快方へ"],"story":"病気の勢いが怠る=治る、と考える。病気の場面で「なまける」と訳すと誤答になる頻出語。","use":"御心地おこたる|ご病気がよくなる"},{"q":"なやむ","a":"病気で苦しむ","hook":["注意","古文の「悩む」はまず病気"],"story":"名詞「なやみ」も「病気」。「ここち」「わづらふ」など病気関連語とまとめて覚えると強い。","use":"日ごろなやみたまふ|数日間ご病気で苦しまれる"},{"q":"いたづらなり","a":"無駄だ","hook":["漢字","徒らなり。徒労の「徒」"],"story":"「むなしい・暇だ」の意味も。「いたづらになる」で「死ぬ」を表す婉曲表現として頻出。","use":"いたづらに日を過ぐす|無駄に日を過ごす"},{"q":"はかなし","a":"頼りない","hook":["語源","はか(仕事の進み具合)が無い。はかどらない"],"story":"「はかどる」の「はか」と同じ。「ちょっとした」「むなしい」とも訳す。人の死にも使われる。","use":"はかなき夢|頼りない夢"},{"q":"ほい","a":"本来の望み","hook":["漢字","本意(ほい)。もともとの意志"],"story":"「本意なし」で「残念だ」。出家の願いを指すことが多い。現代の「本意」と近い意味。","use":"ほいを遂ぐ|かねての望みを果たす"},{"q":"すくせ","a":"前世からの因縁","hook":["漢字","宿世(すくせ)。宿命の「宿」"],"story":"仏教の因果応報の考えに基づく語。源氏物語などで男女の縁や運命を嘆く場面に頻出。","use":"さるべきすくせ|そうなるはずの前世からの因縁"},{"q":"ほだし","a":"束縛","hook":["漢字","絆し(ほだし)。足かせ"],"story":"出家しようとする人を引き止める妻子や親などを指すことが多い。「情にほだされる」に名残。","use":"妻子こそほだしなれ|妻子こそが束縛である"},{"q":"あらまし","a":"計画・予定","hook":["注意","現代の「概略」ではなく、こうありたい予定"],"story":"動詞「あり」+推量「まし」由来とされる名詞。徒然草で人生の予定のむなしさを語る文脈に出る。","use":"年ごろのあらまし|長年の計画"},{"q":"ついで","a":"順序・機会","hook":["漢字","序(ついで)。順序の「序」"],"story":"徒然草「死期はついでを待たず」(死は順序を待たない)が有名。現代の「ついでに」とは違う。","use":"ついでを待つ|順序(機会)を待つ"},{"q":"あまた","a":"たくさん","hook":["漢字","数多(あまた)。数が多い"],"story":"源氏物語冒頭「女御更衣あまたさぶらひたまひける中に」が有名。現代でも「引く手あまた」と使う。","use":"人あまたあり|人がたくさんいる"},{"q":"あからさまなり","a":"ほんのしばらく","hook":["注意","現代の「露骨」ではなく、ちょっとの間"],"story":"「あからさまに」で「ほんのちょっと・一時的に」。現代語の意味で訳すと誤答になる古今異義語。","use":"あからさまに出づ|ほんのちょっと出かける"},{"q":"おほかた","a":"だいたい","hook":["注意","下に打消があれば「全く〜ない」"],"story":"「大方」で「一般に・だいたい」。打消と呼応すると全否定になる点が入試の狙い目。","use":"おほかたの世|一般の世の中"},{"q":"とみなり","a":"急だ","hook":["漢字","頓なり。頓死・頓服の「頓」"],"story":"「とみのこと」で「急用」。伊勢物語「とみのこととて御文あり」が有名。","use":"とみのこととて|急用ということで"},{"q":"ねたし","a":"しゃくだ","hook":["漢字","妬し(ねたし)。妬むの「妬」"],"story":"相手に負けて腹立たしい気持ち。「ねたし」の対象は人だけでなく、くやしい出来事にも使う。","use":"いとねたし|本当にしゃくだ"},{"q":"めやすし","a":"感じがよい","hook":["語源","目+安し。見ていて安心=見苦しくない"],"story":"「見苦しくない」とも訳す。見た目や態度が無難で好ましいという評価。","use":"めやすき人|感じのよい人"},{"q":"かたち","a":"顔立ち","hook":["注意","形ではなく、人の「容貌」"],"story":"古文で人について「かたち」と言えば容貌のこと。「かたちよし」で「美しい顔立ちだ」。","use":"かたちをかしげなり|顔立ちがかわいらしい"},{"q":"なさけ","a":"思いやり","hook":["漢字","情け(なさけ)。人を思う心"],"story":"「風流心」「恋心」の意味もある。「なさけあり」は「思いやりがある・風流を解する」。","use":"なさけある人|思いやりのある人"},{"q":"こころばへ","a":"気だて","hook":["漢字","心延へ。心が外へのびる様子=性格"],"story":"人の性格・気立てを言う。物については「趣・風情」とも訳す。「心ばせ」と似た意味。","use":"こころばへよき人|気だてのよい人"},{"q":"おぼゆ","a":"自然に思われる","hook":["語源","思ふ+自発の「ゆ」=自然と思われる"],"story":"「似る」「思い出される」の意味も。「おぼえ」は「評判・寵愛」。現代の「覚える」とは違う。","use":"あはれにおぼゆ|しみじみと思われる"},{"q":"しのぶ","a":"こらえる","hook":["漢字","忍ぶ(こらえる)/偲ぶ(慕う)"],"story":"「忍ぶ」は「我慢する・人目を避ける」、「偲ぶ」は「思い慕う」。漢字で区別して覚えよう。","use":"涙をしのぶ|涙をこらえる"},{"q":"うるはし","a":"端正で美しい","hook":["漢字","麗し。きちんと整った美しさ"],"story":"整って立派な美しさ。「きちんとしている」「仲がよい」の意味も。かわいさを表す語とは違う。","use":"うるはしき姿|端正で美しい姿"},{"q":"のたまふ","a":"おっしゃる","hook":["注意","「言ふ」の尊敬語。主語は身分の高い人"],"story":"敬語は主語判定の手がかり。「のたまふ」があれば主語は高貴な人物と考えるのが入試の定石。","use":"かくのたまふ|このようにおっしゃる"},{"q":"おはす","a":"いらっしゃる","hook":["注意","「あり・行く・来」の尊敬語"],"story":"「おはします」はさらに敬意が高い。存在にも移動にも使うので文脈で訳し分ける。","use":"内裏におはす|宮中にいらっしゃる"},{"q":"きこゆ","a":"申し上げる","hook":["注意","「言ふ」の謙譲語。聞こえるの意味も"],"story":"補助動詞なら「〜申し上げる」。本来の「聞こえる・評判になる」との識別が問われる。","use":"御返事きこゆ|ご返事を申し上げる"},{"q":"たまはる","a":"いただく","hook":["対比","たまふ(お与えになる)⇔たまはる(いただく)"],"story":"「受く」の謙譲語。「たまふ」と字面が似ているので、与える側か受ける側かで判断する。","use":"禄をたまはる|褒美をいただく"},{"q":"おほとのごもる","a":"おやすみになる","hook":["漢字","大殿籠る。御殿にこもる=寝る"],"story":"「寝・寝ぬ」の尊敬語。帝や貴人が寝る場面で使い、主語判定のヒントになる。","use":"夜更けておほとのごもる|夜が更けてからおやすみになる"},{"q":"ふみ","a":"手紙・漢籍","hook":["漢字","文(ふみ)。手紙や漢詩文・学問"],"story":"文脈により「手紙」「漢詩」「書物・学問」と訳す。恋の場面ではほぼ「手紙」。","use":"ふみをやる|手紙を送る"},{"q":"ふるさと","a":"旧都・なじみの地","hook":["注意","生まれ故郷だけでなく、昔の都や家"],"story":"「古里」は昔なじみの土地や荒れた旧都。奈良の旧都を詠んだ和歌などで頻出。","use":"ふるさととなりにし奈良の都|旧都となった奈良の都"},{"q":"うち","a":"宮中","hook":["漢字","内(うち)。内裏=宮中、転じて帝"],"story":"「内裏(だいり)」のこと。「うちの上」は帝を指す。自宅の意味と取り違えないこと。","use":"うちにまゐる|宮中に参上する"},{"q":"けしき","a":"様子","hook":["漢字","気色(けしき)。景色ではない"],"story":"人の「様子・機嫌・意向」を表す。「けしきばむ」は「様子に表れる」。現代の「景色」と区別する。","use":"けしきあしし|機嫌が悪い"},{"q":"こころにくし","a":"奥ゆかしい","hook":["注意","憎いではなく、心ひかれるほど上品"],"story":"現代の「心憎い(憎らしいほど見事)」とも違う。古文では心がひきつけられる奥ゆかしさ。","use":"こころにくき住まひ|奥ゆかしい住まい"},{"q":"いはけなし","a":"幼い","hook":["対比","いはけなし(幼い)⇔おとなし(大人びる)"],"story":"子どもの未熟さ・あどけなさを表す。源氏物語の若紫など幼い人物の描写に出る。","use":"いはけなき御有様|幼いご様子"},{"q":"をこなり","a":"愚かだ","hook":["連想","現代の「おこがましい」の「おこ」"],"story":"「おこがましい」は「をこ」から生まれた語。古文では「ばかげている」とも訳す。","use":"をこなる振る舞ひ|愚かな振る舞い"},{"q":"かたくななり","a":"頑固で無教養だ","hook":["漢字","頑ななり。頑固の「頑」"],"story":"徒然草で、花の散ったことを嘆く無風流な人を「かたくななる人」と評する。教養のなさを含む。","use":"かたくななる人|頑固で無教養な人"},{"q":"さかし","a":"賢い","hook":["漢字","賢し。「さかしら」は利口ぶること"],"story":"「しっかりしている」の意味も。悪い意味では「利口ぶっている」。「かしこし」と区別する。","use":"さかしき人|賢い人"},{"q":"まめなり","a":"まじめだ","hook":["対比","まめ(誠実)⇔あだ(浮気)"],"story":"伊勢物語の「まめ男」が有名。「実用的だ」の意味もあり、現代の「まめな人」に名残。","use":"まめなる男|まじめな男"},{"q":"あだなり","a":"浮気だ","hook":["漢字","徒なり。中身がなく不誠実"],"story":"「誠実でない」「はかない」の意味。「まめなり」との対比で出る。「あだ花」に名残がある。","use":"あだなる心|浮気な心"},{"q":"おろかなり","a":"おろそかだ","hook":["漢字","疎かなり。いい加減で不十分"],"story":"「言ふもおろかなり」は「言うまでもない」。「愚か」の意味より「いい加減」が入試頻出。","use":"おろかに思ふ|いい加減に思う"},{"q":"れいの","a":"いつものように","hook":["漢字","例の。いつも通りの"],"story":"「例の」は「いつもの」「いつものように」。現代の「例の件」より日常的な意味で使う。","use":"れいの集まりぬ|いつものように集まった"},{"q":"やをら","a":"そっと","hook":["連想","やわらかく、静かにそっと動く"],"story":"音を立てずにゆっくり動く様子。「やうやう(だんだん)」と形が似ているので混同注意。","use":"やをら起きいづ|そっと起き出す"},{"q":"げに","a":"なるほど","hook":["漢字","実に(げに)。本当に"],"story":"人の話や評判を「本当にその通りだ」と納得する気持ち。「本当に」とも訳す。","use":"げにさることなり|なるほどもっともなことだ"},{"q":"なつかし","a":"心ひかれる","hook":["語源","動詞「なつく」の形容詞。そばにいたい"],"story":"現代の「昔を思い出す」ではなく、親しみを感じて離れがたい気持ち。古今異義語の定番。","use":"なつかしき香|心ひかれる香り"},{"q":"つらし","a":"薄情だ","hook":["注意","自分がつらいのではなく、相手が冷たい"],"story":"相手の冷淡さを言う古今異義語。「つらき人」は「薄情な人」と訳す。","use":"つらき人|薄情な人"},{"q":"いそぐ","a":"準備する","hook":["注意","急ぐより「支度をする」が頻出"],"story":"行事や旅の準備をする意味。名詞「いそぎ」も「準備」。現代語感で「急ぐ」と訳すと減点。","use":"正月のこといそぐ|正月の準備をする"},{"q":"ためし","a":"先例","hook":["漢字","例し(ためし)。前例"],"story":"過去の事例・手本のこと。「ためしなし」で「前例がない」。「試し」とは別語。","use":"世のためし|世間の先例"},{"q":"ひがこと","a":"間違い","hook":["漢字","僻事。ひがみ・ひが目の「僻」"],"story":"道理に合わないこと。「ひが目(見間違い)」「ひが耳(聞き違い)」も同じ「ひが」。","use":"ひがことを言ふ|間違ったことを言う"},{"q":"おぼつかなし","a":"はっきりしない","hook":["連想","現代の「おぼつかない」=あやふや"],"story":"「気がかりだ」「待ち遠しい」の意味もある。ぼんやりして確かでない状態がもと。","use":"月おぼつかなし|月がはっきりしない"},{"q":"ことなり","a":"他と異なる","hook":["漢字","異なり。他と違ってすぐれる"],"story":"「異なり」は「違う・格別だ」。副詞「ことに」は「特に」。断定の「ことなり(事なり)」と区別。","use":"ことなる才|格別な才能"},{"q":"あいなし","a":"筋違いだ","hook":["注意","連用形「あいなく」は「むやみに」"],"story":"「不調和だ・つまらない」の意味も。連用形の副詞的用法「むやみに」が入試で狙われやすい。","use":"あいなきことなり|筋違いなことだ"},{"q":"ひごろ","a":"数日間","hook":["対比","ひごろ(数日)・月ごろ(数か月)・年ごろ(数年)"],"story":"「日頃」は「数日来」の意味が頻出。「ふだん」と訳すこともあるので文脈判断する。","use":"ひごろ籠もりゐたり|数日間こもっていた"},{"q":"うしろやすし","a":"安心だ","hook":["対比","うしろやすし(安心)⇔うしろめたし(不安)"],"story":"後のことを任せても大丈夫だという気持ち。「うしろめたし」との対で出題される。","use":"うしろやすく思ふ|安心だと思う"},{"q":"ねぶ","a":"年をとる","hook":["注意","「寝る」ではない。年を重ねて大人びる"],"story":"「大人びる」の意味もある。「ねびゆく」で「成長していく・年をとっていく」。","use":"ねびたる人|年をとった人"},{"q":"ここち","a":"気分","hook":["漢字","心地(ここち)。心の状態"],"story":"「病気」の意味もあり「御心地」は「ご病気」。「おこたる」「なやむ」と一緒に出やすい。","use":"ここちあしし|気分が悪い"}],"kanbun":[{"q":"不常〜(つねには〜ず)","a":"いつも〜とは限らない","hook":["否定","「常には」と「は」が入れば部分否定。いつもとは限らない"],"story":"韓愈「雑説」の「伯楽不常有」が定番。名伯楽はいつもいるとは限らない","use":"伯楽は常には有らず|伯楽はいつもいるとは限らない"},{"q":"常不〜(つねに〜ず)","a":"いつも〜しない","hook":["否定","否定語より上に「常」があれば全部否定"],"story":"不常〜と語順が逆なだけで意味が変わる。否定語の位置で判断するのが鉄則","use":"常に学ばず|いつも学ばない"},{"q":"不必〜(かならずしも〜ず)","a":"必ずしも〜とは限らない","hook":["否定","送り仮名「しも」が見えたら部分否定"],"story":"論語・憲問「仁者必有勇、勇者不必有仁」。勇者に仁があるとは限らない","use":"勇者は必ずしも仁有らず|勇気ある者に仁があるとは限らない"},{"q":"必不〜(かならず〜ず)","a":"決して〜しない","hook":["否定","「必」が否定語より上なら全部否定。絶対しない"],"story":"部分否定「必ずしも〜ず」との読み分けが共通テストの定番問題","use":"必ず往かず|決して行かない"},{"q":"為A所B(AのBするところとなる)","a":"AにBされる","hook":["受身","「為…所…」のセットを見たら受身"],"story":"史記・項羽本紀「先即制人、後則為人所制」。「先んずれば人を制す」の出典","use":"後るれば則ち人の制する所と為る|遅れれば人に支配される"},{"q":"不如〜(〜にしかず)","a":"〜に及ばない","hook":["比較","「しかず」は「及ばない」。百聞は一見にしかず"],"story":"漢書・趙充国伝「百聞不如一見」。ことわざの出典","use":"百聞は一見に如かず|百回聞くより一度見る方がよい"},{"q":"莫如〜(〜にしくはなし)","a":"〜にまさるものはない","hook":["比較","及ぶものが無い=いちばん。最上級の比較形"],"story":"「無如〜」「莫若〜」も同じ。管子「一年之計、莫如樹穀」が有名","use":"一年の計は穀を樹うるに如くは莫し|一年の計画なら穀物を植えるのが最上だ"},{"q":"無不〜(〜ざるはなし)","a":"〜しないものはない","hook":["否定","無と不で否定×否定。結局は全部する"],"story":"「莫不〜」も同じ形。莫も「なし」と読む否定語なので要注意","use":"喜ばざる者無し|喜ばない者はいない"},{"q":"未嘗不〜(いまだかつて〜ずんばあらず)","a":"〜しなかったことはない","hook":["否定","「ずんばあらず」は二重否定。毎回していた"],"story":"読み「ずんばあらず」が書き下し問題で頻出。意味は強い肯定になる","use":"未だ嘗て泣かずんばあらず|泣かなかったことはない"},{"q":"非不〜(〜ざるにあらず)","a":"〜しないのではない","hook":["否定","非+不の二重否定。「〜ないのではない」"],"story":"孟子・公孫丑下「城非不高也、池非不深也」。地の利より人の和を説く","use":"城高からざるに非ず|城が高くないのではない"},{"q":"不敢〜(あへて〜ず)","a":"進んで〜しようとしない","hook":["否定","不が先なら「進んでしようとしない」"],"story":"「敢不〜乎」と語順で意味が逆転する。共通テスト頻出のペア","use":"敢へて言はず|進んで言おうとしない"},{"q":"敢不〜乎(あへて〜ざらんや)","a":"どうして〜しないことがあろうか","hook":["反語","敢が先なら反語。必ずする"],"story":"不敢〜(進んでしない)と真逆の意味。返り点と送り仮名で見分ける","use":"敢へて従はざらんや|どうして従わないことがあろうか"},{"q":"況〜乎(いはんや〜をや)","a":"まして〜はなおさらだ","hook":["抑揚","前で軽いもの、後で重いもの。「をや」で締める"],"story":"戦国策「死馬且買之、況生馬乎」。郭隗の「先従隗始」の話","use":"況んや生ける馬をや|まして生きている馬ならなおさらだ"},{"q":"且(〜すらかつ)","a":"〜でさえ","hook":["抑揚","「AすらかつB」で抑揚の前半。猶・尚(なほ)も同じ働き"],"story":"後半に「況〜乎」が続くのが定番の抑揚形。セットで覚える","use":"死馬すら且つ之を買ふ|死んだ馬でさえ買う"},{"q":"盍〜(なんぞ〜ざる)","a":"どうして〜しないのか","hook":["句法","盍は「何不」二字を一字にした再読文字"],"story":"論語・公冶長「盍各言爾志」。勧誘の意で「〜したらどうか」とも訳す","use":"盍ぞ各爾の志を言はざる|どうしてそれぞれ志を言わないのか"},{"q":"応(まさに〜べし)","a":"きっと〜だろう","hook":["句法","推量の再読文字。「応」はきっと〜のはず"],"story":"王維「雑詩」の「応知故郷事」。当(当然)と混同させる問題が多い","use":"応に故郷の事を知るべし|きっと故郷のことを知っているだろう"},{"q":"如何(いかん)","a":"どうしたらよいか","hook":["句法","如何・奈何は方法・処置を問う"],"story":"項羽「垓下の歌」の「虞兮虞兮奈若何」(虞や虞や若を奈何せん)","use":"之を如何せん|これをどうしたらよいか"},{"q":"何如(いかん)","a":"どうであるか","hook":["句法","何が先の「何如」は状態・様子を問う"],"story":"同じ「いかん」でも如何は方法、何如は状態。字の順で区別するのが頻出","use":"天下の事は何如|天下の情勢はどうか"},{"q":"何以(なにをもつて)","a":"何によって〜か","hook":["句法","以=手段。「何を以て」は手段・方法を問う"],"story":"「なにをもつてか」と読み理由を問う場合もある。文脈で判断","use":"何を以て之を知る|何によってそれを知ったのか"},{"q":"何必〜(なんぞかならずしも)","a":"どうして〜する必要があろうか","hook":["反語","「何ぞ必ずしも〜ん」=その必要はない"],"story":"孟子・梁恵王上「王何必曰利、亦有仁義而已矣」。利より仁義","use":"王何ぞ必ずしも利を曰はん|王様、なぜ利益を言う必要があろうか"},{"q":"誰〜(たれか〜ん)","a":"誰が〜か、いや誰も〜ない","hook":["反語","文末が「ん」なら反語。誰もいない"],"story":"文末が「や・か」で終われば疑問の可能性もある。送り仮名を必ず確認","use":"誰か能く之を知らん|誰がこれを知り得ようか(誰も知らない)"},{"q":"何〜之有(なにの〜かこれあらん)","a":"何の〜もありはしない","hook":["反語","「之有」がつけば反語。何も無い"],"story":"論語・子罕「君子居之、何陋之有」。劉禹錫「陋室銘」の結びにも引用","use":"何の陋しきことか之れ有らん|何のむさくるしいことがあろうか"},{"q":"A於B(BよりもAなり)","a":"BよりもAだ","hook":["比較","形容詞の後ろの「於」は比較の「より」"],"story":"杜牧「山行」の「霜葉紅於二月花」。礼記「苛政猛於虎」も同形","use":"苛政は虎よりも猛なり|厳しい政治は虎よりも恐ろしい"},{"q":"寧A無B(むしろA…なかれ)","a":"たとえAでもBにはなるな","hook":["比較","寧…無…は選択。Aを選びBを捨てよ"],"story":"史記・蘇秦列伝「寧為鶏口、無為牛後」。四字熟語「鶏口牛後」の出典","use":"寧ろ鶏口と為るも牛後と為る無かれ|小さくても長になれ、大集団の尻にはつくな"},{"q":"与其A寧B(そのAよりはむしろB)","a":"AするよりBの方がよい","hook":["比較","与其…寧はセットで選択形。後ろを選ぶ"],"story":"論語・八佾「礼、与其奢也寧倹」。礼は贅沢より質素がよい","use":"其の奢らんよりは寧ろ倹せよ|贅沢をするより質素にせよ"},{"q":"A孰与B(AはBにいづれぞ)","a":"AとBではどちらが〜か","hook":["比較","孰与=どちらが。比べて問う疑問"],"story":"戦国策・斉策の鄒忌「我孰与城北徐公美」。妻妾の答えから諫言へ","use":"我は徐公に孰与ぞ|私と徐公とではどちらが美しいか"},{"q":"縦〜(たとひ〜とも)","a":"たとえ〜としても","hook":["仮定","縦=たとひ。「とも」で逆接仮定"],"story":"史記・項羽本紀「縦江東父兄憐而王我、我何面目見之」。烏江での言葉","use":"縦ひ江東の父兄憐れみて我を王とすとも|たとえ江東の人々が私を王にしてくれても"},{"q":"苟〜(いやしくも〜ば)","a":"かりにも〜ならば","hook":["仮定","苟=いやしくも。かりそめにも〜なら"],"story":"論語・里仁「苟志於仁矣、無悪也」。仁を志せば悪はない","use":"苟も仁に志せば、悪無きなり|かりにも仁を志すなら悪いことはしない"},{"q":"雖〜(〜といへども)","a":"〜ではあるけれども","hook":["仮定","雖=といへども。逆接の確定と仮定の両方"],"story":"孟子「雖千万人吾往矣」は仮定。文脈で確定か仮定かを判断する","use":"小なりと雖も|小さいけれども"},{"q":"微〜(〜なかりせば)","a":"もし〜がなかったら","hook":["仮定","微=なかりせば。小さいの意ではない"],"story":"論語・憲問「微管仲、吾其被髪左衽矣」。管仲の功績を称えた","use":"管仲微かりせば|管仲がいなかったら"},{"q":"非A不B(AにあらずんばBず)","a":"AでなければBしない","hook":["仮定","「ずんば」は仮定。条件付きの二重否定"],"story":"孟子が伯夷を評した「非其君不事」。不入虎穴不得虎子も同じ仕組み","use":"其の君に非ずんば事へず|認めた君主でなければ仕えない"},{"q":"不復〜(また〜ず)","a":"二度と〜しない","hook":["否定","不が先なら「二度と」。全否定的"],"story":"韓非子「守株」の「兎不可復得」。切り株の兎は二度と得られない","use":"兎復た得べからず|兎は二度と手に入らない"},{"q":"復不〜(また〜ず)","a":"今度もまた〜しない","hook":["否定","復が先なら「今度もまた」"],"story":"不復〜と読みは同じ「また〜ず」。語順だけで意味が変わる頻出ペア","use":"復た来たらず|今度もまた来ない"},{"q":"不甚〜(はなはだしくは〜ず)","a":"それほど〜ではない","hook":["否定","「は」入りの部分否定。そこまでではない"],"story":"送り仮名「は」が入れば部分否定。「甚だしくは」と読めるかが鍵","use":"甚だしくは寒からず|それほど寒くない"},{"q":"甚不〜(はなはだ〜ず)","a":"ひどく〜でない","hook":["否定","甚が否定語より上なら全部否定。とても〜ない"],"story":"部分否定は「はなはだしくは」、全部否定は「はなはだ」と読み分ける","use":"甚だ楽しまず|ひどく不愉快だ"},{"q":"未嘗〜(いまだかつて〜ず)","a":"〜したことがない","hook":["否定","嘗=経験。未嘗で経験の否定"],"story":"項羽「身七十余戦…未嘗敗北」(史記)。不を足せば二重否定になる","use":"未だ嘗て敗北せず|一度も負けたことがない"},{"q":"請〜(こふ〜ん)","a":"どうか〜させてください","hook":["句法","文末「ん」は自分の願望。させてほしい"],"story":"史記・鴻門之会で項荘が「請以剣舞」と申し出て沛公を狙う場面","use":"請ふ剣を以て舞はん|剣舞をさせてください"},{"q":"願〜(ねがはくは〜せよ)","a":"どうか〜してください","hook":["句法","文末が命令形なら相手への願望"],"story":"「ねがはくは〜ん」なら自分の願望。文末の形で訳し分ける","use":"願はくは王急ぎ之を図れ|王様どうか早くこれを検討してください"},{"q":"嗚呼(ああ)","a":"ああ(嘆息の声)","hook":["詠嘆","嗚呼・嗟乎・噫・嗟はみな「ああ」"],"story":"感動詞の読み問題で頻出。漢字が違っても読みはすべて「ああ」","use":"嗚呼、哀しいかな|ああ、悲しいことだ"},{"q":"〜哉(かな)","a":"〜だなあ","hook":["詠嘆","文末の哉・夫・矣乎は詠嘆の「かな」"],"story":"論語・雍也「賢哉回也」。哉は反語・疑問の「や」とも読むので注意","use":"賢なるかな回や|顔回はなんと賢いことだなあ"},{"q":"不唯A(ただにAのみならず)","a":"AだけでなくBも","hook":["句法","限定に否定がつくと累加。それだけじゃない"],"story":"「不独」「非唯」「非徒」も同じ累加形。後半に「亦」が来やすい","use":"唯だに己のみならず、亦人を利す|自分だけでなく人にも利益を与える"},{"q":"以A為B(AをもつてBとなす)","a":"AをBとみなす","hook":["句法","以…為…はセット。AをBと考える・する"],"story":"十七条憲法「以和為貴」も同形。「以為」と縮めると「おもへらく」","use":"和を以て貴しと為す|調和を尊いものとみなす"},{"q":"以為(おもへらく)","a":"〜と思う","hook":["重要語","以て〜と為す→思うことには"],"story":"「以て〜と為す」とも読む。文中の位置で読みを判断させる問題が多い","use":"以為へらく、天下に敵無しと|天下に敵はいないと思った"},{"q":"不能〜(〜あたはず)","a":"〜できない","hook":["否定","能は「よく」で可能。打ち消すと「あたはず」"],"story":"「不能」は必ず返読して「〜あたはず」。「よくせず」とは読まない","use":"字を識る能はず|字を読むことができない"},{"q":"不足〜(〜にたらず)","a":"〜する価値がない","hook":["否定","足らず=値しない。取るに足りない"],"story":"鴻門之会で范増が項羽を嘆いた「豎子不足与謀」","use":"豎子与に謀るに足らず|小僧とは共に謀る価値もない"},{"q":"足以〜(もつて〜にたる)","a":"十分〜できる","hook":["句法","以て〜に足る=〜するのに十分"],"story":"否定の「不足以〜」なら「〜するには不十分だ」となる","use":"以て天下を治むるに足る|天下を治めるのに十分だ"},{"q":"不得已(やむをえず)","a":"しかたなく","hook":["重要語","現代語の「やむを得ず」そのまま"],"story":"論語・顔淵「必不得已而去」。子貢が政治の優先順位を問う場面","use":"已むを得ずして去る|しかたなく去る"},{"q":"欲〜(〜んとほっす)","a":"〜したいと思う","hook":["句法","欲=願望。無生物が主語なら「今にも〜しそう」"],"story":"韓詩外伝「樹欲静而風不止」。親孝行は親がいるうちに","use":"樹静かならんと欲すれども風止まず|木は静まりたいが風がやまない"},{"q":"安在(いづくにかある)","a":"どこにあるのか","hook":["句法","安=場所を問う「いづくにか」"],"story":"鴻門之会の項王「沛公安在」。安は反語「いづくんぞ」と読む場合も","use":"沛公安くにか在る|沛公はどこにいるのか"},{"q":"何者(なんとなれば)","a":"なぜかというと","hook":["句法","文頭の何者は理由説明の前ぶれ"],"story":"「なにもの」と読む誤りが典型的な引っかけ。直後に理由が来る","use":"何者、敵強ければなり|なぜなら敵が強いからだ"},{"q":"幾何(いくばく)","a":"どれくらい","hook":["重要語","幾何=いくばく。数量・程度を問う"],"story":"李白の序文「浮生若夢、為歓幾何」。人生ははかない夢のようだ","use":"歓を為すこと幾何ぞ|楽しむ時間はどれほどあろうか"},{"q":"自〜(より)","a":"〜から","hook":["重要語","自・従は起点の「より」"],"story":"論語・学而「有朋自遠方来、不亦楽乎」の自","use":"朋遠方より来たる有り|友が遠方からやって来る"},{"q":"所以(ゆえん)","a":"理由・方法","hook":["重要語","ゆえん=わけ。手段の意味もセットで"],"story":"「理由」だけ覚えると「方法・手段」の用法で失点する。両方押さえる","use":"此れ吾が去る所以なり|これが私が去る理由だ"},{"q":"蓋(けだし)","a":"そもそも・おそらく","hook":["重要語","文頭の蓋は「けだし」。推量・説き起こし"],"story":"蓋は「なんぞ〜ざる」(盍と同じ)と読む再読用法もある","use":"蓋し此れを謂ふなり|おそらくこのことを言うのだろう"},{"q":"嘗(かつて)","a":"以前に・ある時","hook":["重要語","曽も「かつて」。経験・過去"],"story":"嘗は「なむ(なめる)」とも読む。臥薪嘗胆の嘗","use":"嘗て此に遊ぶ|以前ここに遊んだ"},{"q":"須臾(しゅゆ)","a":"わずかの間","hook":["重要語","須臾=ほんの少しの時間"],"story":"荀子「勧学」の「吾嘗終日而思矣、不如須臾之所学也」","use":"須臾にして去る|わずかの間で去った"},{"q":"寡人(かじん)","a":"王侯の謙遜の自称","hook":["重要語","徳の寡ない人=王様の「わたし」"],"story":"孟子・梁恵王上「寡人之於国也」。君主がへりくだって使う一人称","use":"寡人の国に於けるや|私が国を治めることといえば"},{"q":"左右(さいう)","a":"側近の者","hook":["重要語","左右=主君のそばに仕える人"],"story":"項羽本紀「左右皆泣、莫能仰視」。方向ではなく人を指す","use":"左右皆泣く|側近たちは皆泣いた"},{"q":"人間(じんかん)","a":"世の中・俗世間","hook":["重要語","人間=じんかん。ヒトではなく世間"],"story":"「人間万事塞翁が馬」「人間到る処青山有り」の人間もこの意","use":"別に天地の人間に非ざる有り|俗世間とは別の世界がある"},{"q":"故人(こじん)","a":"古くからの友人","hook":["重要語","故人=旧友。亡くなった人ではない"],"story":"王維「送元二使安西」の「西出陽関無故人」","use":"西のかた陽関を出づれば故人無からん|西の陽関を出れば旧友もいない"},{"q":"百姓(ひゃくせい)","a":"一般の人民","hook":["重要語","百姓=ひゃくせい。農民に限らない"],"story":"論語・顔淵「百姓足、君孰与不足」。多くの姓の民=人民全体","use":"百姓足らば|人民が満ち足りれば"},{"q":"夫子(ふうし)","a":"先生(特に孔子)","hook":["重要語","夫子=門人が孔子を呼ぶ語"],"story":"論語・里仁「夫子之道、忠恕而已矣」。曽子の言葉","use":"夫子の道は忠恕のみ|先生の道は誠実と思いやりだけだ"},{"q":"君子(くんし)","a":"徳の高い立派な人","hook":["重要語","論語の理想像。小人の反対"],"story":"論語・子路「君子和而不同、小人同而不和」","use":"君子は和して同ぜず|君子は協調するが付和雷同しない"},{"q":"小人(しょうじん)","a":"徳のないつまらない人","hook":["重要語","小人=子どもではない。君子の対義語"],"story":"大学「小人閑居為不善」。暇なつまらない人はろくなことをしない","use":"小人閑居して不善を為す|つまらない人は暇だと悪いことをする"},{"q":"城(しろ)","a":"城壁で囲まれた町","hook":["注意","中国の城は町ごと城壁で囲んだもの"],"story":"杜甫「春望」の「国破山河在、城春草木深」。城=町全体","use":"城春にして草木深し|町に春が来て草木が茂る"},{"q":"兵(へい)","a":"武器・軍隊","hook":["注意","兵=兵士だけでなく武器の意が頻出"],"story":"「兵を挙ぐ」=挙兵。武器の意を問う語彙問題が定番","use":"兵を棄てて走る|武器を捨てて逃げる"},{"q":"走(はしる)","a":"逃げる","hook":["注意","漢文の走=逃走。ランニングではない"],"story":"孟子「五十歩百歩」の「棄甲曳兵而走」","use":"甲を棄て兵を曳きて走る|鎧を捨て武器を引きずって逃げる"},{"q":"去(さる)","a":"その場を離れる","hook":["注意","去=ある場所から離れていく"],"story":"現代語の「過ぎ去る」とは違い、場所から離れる意。「去秦」など","use":"秦を去る|秦の国を離れる"},{"q":"道(いふ)","a":"言う","hook":["注意","道=いふ。報道の「道」"],"story":"崔瑗「座右銘」の「無道人之短」。「みち」以外の読みが狙われる","use":"人の短を道ふこと無かれ|人の短所を言ってはならない"},{"q":"説(よろこぶ)","a":"喜ぶ","hook":["注意","説=悦。言葉で説くだけではない"],"story":"論語・学而「学而時習之、不亦説乎」の説","use":"亦た説ばしからずや|なんとうれしいことではないか"},{"q":"対(こたふ)","a":"目上に答える","hook":["注意","対へて曰はく=目下が目上に答える"],"story":"「対曰」は話し手が目下だと示す。主語判定の手がかりになる","use":"対へて曰はく|お答えして申し上げるには"},{"q":"見(まみゆ)","a":"お目にかかる","hook":["注意","見=まみゆ。目上に会う謙譲"],"story":"孟子冒頭「孟子見梁恵王」。見は受身「る・らる」の用法もある","use":"孟子梁の恵王に見ゆ|孟子は梁の恵王にお目にかかった"},{"q":"謝(しゃす)","a":"わびる・礼を言う・断る","hook":["注意","謝は三つの意味。文脈で選ぶ"],"story":"鴻門之会で沛公が項王に「謝」したのは、わびるの意","use":"鴻門に至りて謝す|鴻門に着いておわびした"},{"q":"数(しばしば)","a":"たびたび","hook":["重要語","数=しばしば。何度も"],"story":"鴻門之会「范増数目項王」。何度も目くばせして決断を促した","use":"范増数項王に目す|范増は何度も項王に目くばせした"},{"q":"具(つぶさに)","a":"詳しく","hook":["重要語","具=つぶさに。細かく全部"],"story":"陶淵明「桃花源記」で漁師が村人に「具答之」と詳しく答える","use":"具に之に答ふ|詳しくそれに答えた"},{"q":"悉(ことごとく)","a":"すべて・残らず","hook":["重要語","悉・尽・皆・咸はみな「すべて」"],"story":"現代語「知悉」の悉。読みの問題でよく出る","use":"悉く之を取る|残らずそれを取る"},{"q":"輒(すなはち)","a":"〜するときまって","hook":["重要語","輒=〜するといつも"],"story":"乃・即・則・便も「すなはち」だが、輒は「そのたびに」の意が頻出","use":"酒を得れば輒ち酔ふ|酒を手に入れるとそのたびに酔う"},{"q":"適(たまたま)","a":"ちょうどその時","hook":["重要語","適=たまたま。会・偶も同じ"],"story":"適は「ゆく」とも読み「〜へ行く」の意もある。読み分けに注意","use":"適たま至る|ちょうどその時やって来た"},{"q":"俄(にはかに)","a":"急に","hook":["重要語","俄雨の俄。突然に"],"story":"「俄而(にはかにして)」は「まもなく」の意になる","use":"俄に雨降る|急に雨が降る"},{"q":"固(もとより)","a":"もともと・もちろん","hook":["重要語","固=もとより。素も同じ読み"],"story":"論語・衛霊公「君子固窮」。君子ももとより困窮することはある","use":"君子固より窮す|君子ももちろん困窮する"},{"q":"殆(あやふし)","a":"危うい","hook":["注意","殆=あやうい。「ほとんど」とも読む"],"story":"論語・為政「学而不思則罔、思而不学則殆」","use":"思ひて学ばざれば則ち殆ふし|考えるだけで学ばなければ危うい"},{"q":"愈(いよいよ)","a":"ますます","hook":["重要語","愈=いよいよ。益(ますます)も同義"],"story":"愈は「いゆ(病気が治る)」「まさる」とも読む。読みの多さが狙われる","use":"愈其の深きを知る|ますますその深さを知る"},{"q":"然(しかり)","a":"そのとおりだ","hook":["重要語","然り=肯定の返事。否定は否(しからず)"],"story":"「然」は接続語の部品にもなる。然則・雖然・然後などで頻出","use":"曰はく、然り|言うには、そのとおりだ"},{"q":"顧(かへりみる)","a":"振り返る","hook":["注意","顧=振り返る・気にかける"],"story":"諸葛亮「出師表」の三顧は「訪ねる」の意。文脈で訳し分ける","use":"顧みて之を見る|振り返ってそれを見る"},{"q":"所謂(いはゆる)","a":"世間でいう","hook":["重要語","現代語「いわゆる」の語源"],"story":"「所」+動詞で名詞化する。「謂ふ所」と返読する点も要確認","use":"所謂大臣なる者は|世間でいう大臣というものは"},{"q":"是以(ここをもつて)","a":"こういうわけで","hook":["重要語","是以=前を受けて結論へ"],"story":"「以是」(これをもつて)とほぼ同義。因果をつなぐ接続語","use":"是を以て人之を愛す|こういうわけで人々は彼を愛する"},{"q":"於是(ここにおいて)","a":"そこで(次の行動へ)","hook":["重要語","於是=場面が次に進む合図"],"story":"物語文で直前の出来事を受けて次の行動へ移るときに使われる","use":"是に於いて兵を挙ぐ|そこで兵を起こした"},{"q":"然則(しからばすなはち)","a":"そうだとすると","hook":["重要語","然らば則ち=前を受けた結論"],"story":"論語・先進「然則師愈与」。子貢が子張と子夏を比べて問う","use":"然らば則ち師は愈れるか|そうだとすると子張の方がまさるのか"},{"q":"雖然(しかりといへども)","a":"そうではあるが","hook":["重要語","然りと雖も=認めつつ反論"],"story":"前の内容をいったん認め、反対の主張に転じる接続語","use":"然りと雖も、吾は往かん|そうではあるが私は行こう"},{"q":"匹夫(ひっぷ)","a":"身分の低い一人の男","hook":["重要語","匹夫=ただの男。匹婦は女"],"story":"論語・子罕「三軍可奪帥也、匹夫不可奪志也」","use":"匹夫も志を奪ふべからず|一人の男でもその志は奪えない"},{"q":"丈夫(じょうぶ)","a":"一人前の男子","hook":["重要語","丈夫=成人男子。健康の意ではない"],"story":"「大丈夫」も本来は立派な男の意。現代語の「じょうぶ」と区別","use":"丈夫志を立つ|男子たる者は志を立てる"},{"q":"社稷(しゃしょく)","a":"国家","hook":["重要語","社=土地の神、稷=穀物の神"],"story":"その祭りを守ることが国家を保つこと。転じて国家そのものを指す","use":"社稷を危うくす|国家を危険にさらす"},{"q":"春秋(しゅんじゅう)","a":"年齢","hook":["重要語","春秋に富む=若くて先が長い"],"story":"書名『春秋』や季節の意と区別。「春秋高し」なら高齢","use":"春秋に富む|年が若く将来がある"},{"q":"期年(きねん)","a":"まる一年","hook":["重要語","期=一回り。期月はまる一か月"],"story":"論語・子路「期月而已可也」の期月とセットで覚える","use":"期年にして国治まる|一年で国が治まった"},{"q":"就中(なかんづく)","a":"とりわけ","hook":["重要語","中に就きて→なかんづく"],"story":"現代語でも「なかんずく」と使う。読み問題で狙われる","use":"就中此の事を愛す|とりわけこのことを好む"},{"q":"少(わかし)","a":"年が若い","hook":["注意","少=わかし。少ないだけではない"],"story":"伝朱熹「少年易老学難成」。少年=若者で、子どもに限らない","use":"少くして学を好む|若い頃から学問を好んだ"},{"q":"足下(そっか)","a":"あなた(敬称)","hook":["重要語","足元から転じた二人称の敬称"],"story":"同輩や目上への呼びかけ。手紙文で多用される","use":"足下の言是なり|あなたのお言葉は正しい"},{"q":"鬼(き)","a":"死者の霊魂","hook":["注意","鬼=おにではなく死者のたましい"],"story":"論語・雍也「敬鬼神而遠之」。鬼神は霊魂や神々","use":"鬼神を敬して之を遠ざく|霊魂や神を敬いつつ距離を置く"},{"q":"光陰(こういん)","a":"月日・時間","hook":["重要語","光=日、陰=月。光陰矢の如し"],"story":"李白の序文「光陰者百代之過客」。月日は永遠の旅人","use":"光陰は百代の過客なり|月日は永遠の旅人である"},{"q":"学者(がくしゃ)","a":"学問をする人","hook":["注意","学者=学ぶ人。専門家とは限らない"],"story":"論語・憲問「古之学者為己、今之学者為人」","use":"古の学者は己の為にす|昔の学ぶ者は自分を磨くために学んだ"}],"jhist":[{"q":"墾田永年私財法","a":"743年","hook":["語呂","なじみ(743)の土地は永久に私財"],"story":"聖武天皇の時代に開墾地の永久私有を認めた法。三世一身法がうまくいかず出され、荘園が生まれるきっかけとなった。","use":"三世一身法(723年)との順番と違いが頻出。初期荘園の成立とセットで"},{"q":"大宝律令","a":"701年","hook":["語呂","慣れい(701)ざ律令国家へ"],"story":"文武天皇の時代に刑部親王・藤原不比等らが完成させた。律と令がそろった初の本格的な法典。","use":"養老律令(718年)・平城京遷都(710年)との並べ替えで出る"},{"q":"壬申の乱","a":"672年","hook":["語呂","ろくな(67)逃(2)げ場なし壬申の乱"],"story":"天智天皇の死後、弟の大海人皇子が子の大友皇子を破り即位して天武天皇となった皇位継承争い。","use":"白村江の戦い→壬申の乱→天武・持統朝の順番を押さえる"},{"q"
